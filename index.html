reception. How much will they pay?","opts":["$3.50","$5.25","$3.25","$1.75"],"ans":2}]},{"id":"R023","part":1,"category":"workplace","title":"Request for a Modified Work Schedule","text":"Subject: Re: Request for a Modified Schedule — September Onward\n\nDear Ms. Okonkwo,\n\nThank you for your email regarding your request to adjust your start time from 9:00 a.m. to 7:30 a.m. so that you can pick up your daughter from school in the afternoon.\n\nI have reviewed the request with the operations team. We are able to accommodate the earlier start on Mondays, Wednesdays, and Fridays, beginning September 8th. On Tuesdays and Thursdays, however, the department holds client calls that cannot be moved, so we would ask that you keep your current hours on those two days.\n\nPlease note that this arrangement will be reviewed after three months. If the earlier start creates difficulties for the team, we may need to revisit it, though I do not anticipate any problems and your supervisor is supportive.\n\nIf these terms work for you, reply to confirm by August 22nd and I will notify payroll so that your timesheet reflects the change.\n\nRegards,\nDaniel Brisebois\nHuman Resources","questions":[{"q":"What is the main purpose of this email?","opts":["To offer Ms. Okonkwo a promotion","To respond to a request to change working hours","To warn an employee about arriving late","To announce a new schedule for the whole department"],"ans":1},{"q":"On which days will Ms. Okonkwo keep her current start time?","opts":["Mondays and Fridays","Wednesdays only","Tuesdays and Thursdays","Every day until September 8th"],"ans":2},{"q":"The word 'accommodate' in the second paragraph is closest in meaning to:","opts":["adjust things to allow","refuse politely","pay extra for","delay until later"],"ans":0},{"q":"What can be inferred about the new arrangement?","opts":["It is permanent once it begins","It applies to all employees in the department","It could be changed after the review period","It requires a reduction in pay"],"ans":2}]},{"id":"R024","part":1,"category":"consumer","title":"Response to a Warranty Claim","text":"Subject: Re: Claim #48120 — Dishwasher Repair Request\n\nDear Mr. Halvorsen,\n\nThank you for contacting Northline Appliances about the dishwasher you purchased on March 3rd. I am sorry to hear that the unit has been leaking.\n\nYour model carries a two-year warranty that covers defective parts and labour. Based on the photographs you sent, the problem appears to be a cracked door seal, which is covered. A technician can visit your home on either August 14th or August 19th, between 1:00 and 5:00 p.m.\n\nPlease be aware that the warranty does not cover damage caused by improper installation. If the technician determines that the unit was not installed according to the manual, a service fee of $95 will be added to your invoice. Our records indicate that your dishwasher was installed by a third party rather than by our own team.\n\nReply with your preferred date, and please keep your original receipt available for the technician.\n\nSincerely,\nAmrit Bassi\nCustomer Care, Northline Appliances","questions":[{"q":"Why did Amrit Bassi write to Mr. Halvorsen?","opts":["To reject his warranty claim","To confirm that the warranty has expired","To respond to a repair request and offer appointment dates","To ask him to return the dishwasher to the store"],"ans":2},{"q":"Under what condition would Mr. Halvorsen have to pay $95?","opts":["If he cancels the appointment","If the technician finds the unit was installed incorrectly","If he cannot produce the original receipt","If the repair takes longer than one visit"],"ans":1},{"q":"The word 'defective' in the second paragraph is closest in meaning to:","opts":["expensive","faulty","missing","outdated"],"ans":1},{"q":"Why does the writer mention that a third party installed the dishwasher?","opts":["To recommend a better installer","To praise the quality of the installation","To explain why the warranty is invalid","To signal that the extra fee may apply in this case"],"ans":3}]},{"id":"R025","part":1,"category":"housing","title":"Lease Renewal and Rent Adjustment","text":"Subject: Lease Renewal and Rent Adjustment — Unit 302\n\nDear Ms. Tran,\n\nYour current lease for Unit 302 at 88 Fernwood Road expires on October 31st. We would be pleased to offer you a renewal for a further twelve months.\n\nUnder provincial guidelines, the maximum allowable rent increase this year is 2.5%. Your rent would therefore rise from $1,480 to $1,517 per month, effective November 1st. This is the first increase since you moved in two years ago.\n\nIf you choose not to renew, you must notify us in writing at least sixty days before your lease expires. Tenants who do not respond by September 1st will move to a month-to-month arrangement at the new rate, which allows either party to end the tenancy with proper notice.\n\nYour damage deposit remains on file and does not need to be topped up.\n\nPlease contact our office if you would like to discuss the terms.\n\nRegards,\nFernwood Property Management","questions":[{"q":"By how much will the monthly rent increase?","opts":["$25","$37","$60","$148"],"ans":1},{"q":"What will happen if Ms. Tran does not reply by September 1st?","opts":["Her tenancy will end on October 31st","She will continue month-to-month at the new rate","Her rent will stay at $1,480","She will be charged an additional deposit"],"ans":1},{"q":"The word 'notify' in the third paragraph is closest in meaning to:","opts":["pay","inform","persuade","permit"],"ans":1},{"q":"What does the letter suggest about the size of the rent increase?","opts":["It follows a limit set by the province","It was decided by the tenants","It is unusually large for the building","It will be repeated every six months"],"ans":0}]},{"id":"R026","part":1,"category":"community","title":"Volunteer Placement Confirmation","text":"Subject: Welcome to the Riverbend Food Hub — Orientation Details\n\nHi Sofia,\n\nThank you for applying to volunteer with the Riverbend Food Hub. We are glad to confirm your placement in the Thursday evening sorting shift, 5:00 to 8:00 p.m., beginning September 4th.\n\nTwo things are required before your first shift. First, all volunteers must complete a free online food-hygiene module, which takes about forty minutes; the link is below. Second, because our warehouse is shared with a seniors' program, you will need a criminal record check. We cover the $25 fee — simply bring the receipt and we will reimburse you.\n\nOrientation runs on August 28th at 6:00 p.m. at the Fernpark entrance, not at the main office. Parking behind the building is free after 5:00 p.m.\n\nIf your availability changes, please let us know at least a week in advance so that we can adjust the schedule. We rely on a small team, and shifts are difficult to fill at short notice.\n\nWarmly,\nBeatrice Nkemelu\nVolunteer Coordinator","questions":[{"q":"What is the main purpose of this email?","opts":["To interview Sofia for a volunteer position","To confirm a placement and explain what to do beforehand","To ask Sofia to change her preferred shift","To thank Sofia for completing her first shift"],"ans":1},{"q":"What cost will the organization cover?","opts":["Sofia’s parking during evening shifts","The online food-hygiene module","The criminal record check","Transportation to the orientation"],"ans":2},{"q":"The word 'reimburse' in the second paragraph is closest in meaning to:","opts":["pay back","reduce","record","remind"],"ans":0},{"q":"Why does Beatrice mention that shifts are difficult to fill?","opts":["To warn Sofia that she may be asked to work extra hours","To explain why the orientation is mandatory","To encourage Sofia to give early notice of any changes","To suggest that Sofia recruit her friends"],"ans":2}]},{"id":"R027","part":1,"category":"health","title":"Appointment Change and Prescription Renewal","text":"Subject: Appointment Change and Prescription Renewal — Dr. Ferreira\n\nDear Mr. Adeyemi,\n\nWe are writing to let you know that your appointment with Dr. Ferreira on Tuesday, September 9th at 2:15 p.m. must be rescheduled, as the doctor will be away that week. The next available times are Monday, September 15th at 11:00 a.m., or Thursday, September 18th at 3:30 p.m.\n\nRegarding your request to renew your blood pressure medication: Dr. Ferreira is willing to renew the prescription for three months, but not for a full year, because your last blood work was completed fourteen months ago. Please book a lab visit before your appointment so that the results are available when you come in. Fasting is required — do not eat for eight hours beforehand.\n\nIf your symptoms change before your appointment, particularly dizziness or chest discomfort, contact the clinic immediately or go to the nearest emergency department.\n\nSincerely,\nWendy Chao\nClinic Administrator, Bayline Family Practice","questions":[{"q":"Why must the appointment be rescheduled?","opts":["The patient asked for a later date","The doctor will be away that week","The lab results are not ready","The clinic is closed for renovations"],"ans":1},{"q":"Why will the prescription be renewed for only three months?","opts":["The medication is in short supply","The patient has not paid for previous visits","The patient’s blood work is more than a year old","The doctor is changing the dosage"],"ans":2},{"q":"What must Mr. Adeyemi do before the lab visit?","opts":["Avoid eating for eight hours","Stop taking his medication","Bring a copy of his prescription","Arrive with a family member"],"ans":0},{"q":"The word 'symptoms' in the third paragraph is closest in meaning to:","opts":["appointments","signs of illness","side effects of fasting","test results"],"ans":1}]},{"id":"R028","part":1,"category":"daily","title":"Snow Clearing on a Shared Lane","text":"Subject: Snow Clearing on the Shared Lane This Winter\n\nHi Marcus,\n\nI hope the summer is treating you well. I wanted to sort out the lane behind our houses before winter arrives, since last year became rather messy.\n\nAs you will remember, the contractor we used charged $600 for the season, split three ways between us, the Nakamuras, and the Pintos. He has since retired. I have collected two quotes: one company wants $840 for the season and clears the lane whenever snowfall passes five centimetres, while another wants $700 but only clears after ten centimetres.\n\nMy preference is the more expensive option, because the lower trigger means the lane stays passable and none of us has to shovel at six in the morning. I do not want to commit anyone else's money, though, so let me know what you think. If we choose the first company, each household would pay $280.\n\nCould you reply by the end of August? These companies fill their routes early.\n\nThanks,\nPriya","questions":[{"q":"How much did each household pay last winter?","opts":["$200","$233","$280","$600"],"ans":0},{"q":"Why does Priya prefer the more expensive company?","opts":["It has better equipment","It clears the lane after smaller snowfalls","It offers a discount for three households","It was recommended by the previous contractor"],"ans":1},{"q":"The word 'passable' in the third paragraph is closest in meaning to:","opts":["acceptable in quality","able to be driven through","free of charge","shared between neighbours"],"ans":1},{"q":"What does Priya want Marcus to do?","opts":["Sign the contract on behalf of everyone","Collect payment from the other households","Give his opinion before a decision is made","Find a third quote from another company"],"ans":2}]},{"id":"R029","part":2,"category":"community","title":"Northgate Community Centre — Fitness Class Schedule","tableHeaders":["Class","Days","Time","Adult Drop-in","Senior (65+)","10-Class Pass"],"tableRows":[["Morning Yoga","Mon/Wed","7:00–8:00 a.m.","$14.00","$10.00","$120.00"],["Aquafit","Tue/Thu","9:30–10:30 a.m.","$16.00","$11.50","$140.00"],["Spin Cycle","Mon–Fri","1 invoice","It is returned within five business days","It is kept if the vehicle is returned late","It is charged only on weekend rentals"],"ans":1},{"q":"A 22-year-old who has held a driving licence for eighteen months wants to rent a Cargo Van. What do the notes indicate?","opts":["They may rent with an extra deposit","They may rent only on weekdays","They do not meet the requirements to rent","They must rent a smaller vehicle"],"ans":2}]},{"id":"R034","part":2,"category":"education","title":"Continuing Education — Fall Course Offerings","tableHeaders":["Course","Format","Schedule","Weeks","Tuition","Materials"],"tableRows":[["Business Writing","In person","Tue 6:30–9:00 p.m.","8","$340.00","$45.00"],["Conversational English","In person","Mon/Wed 7:00–8:30 p.m.","10","$280.00","Included"],["Introduction to Bookkeeping","Online (live)","Thu 6:00–8:30 p.m.","12","$520.00","$80.00"],["Workplace Safety Certificate","Online (self-paced)","Any time","6","$195.00","Included"],["Public Speaking","In person","Sat 10:00 a.m.–1:00 p.m.","6","$310.00","$30.00"]],"notes":["Residents of the region receive a 20% tuition discount; proof of address is required at registration.","Withdrawal more than seven days before the start date receives a full refund; after that, 50% of tuition is retained.","Self-paced courses must be completed within ninety days of registration.","A minimum of eight students is required for an in-person course to proceed."],"questions":[{"q":"Which course can a student begin at any time?","opts":["Business Writing","Conversational English","Introduction to Bookkeeping","Workplace Safety Certificate"],"ans":3},{"q":"A resident of the region registers for Public Speaking. What tuition will they pay?","opts":["$248.00","$262.00","$278.00","$310.00"],"ans":0},{"q":"A student withdraws from Business Writing three days before it begins. What happens?","opts":["The full tuition is refunded","Half of the tuition is retained","Only the materials fee is refunded","The tuition is transferred to another course"],"ans":1},{"q":"According to the notes, why might an in-person course not run?","opts":["Fewer than eight students register","The instructor teaches another course","Materials are not included","Registration closes ninety days early"],"ans":0}]},{"id":"R035","part":3,"category":"immigration","title":"Getting a Provincial Health Card","text":"Paragraph A\nHealth care in Canada is administered by each province rather than by the federal government, which means that newcomers must apply for a health card in the province where they settle. In most provinces coverage begins on the day you arrive, but a few impose a waiting period of up to three months. During any waiting period, residents are strongly encouraged to buy private insurance, since a single emergency visit can cost thousands of dollars.\n\nParagraph B\nApplications are submitted either online or at a service centre. You will need proof of immigration status, proof of residency in the province such as a lease or a utility bill, and one piece of government-issued photo identification. Documents in a language other than English or French must be accompanied by a certified translation. Processing usually takes two to six weeks, and a temporary confirmation letter is issued so that you can access care while you wait.\n\nParagraph C\nA health card covers visits to family doctors and walk-in clinics, hospital stays, and medically necessary tests. It does not cover prescription medication taken outside a hospital, dental care, eyeglasses, or ambulance transport, all of which are paid privately or through an employer's benefit plan. Many newcomers are surprised by these gaps, having assumed that the card covers everything.\n\nParagraph D\nHealth cards expire and must be renewed, usually every five years, and the province will not always send a reminder. If you move to another province, your original coverage continues for a limited transition period before you must apply again where you now live. A lost or stolen card should be reported promptly, since it can be used by someone else to obtain services in your name.","questions":[{"q":"Which paragraph explains what a health card does not pay for?","opts":["Paragraph A","Paragraph B","Paragraph C","Paragraph D"],"ans":2},{"q":"According to Paragraph A, why is private insurance recommended?","opts":["Because provincial coverage is only partial","Because emergency care is very expensive during a waiting period","Because private clinics have shorter waiting lists","Because federal coverage does not apply to newcomers"],"ans":1},{"q":"According to Paragraph B, what is required for documents that are not in English or French?","opts":["A certified translation","A notarized photocopy","Approval from a service centre manager","A second piece of photo identification"],"ans":0},{"q":"The word 'gaps' in Paragraph C refers to:","opts":["delays in processing applications","services that the card does not cover","periods when the card has expired","differences between provinces"],"ans":1}]},{"id":"R036","part":3,"category":"consumer","title":"Building a Credit History in Canada","text":"Paragraph A\nA credit score is a number that lenders use to estimate how likely you are to repay borrowed money. Credit histories do not cross borders, so people who arrive in Canada with an excellent record in another country generally begin with no history at all. This can make it difficult to rent an apartment, obtain a phone contract, or qualify for a car loan during the first year.\n\nParagraph B\nThe most common starting point is a secured credit card, for which the bank holds a deposit equal to the credit limit. Using the card for small, regular purchases and paying the balance in full each month builds a record quickly, and most people see a usable score within six to twelve months. Some utility and telephone companies also report payment behaviour, which contributes to the same record.\n\nParagraph C\nSeveral habits damage a score. Payments made more than thirty days late are reported and remain visible for years. Carrying a balance close to the card's limit suggests financial stress even when payments are made on time, and specialists recommend using less than a third of the available limit. Applying for several products in a short period also lowers the score, because every application is recorded.\n\nParagraph D\nEvery resident may request a free copy of their credit report from each of the two national credit bureaus once a year. Errors are more common than people expect: accounts that were closed but still appear open, or debts belonging to someone with a similar name. Disputes are submitted directly to the bureau, which must investigate and respond, usually within thirty days.","questions":[{"q":"Which paragraph describes how to correct mistakes in a credit report?","opts":["Paragraph A","Paragraph B","Paragraph C","Paragraph D"],"ans":3},{"q":"According to Paragraph A, why do many newcomers begin with no credit history?","opts":["Because credit records do not transfer between countries","Because banks do not lend to new residents","Because their previous accounts were closed","Because a score requires five years of residence"],"ans":0},{"q":"According to Paragraph C, how much of a credit limit do specialists recommend using?","opts":["Less than one third","About one half","Up to two thirds","As much as can be repaid"],"ans":0},{"q":"The phrase 'financial stress' in Paragraph C suggests:","opts":["a temporary drop in income","difficulty managing money","a penalty charged by the bank","an error in the credit report"],"ans":1}]},{"id":"R037","part":3,"category":"workplace","title":"Workplace Accommodation and Your Rights","text":"Paragraph A\nCanadian employment law requires employers to adjust working conditions for employees who cannot perform their duties in the usual way because of a disability, a chronic illness, family responsibilities, or religious observance. This obligation is known as the duty to accommodate. An accommodation might be a modified schedule, different equipment, permission to work from home, or a temporary change in tasks.\n\nParagraph B\nAn employee begins the process simply by informing the employer that an adjustment is needed. The request does not have to take any particular form, though putting it in writing is wise. The employer may ask for medical documentation confirming the limitation and how long it is expected to last, but is not entitled to know the diagnosis itself. Many employees share far more medical detail than the law requires.\n\nParagraph C\nThe duty is not unlimited. An employer may refuse if the change would cause what the law calls undue hardship — for example, if the cost would threaten the survival of a small business, or if the adjustment would create a genuine safety risk to others. Inconvenience alone, or complaints from co-workers, does not meet this standard, and employers who rely on such arguments usually lose.\n\nParagraph D\nIf a reasonable request is refused, the employee may file a complaint with the provincial human rights tribunal, generally within one year of the refusal. Tribunals can order an employer to provide the accommodation and to pay compensation. Employees are protected against retaliation for filing, although retaliation can be difficult to prove, which is why keeping dated records of every conversation is strongly advised.","questions":[{"q":"Which paragraph explains when an employer is permitted to refuse a request?","opts":["Paragraph A","Paragraph B","Paragraph C","Paragraph D"],"ans":2},{"q":"According to Paragraph B, what is an employer NOT entitled to know?","opts":["How long the limitation is expected to last","The employee’s specific diagnosis","Whether the employee has seen a doctor","What adjustment the employee is requesting"],"ans":1},{"q":"According to Paragraph D, why should employees keep dated records?","opts":["Tribunals require them before accepting a complaint","Employers must copy them into the personnel file","Retaliation is otherwise difficult to prove","They shorten the one-year filing period"],"ans":2},{"q":"The phrase 'undue hardship' in Paragraph C refers to:","opts":["a difficulty serious enough to excuse the employer","the effort required of the employee","a delay in providing the accommodation","the discomfort felt by co-workers"],"ans":0}]},{"id":"R038","part":3,"category":"environment","title":"Why Recycling Loads Get Rejected","text":"Paragraph A\nMunicipal recycling depends on separating materials cleanly enough that processors can sell them. When items that do not belong end up in a recycling bin, the load is described as contaminated. A small amount of contamination can be removed by hand at a sorting facility, but beyond roughly five per cent, the cost of cleaning the material exceeds what the finished product is worth.\n\nParagraph B\nThe most frequent mistakes are surprisingly consistent from city to city. Greasy pizza boxes, coffee cups with plastic linings, plastic bags, and containers still holding food residue account for most rejected material. Many residents also practise what the industry calls wishful recycling — placing an item in the bin because it seems as though it ought to be recyclable, rather than checking whether it is accepted.\n\nParagraph C\nOnce a load is judged too contaminated, it is not cleaned but sent to landfill in its entirety, including the material that was sorted correctly. This is why a single bag of household garbage left in a shared apartment recycling room can waste the careful effort of dozens of neighbours. Processors reject loads at the receiving dock, before the truck is even unloaded.\n\nParagraph D\nCities generally respond in stages rather than with immediate penalties. Collection crews leave a coloured tag on the bin explaining what was wrong and decline to empty it that week. Repeated problems at an apartment building lead to an audit and a written notice to the property manager, and only then to fines, which are usually charged to the building owner rather than to individual residents.","questions":[{"q":"Which paragraph gives examples of items that people wrongly place in recycling bins?","opts":["Paragraph A","Paragraph B","Paragraph C","Paragraph D"],"ans":1},{"q":"According to Paragraph C, what happens to correctly sorted items in a contaminated load?","opts":["They are separated and processed normally","They are stored until the next collection","They go to landfill along with everything else","They are returned to the building that sent them"],"ans":2},{"q":"According to Paragraph D, who normally pays a fine at an apartment building?","opts":["The building owner","The individual resident responsible","The collection company","The municipality itself"],"ans":0},{"q":"The term 'wishful recycling' in Paragraph B describes:","opts":["recycling more than is required by the city","putting an item in the bin without checking whether it is accepted","hoping that a contaminated load will be cleaned","asking neighbours to sort waste more carefully"],"ans":1}]},{"id":"R039","part":3,"category":"health","title":"Finding Medical Care Without a Family Doctor","text":"Paragraph A\nA family doctor provides continuing care: they hold your complete medical history, manage long-term conditions, and refer you to specialists. In much of Canada, however, demand exceeds supply, and waiting lists in some regions run to several years. Provinces maintain central registries where residents without a doctor can add their names, and registering early matters, because the wait is counted from the date of registration rather than from the date of arrival.\n\nParagraph B\nWalk-in clinics fill the gap for immediate, minor problems — an infection, a rash, the renewal of a routine prescription. Because the doctor seeing you is unlikely to know your history, walk-ins are poorly suited to complex or ongoing conditions, and most will not manage a chronic illness or order extensive testing. Waiting times vary enormously by time of day, and many clinics stop accepting patients hours before they close.\n\nParagraph C\nHospital emergency departments treat patients according to the seriousness of their condition rather than the order in which they arrive, a system known as triage. Someone with chest pain will be seen ahead of someone who has waited for hours with a sprained ankle. Urgent care centres sit between walk-in clinics and emergency departments, handling injuries such as fractures that require imaging but not admission to hospital.\n\nParagraph D\nSeveral other options remain underused. Nurse practitioners can diagnose, prescribe, and order tests independently in most provinces. Provincial telehealth lines offer free advice from a registered nurse at any hour of the day. Pharmacists in many provinces may now renew prescriptions and treat a short list of minor conditions without a doctor's involvement, which is often the fastest route for a straightforward problem.","questions":[{"q":"Which paragraph explains why patients are not treated in the order they arrive?","opts":["Paragraph A","Paragraph B","Paragraph C","Paragraph D"],"ans":2},{"q":"According to Paragraph A, why should residents join a registry as soon as possible?","opts":["Because registration closes after the first year","Because waiting time is counted from the date of registration","Because early applicants pay a lower fee","Because specialists require a registry number"],"ans":1},{"q":"According to Paragraph B, what are walk-in clinics least suited to handle?","opts":["Minor infections","Routine prescription renewals","Ongoing or complex conditions","Patients arriving early in the day"],"ans":2},{"q":"The word 'underused' in Paragraph D suggests that these options are:","opts":["available but not chosen as often as they could be","too expensive for most residents","restricted to patients with a family doctor","no longer offered in most provinces"],"ans":0}]},{"id":"R040","part":3,"category":"civic","title":"How a Municipal Bylaw Is Made","text":"Paragraph A\nA bylaw is a rule made by a municipal council that applies only within that city or town. Bylaws govern matters such as noise, parking, property standards, business licensing, and what may be built where. They cannot conflict with provincial legislation; where the two disagree the provincial rule prevails, and a court may strike down a bylaw that exceeds the authority the province has granted.\n\nParagraph B\nMost bylaws begin as a proposal from a councillor or from city staff responding to a recurring problem. Staff prepare a report setting out the likely costs, the legal implications, and how other municipalities have handled the same issue. Council then votes at several separate meetings, often called readings, which allows time for objections to surface between votes rather than all at once at the end.\n\nParagraph C\nBefore a significant bylaw is adopted, council must hold a public consultation. Residents may speak at a public meeting, usually for five minutes each, or submit written comments, which carry the same formal weight and are often more effective because they can include evidence. Turnout at these meetings is typically very low, so a small number of organised residents can have an influence out of proportion to their numbers.\n\nParagraph D\nEnforcement is largely complaint-driven. Bylaw officers rarely patrol in search of violations; they respond when a resident reports one, which means that identical problems may be treated very differently in different neighbourhoods. Officers generally issue a warning and a deadline for compliance before any fine, and most disputes are resolved at that stage without a ticket ever being written.","questions":[{"q":"Which paragraph explains how residents can influence a bylaw before it is adopted?","opts":["Paragraph A","Paragraph B","Paragraph C","Paragraph D"],"ans":2},{"q":"According to Paragraph A, what happens when a bylaw conflicts with provincial law?","opts":["The provincial law applies","The bylaw applies within city limits","Council must hold a new vote","The two rules apply equally"],"ans":0},{"q":"According to Paragraph D, why might the same violation be handled differently in two neighbourhoods?","opts":["Because fines differ by neighbourhood","Because officers patrol wealthier areas more often","Because enforcement depends on whether someone complains","Because bylaws apply only to certain districts"],"ans":2},{"q":"The phrase 'out of proportion to their numbers' in Paragraph C suggests that a few residents can have influence that is:","opts":["greater than their small numbers would suggest","shared equally with all other residents","limited to written submissions only","reduced when turnout is low"],"ans":0}]},{"id":"R041","part":4,"category":"civic","title":"Should Alderbrook Build a New Library or Repair Its Roads?","intro":"Alderbrook city council has $12 million in unspent infrastructure funding and must choose between building a new library branch in the fast-growing east end and resurfacing forty kilometres of residential streets. Residents were invited to comment.","comments":[{"name":"Yvonne Castellanos","text":"Build the library, and do not apologise for it. The east end has added twelve thousand people in six years and still has no public building of any kind. A library is where people without money go to study, apply for jobs, and stay warm in February. Roads get repaired somewhere every single year; a branch like this gets built once in a generation."},{"name":"Reg Duffield","text":"I have driven Bramble Road every day for eleven years and it is genuinely dangerous now. The potholes have cost me two tires and an alignment. I am not against libraries, but a road that everyone uses daily has to come before a building that only a fraction of residents will ever visit. Maintain what we already own before we build something new."},{"name":"Marguerite Osei","text":"The building is the cheap part. The last branch we opened was closed on evenings and weekends within three years because nobody funded the staff. I will support the library, but only if council commits in the same vote to an operating budget that guarantees evening hours. Otherwise we will have a beautiful empty box and the identical argument in five years."},{"name":"Hassan Rahimi","text":"What troubles me is that these are the only two options on the table. The consultation ran for eleven days in July and the survey asked us to choose one of the two. Nobody asked whether the money might be better spent on the flooding on Marsh Lane, which the city has known about since 2019. I would rather council paused and asked a wider question."}],"questions":[{"q":"Which commenter supports building the library without attaching any conditions?","opts":["Yvonne Castellanos","Reg Duffield","Marguerite Osei","Hassan Rahimi"],"ans":0},{"q":"Marguerite Osei’s support for the library depends on:","opts":["the branch being built in the east end","council also funding the cost of running it","the roads being repaired first","a longer public consultation"],"ans":1},{"q":"Which commenter criticises the way the decision is being made rather than either project itself?","opts":["Yvonne Castellanos","Reg Duffield","Marguerite Osei","Hassan Rahimi"],"ans":3},{"q":"What is Reg Duffield’s main argument?","opts":["Libraries are no longer used by most residents","Existing infrastructure used by everyone should be maintained first","The east end already receives too much funding","Road repairs would create more local jobs"],"ans":1}]},{"id":"R042","part":4,"category":"workplace","title":"Is the Four-Day Work Week Working?","intro":"Kestrel Logistics has spent six months trialling a four-day work week with no reduction in pay. The company has asked staff and local residents to share their views before deciding whether to make the change permanent.","comments":[{"name":"Tomas Iversen","text":"Six months in, our department has shipped the same volume with one fewer day. Meetings that used to fill an afternoon now take twenty minutes because nobody has time to waste. I sleep properly, I see my parents on Fridays, and I have stopped looking at job postings. Make it permanent and stop treating it as an experiment."},{"name":"Della Whitcombe","text":"On paper it is four days. In practice I now work from seven in the morning until seven at night to fit everything in, and my daycare closes at six. The work did not disappear; it was compressed. For anyone with young children, a longer day is worse than a fifth day, and nobody asked us about that before the trial started."},{"name":"Ngozi Balogun","text":"My objection is not the idea but who gets it. The trial covers office staff. The warehouse crew and the drivers, who arguably need the rest more, were told their roles were not compatible. If a benefit is only available to the people who already have the most comfortable jobs, it is not a company policy, it is a perk. Extend it to everyone or drop it."},{"name":"Frank Lemieux","text":"I would like to see another year of data before anyone declares victory. Six months covers a slow season, and people try hard during a trial because they want it to succeed. That is a well-known effect. I am not opposed in principle at all, but the numbers so far cannot tell us what happens in December, and I would rather decide on evidence."}],"questions":[{"q":"Which commenter objects mainly on the grounds of fairness between different groups of employees?","opts":["Tomas Iversen","Della Whitcombe","Ngozi Balogun","Frank Lemieux"],"ans":2},{"q":"Which commenter neither supports nor opposes the change at this stage?","opts":["Tomas Iversen","Della Whitcombe","Ngozi Balogun","Frank Lemieux"],"ans":3},{"q":"What is Della Whitcombe’s main complaint?","opts":["Her pay was reduced along with her hours","The same amount of work is squeezed into longer days","Her department was excluded from the trial","The trial period was too short to judge"],"ans":1},{"q":"The word 'compressed' in Della Whitcombe’s comment is closest in meaning to:","opts":["reduced in amount","shared among more people","squeezed into less time","delayed until later"],"ans":2}]},{"id":"R043","part":4,"category":"housing","title":"Should Short-Term Rentals Be Restricted?","intro":"The town of Cape Marion is considering a bylaw that would permit short-term rentals only in a property that is the owner’s principal residence. Residents submitted the following comments.","comments":[{"name":"Ines Provencher","text":"Four buildings on my street are now entirely short-term units. The families who lived in them moved forty minutes inland because nothing here is affordable any more. Housing is for housing. A town cannot function when the people who staff its clinics and schools cannot afford to sleep in it. Pass the bylaw, and pass it this year."},{"name":"Gordon Strachan","text":"I rent out the basement suite for eleven weeks each summer, and that income is what keeps me in a house I have owned since 1998. Under this bylaw I would still qualify, but the tone of this debate treats every host as a speculator. Visitors also spend money at the bakery and the hardware store. Do not solve one problem by destroying the summer economy."},{"name":"Amelia Duong","text":"I agree with the goal entirely, but I have watched this town pass rules it never enforces. We already require a licence for short-term rentals and roughly a third of the listings do not have one. Adding another rule without hiring a single officer to check it simply punishes the people who were honest in the first place. Fund enforcement or do not bother."},{"name":"Rafael Sandoval","text":"Everyone is arguing about the wrong thing. Cape Marion approved eleven new homes last year for a population that grew by four hundred. Short-term rentals are a symptom, not the cause. Restrict them and the same shortage will still be here, only now with fewer visitors. Until we build, we are just moving the problem around."}],"questions":[{"q":"Which commenter supports the goal of the bylaw but doubts it will be properly applied?","opts":["Ines Provencher","Gordon Strachan","Amelia Duong","Rafael Sandoval"],"ans":2},{"q":"What does Rafael Sandoval believe is the real cause of the problem?","opts":["Too few new homes are being built","Visitors are spending too little in town","The licence fee is too low","Owners are renting out their principal residences"],"ans":0},{"q":"Which commenter would still be allowed to rent under the proposed bylaw?","opts":["Ines Provencher","Gordon Strachan","Amelia Duong","Rafael Sandoval"],"ans":1},{"q":"Ines Provencher’s comment emphasises that:","opts":["local workers can no longer afford to live in town","tourists behave poorly in residential buildings","property taxes have risen too quickly","the bylaw should be delayed until next year"],"ans":0}]},{"id":"R044","part":4,"category":"environment","title":"A Proposed Ban on Single-Use Containers","intro":"A proposed municipal bylaw would prohibit restaurants from providing single-use plastic containers for takeout orders within eighteen months. The city published the following responses from residents and business owners.","comments":[{"name":"Wesley Achebe","text":"We have discussed this for a decade while the shoreline cleanup crews pull the same containers out of the creek every spring. Compostable and reusable alternatives exist and are already used by three restaurants on Beckett Street without any drama. At some point a city has to stop consulting and act. I support the bylaw exactly as written."},{"name":"Corinne Vasilyev","text":"I run a twelve-seat restaurant on a margin of about four per cent. Compostable containers cost me between two and three times as much as what I use now, and I cannot raise prices again this year without losing the customers I have left. I am not defending plastic. I am telling you that this bylaw, as written, closes small kitchens and leaves the chains standing."},{"name":"Dmitri Lakhani","text":"Both of the above are right, which is why the answer is design rather than delay. Give small businesses a three-year timeline instead of eighteen months, and use the existing green business fund to cover the first year of the price difference for restaurants under twenty seats. The chains can absorb the cost immediately. Phase it, fund it, and it passes."},{"name":"Bridget Ferrand","text":"I sort my waste and I will follow whatever rule passes, but let us be honest about scale. Restaurant takeout is a small share of the plastic entering the landfill; construction waste and packaging from online shopping dwarf it. This bylaw will make us feel we have acted while the actual volume barely moves. I would rather we spent the effort where the tonnage is."}],"questions":[{"q":"Which commenter proposes a compromise that addresses the concerns of small businesses?","opts":["Wesley Achebe","Corinne Vasilyev","Dmitri Lakhani","Bridget Ferrand"],"ans":2},{"q":"What is Bridget Ferrand’s main point?","opts":["The ban would be too expensive for restaurants","The ban targets a small part of the overall problem","Compostable containers are not truly compostable","The eighteen-month timeline is too short"],"ans":1},{"q":"According to Corinne Vasilyev, who would be least affected by the bylaw?","opts":["Small independent kitchens","Large restaurant chains","Customers ordering takeout","Suppliers of compostable containers"],"ans":1},{"q":"Which commenter supports the bylaw in its current form?","opts":["Wesley Achebe","Corinne Vasilyev","Dmitri Lakhani","Bridget Ferrand"],"ans":0}]},{"id":"R045","part":4,"category":"education","title":"Should Phones Be Banned During School Hours?","intro":"The Rockvale School Board is considering a policy that would require students to store their phones in lockers from the first bell until dismissal. Teachers, parents, and students were asked for their views.","comments":[{"name":"Nadine Kowalczyk","text":"I have taught for nineteen years and the change since 2018 is not subtle. I no longer compete with a classmate whispering; I compete with an algorithm designed by professionals to hold attention. In the two classes where we trialled a locked pouch, discussion returned within about three weeks. Ban them for the whole day and let teachers teach."},{"name":"Owen Mbeki","text":"My daughter takes two buses home and the second one is often cancelled without notice. A locker at school does her no good standing at a stop at 4:40 in the dark. I understand the classroom argument and I do not dispute it, but any policy that cuts a parent off from a child for seven hours has to explain what happens when something goes wrong."},{"name":"Priyanka Raghavan","text":"Students are not arguing for phones in class. Take them during lessons and most of us would quietly be relieved. But lunch is the one hour that belongs to us, and treating a sixteen-year-old like a nine-year-old for that hour breeds exactly the sneaking around the board says it wants to stop. Restrict class time, leave breaks alone."},{"name":"Hector Solano","text":"As a principal I want this to succeed, which is why I am asking the board to be honest about who does the work. A ban is not a policy until someone confiscates the first phone and calls the first angry parent, and that will be my staff, every day. Give us clear consequences, board-level backing, and a place to store them, or the policy will quietly stop being enforced by November."}],"questions":[{"q":"Which commenter supports restricting phones only during lessons?","opts":["Nadine Kowalczyk","Owen Mbeki","Priyanka Raghavan","Hector Solano"],"ans":2},{"q":"What is Owen Mbeki’s main concern?","opts":["His daughter’s marks will suffer","He could not reach his child in an emergency","Phones are too expensive to store in lockers","Teachers will spend class time enforcing the rule"],"ans":1},{"q":"Hector Solano’s comment is mainly about:","opts":["whether phones harm learning","whether students deserve free time","whether the policy can actually be enforced","whether parents were properly consulted"],"ans":2},{"q":"What evidence does Nadine Kowalczyk give for her position?","opts":["A survey of parents at her school","Provincial test results from 2018","The outcome of a trial in two of her classes","Advice from the school board’s lawyers"],"ans":2}]},{"id":"R046","part":4,"category":"community","title":"Should Backyard Hens Be Allowed in the City?","intro":"A proposed amendment to the Fairhaven animal bylaw would allow households to keep up to four hens in a residential backyard. Roosters would remain prohibited. Residents submitted these comments.","comments":[{"name":"Josephine Adeyemi","text":"Four hens produce roughly a dozen eggs a week, eat kitchen scraps that would otherwise go in the green bin, and are quieter than the dog three doors down. My sister has kept hens in Fairfield for six years without a single complaint from a neighbour. This is a small, sensible change and I cannot see what we are protecting ourselves from."},{"name":"Bruce Tanaka","text":"Nobody in this debate has lived beside a poorly kept coop. Feed left outdoors attracts rats, and once they are established they do not stay in one yard. I also know how this ends: a neighbour keeps hens badly, the person next door complains, and two households stop speaking for a decade. Our lots are twenty-eight feet wide. This is not farmland."},{"name":"Lena Ostrowski","text":"I keep hens myself and I would still vote against the amendment as drafted, because it sets no standards at all. Require registration, a minimum distance from the property line, a closed feed container, and a written plan for what happens to the birds when they stop laying. Every one of Bruce’s objections is about bad coops, and bad coops are a solvable problem."},{"name":"Curtis Nwachukwu","text":"I have no strong feeling about hens. What I know is that our bylaw department has four officers for a city of ninety thousand and a backlog on noise complaints running to seven weeks. Whatever rules we write, nobody will be checking coops. Passing a detailed bylaw that will not be enforced is worse than passing nothing, because it tells residents the rules are optional."}],"questions":[{"q":"Which commenter keeps hens but opposes the amendment as it is currently written?","opts":["Josephine Adeyemi","Bruce Tanaka","Lena Ostrowski","Curtis Nwachukwu"],"ans":2},{"q":"What is Bruce Tanaka’s main objection?","opts":["Hens are noisier than other pets","Poorly kept coops attract pests and cause disputes","Eggs from backyard hens are unsafe to eat","The bylaw would be too expensive to administer"],"ans":1},{"q":"Curtis Nwachukwu’s comment focuses on:","opts":["the benefits of keeping hens","the city’s inability to enforce the rules","the size of residential lots","the treatment of hens that stop laying"],"ans":1},{"q":"Which commenter argues that the objections raised by others could be fixed by better rules?","opts":["Josephine Adeyemi","Bruce Tanaka","Lena Ostrowski","Curtis Nwachukwu"],"ans":2}]},{"id":"X-R001","part":1,"partLabel":"Reading Correspondence","title":"Saturday Garden Shift","category":"civic","text":"Subject: Saturday Garden Shift\n\nHello volunteers,\n\nBecause Environment Canada is forecasting extreme heat, Saturday's community-garden shift will begin at 8:00 a.m. instead of 10:00 a.m. We should finish by 10:30. Our main job is to spread mulch on the south beds before the soil dries out. First-time volunteers should meet me beside the tool shed at 7:45 for a short orientation. Please bring a filled water bottle. Gloves and tools will be provided. The food-bank pickup is still scheduled for Monday, so do not harvest any tomatoes this weekend. The street beside the garden will be closed for a festival. The Route 6 bus will stop one block east, and bicycle racks remain accessible. If the new time prevents you from attending, email me by noon Thursday so I can adjust the teams.\n\nThanks, Priya","questions":[{"q":"Why was the volunteer shift rescheduled?","opts":["The garden is hosting a festival.","The food bank requested an early pickup.","Very hot weather is expected.","The tool shed will close at noon."],"ans":2,"explanation":"The first paragraph says the shift was moved because extreme heat is forecast."},{"q":"What should a first-time volunteer do?","opts":["Meet Priya at 7:45.","Harvest tomatoes first.","Wait at the Route 6 stop.","Bring gardening gloves."],"ans":0,"explanation":"New volunteers are asked to meet beside the tool shed at 7:45."},{"q":"Which item will volunteers receive at the garden?","opts":["Festival passes","Bus tickets","Water bottles","Gloves"],"ans":3,"explanation":"The email says gloves and tools will be provided."},{"q":"What must volunteers do if they cannot attend?","opts":["Attend the festival instead.","Find their own replacement.","Email Priya by Thursday noon.","Call the food bank on Monday."],"ans":2,"explanation":"Priya asks for an email by noon Thursday so she can reorganize the teams."}],"sourceSet":"R1","origin":"codex-original-unofficial-2026-07-28"},{"id":"X-R002","part":2,"partLabel":"Reading to Apply a Diagram","title":"Riverside Recreation Summer Programs","category":"civic","questions":[{"q":"Which program best meets all of Maya's preferences?","opts":["Trail Conditioning","Weekend Strength","Gentle Yoga","Aqua Fit"],"ans":2,"explanation":"Gentle Yoga is an evening, low-impact class costing under $70 and lists no special equipment."},{"q":"Why is Trail Conditioning unsuitable?","opts":["It is high impact.","It requires indoor sandals.","It exceeds her budget.","It is held too early."],"ans":0,"explanation":"Maya must avoid high-impact exercise."},{"q":"What extra item would Maya need for Aqua Fit?","opts":["Weights","A yoga mat","Indoor sandals","Rain clothing"],"ans":2,"explanation":"The chart notes that pool programs require indoor sandals."},{"q":"Which statement about Trail Conditioning is correct?","opts":["It is the least expensive option.","It runs twice a week.","It takes place in Studio B.","It is cancelled in all rain."],"ans":0,"explanation":"At $48, Trail Conditioning costs less than all the other listed programs."}],"sourceSet":"R1","origin":"codex-original-unofficial-2026-07-28","tableRows":[["Aqua Fit — Mon/Wed 6:30 p.m.","Low impact","$72","Pool"],["Trail Conditioning — Tue 7:00 p.m.","High impact","$48","Outdoors"],["Gentle Yoga — Thu 5:30 p.m.","Low impact","$64","Studio B"],["Weekend Strength — Sat 9:00 a.m.","Medium impact","$55","Fitness room"]],"notes":["Registration includes eight classes. Pool programs require indoor sandals. Outdoor programs continue in light rain.","Message from Maya: I want an evening class after work. My physiotherapist told me to avoid high-impact exercise while my knee heals. I can spend up to $70, and I would rather not buy special equipment."],"tableHeaders":["Program and schedule","Impact level","Fee","Location"]},{"id":"X-R003","part":3,"partLabel":"Reading for Information","title":"Repair Cafes","category":"civic","text":"A. A repair cafe is a temporary community event where residents bring broken household items and work with volunteers to fix them. The emphasis is not simply on receiving a free repair. Visitors are encouraged to observe, ask questions, and participate so that they gain practical skills.\n\nB. Organizers usually recruit volunteers with different specialties, such as sewing, electronics, bicycle maintenance, and small-appliance repair. Not every object can be saved. Items with swollen batteries, severe water damage, or unavailable replacement parts may have to be refused for safety reasons.\n\nC. Municipalities support these events because extending the life of products can reduce waste. However, measuring the environmental impact is complicated. A repaired item might still consume more energy than a newer model, and participants may drive long distances to attend.\n\nD. The social benefit is easier to notice. People who might never meet in daily life spend time solving a shared problem. Some visitors later become volunteers, while others begin repairing simple items for neighbours. In this way, an event designed around objects can strengthen community relationships.","questions":[{"q":"Which paragraph explains why some objects cannot be accepted?","opts":["C","A","B","D"],"ans":2,"explanation":"Paragraph B lists safety and parts-related reasons for refusing objects."},{"q":"Which paragraph questions whether every repair has a clear environmental benefit?","opts":["D","B","A","C"],"ans":3,"explanation":"Paragraph C describes energy use and travel as complications."},{"q":"What is the main purpose described in Paragraph A?","opts":["Certifying professional technicians","Collecting broken products","Teaching people while repairing","Selling replacement parts"],"ans":2,"explanation":"Visitors participate so they learn practical repair skills."},{"q":"What outcome is highlighted in Paragraph D?","opts":["Lower electricity prices","More municipal regulations","Stronger community connections","Fewer volunteer specialties"],"ans":2,"explanation":"The paragraph focuses on people meeting and helping one another."}],"sourceSet":"R1","origin":"codex-original-unofficial-2026-07-28"},{"id":"X-R004","part":4,"partLabel":"Reading for Viewpoints","title":"Downtown Car-Free Pilot","category":"civic","questions":[{"q":"Which commenter most strongly emphasizes the pilot’s benefit to local businesses?","opts":["Ethan Brooks","Sofia Rahman","Lena Ostrowski","Caleb Wong"],"ans":0,"explanation":"Ethan cites increased evening customers and longer visits as reasons to make the change permanent."},{"q":"Who argues that the pedestrian average may hide unequal access for particular groups?","opts":["Caleb Wong","Ethan Brooks","Lena Ostrowski","Sofia Rahman"],"ans":2,"explanation":"Lena says the overall average does not show whether seniors or people with disabilities can reach essential services."},{"q":"Which pair agrees that accessibility measures should be evaluated before a permanent decision?","opts":["Ethan Brooks and Caleb Wong","Ethan Brooks and Sofia Rahman","Lena Ostrowski and Sofia Rahman","Lena Ostrowski and Caleb Wong"],"ans":2,"explanation":"Both Lena and Sofia want accessibility needs assessed before the closure becomes permanent."},{"q":"Which commenter gives the most unconditional support for making the street permanently car-free?","opts":["Ethan Brooks","Lena Ostrowski","Caleb Wong","Sofia Rahman"],"ans":0,"explanation":"Ethan recommends making the change permanent, whereas the others call for conditions, further testing, or delay."}],"sourceSet":"R1","origin":"codex-original-unofficial-2026-07-28","intro":"A six-month car-free pilot on two downtown blocks has divided local businesses. Restaurant owners report fuller patios and more evening visitors. A pharmacy owner, however, says customers with mobility limitations now struggle to reach the store. City data show pedestrian traffic rose 18 percent, while nearby parking garages were rarely full. The transportation department proposes keeping one delivery lane open each morning and adding two accessible drop-off spaces.","comments":[{"name":"Ethan Brooks","text":"The pilot has brought more people downtown and made the street far more inviting. Our restaurant serves more evening customers, and the quieter blocks encourage visitors to stay longer. The morning delivery lane addresses the main operational concern. The city should make the change permanent instead of returning valuable public space to through traffic."},{"name":"Sofia Rahman","text":"A lively street is welcome, but essential services must remain reachable. My father cannot walk from a parking garage to the pharmacy, and a busy drop-off space may not solve that problem. The city should delay a permanent decision until accessible parking is tested with seniors and residents who have mobility limitations."},{"name":"Lena Ostrowski","text":"The pilot should continue, but the city must stop treating accessibility as an afterthought. Increased foot traffic is encouraging, yet averages do not show whether seniors or people with disabilities can reach essential services. The proposed drop-off spaces are a reasonable start. The city should also consult affected residents before making the closure permanent."},{"name":"Caleb Wong","text":"The pilot is worth extending for another year. The garages still have capacity, and morning access should protect deliveries. During the extension, the city can monitor the new drop-off spaces and adjust them if they are regularly occupied. A measured trial is more sensible than either cancelling the project or declaring it permanent today."}]},{"id":"X-R005","part":1,"partLabel":"Reading Correspondence","title":"Elevator Work and Parcel Access","category":"workplace","text":"Subject: Elevator Work and Parcel Access\n\nDear residents,\n\nElevator A will be unavailable from Tuesday through Friday while its control system is replaced. Elevator B will remain in service, but movers may not reserve it during those four days. Anyone expecting a furniture delivery should arrange a new date. The parcel room is located beside Elevator A. To keep the work area safe, residents must collect parcels through the temporary desk in the west lobby between 4:00 and 8:00 p.m. Please bring photo identification. Couriers will continue leaving packages with building staff, so delivery instructions do not need to be changed. Residents on floors 12 to 16 who cannot use the stairs during an emergency should update their assistance information with the office by Monday.\n\nThank you, Building Management","questions":[{"q":"What should a resident expecting furniture do?","opts":["Reserve Elevator B.","Ask the courier to use the stairs.","Change the delivery date.","Use the west-lobby desk."],"ans":2,"explanation":"Movers cannot reserve the remaining elevator, so furniture deliveries should be rescheduled."},{"q":"When can residents collect parcels?","opts":["After Elevator A reopens","All day in the parcel room","Tuesday morning only","Between 4:00 and 8:00 p.m."],"ans":3,"explanation":"The temporary west-lobby desk operates from 4:00 to 8:00 p.m."},{"q":"What must residents show at the temporary parcel desk?","opts":["A moving reservation","A delivery email","Photo identification","A building key"],"ans":2,"explanation":"The notice explicitly asks residents to bring photo identification."},{"q":"Who must contact the office by Monday?","opts":["Residents planning to move","All residents receiving parcels","Couriers using the west lobby","Some upper-floor residents needing emergency help"],"ans":3,"explanation":"Residents on floors 12-16 who may need assistance during an emergency must update their information."}],"sourceSet":"R2","origin":"codex-original-unofficial-2026-07-28"},{"id":"X-R006","part":2,"partLabel":"Reading to Apply a Diagram","title":"Employee Benefit Options","category":"workplace","questions":[{"q":"Which option best suits Jordan?","opts":["Flex Account","Complete","Basic Health","Health Plus"],"ans":1,"explanation":"Complete includes dental coverage and travel coverage for a three-week trip."},{"q":"Why is Health Plus incomplete for Jordan's needs?","opts":["It costs more than Complete.","It has no travel coverage.","It excludes prescriptions.","It requires receipt submission."],"ans":1,"explanation":"Health Plus includes dental but no travel coverage."},{"q":"Which feature makes the Flex Account unattractive to Jordan?","opts":["It has no annual limit.","It requires the employee to submit receipts.","It covers travel for too long.","It is the most expensive plan."],"ans":1,"explanation":"Jordan specifically says he does not want to submit every receipt."},{"q":"When can an employee normally change options?","opts":["Only before travelling","During enrollment or after a qualifying event","Whenever funds expire","At any payday"],"ans":1,"explanation":"The chart states the two periods when changes are allowed."}],"sourceSet":"R2","origin":"codex-original-unofficial-2026-07-28","tableRows":[["Basic Health","$18","Prescriptions 70%; no dental","None","—"],["Health Plus","$31","Prescriptions 90%; dental 60%","None","—"],["Complete","$44","Prescriptions 90%; dental 80%","30 days","—"],["Flex Account","$25","$650 annual account for eligible expenses","Not specified","Employee submits receipts; unused funds expire"]],"notes":["Changes are allowed only during annual enrollment or after a qualifying life event.","Message from Jordan: I rarely buy prescriptions, but I need two dental cleanings each year and will travel outside Canada for three weeks. I prefer predictable coverage and do not want to submit every receipt myself."],"tableHeaders":["Option","Cost per pay","Health and dental coverage","Travel coverage","Administration"]},{"id":"X-R007","part":3,"partLabel":"Reading for Information","title":"Hybrid Work Design","category":"workplace","text":"A. Early discussions about remote work often treated location as the main issue. Newer research suggests that the design of the work matters more. Employees need clear responsibilities, reliable technology, and agreed times for collaboration whether they are at home or in an office.\n\nB. Hybrid schedules can create an information gap. Decisions made during an informal office conversation may never reach colleagues working remotely. Some teams address this by recording decisions in a shared document rather than relying on memory or private messages.\n\nC. Managers sometimes respond by increasing meetings, but this can create a second problem. A calendar filled with video calls leaves little uninterrupted time for complex tasks. Short written updates may be more useful when no immediate discussion is required.\n\nD. Employees also differ in their home environments. One person may have a private office, while another shares a small apartment. Fair policies therefore focus on access to suitable workspaces and equipment instead of assuming that everyone prefers the same location.","questions":[{"q":"Which paragraph explains how to prevent remote staff from missing decisions?","opts":["B","A","D","C"],"ans":0,"explanation":"Paragraph B recommends recording decisions in a shared document."},{"q":"Which paragraph warns that a common management response can reduce focused work?","opts":["D","B","A","C"],"ans":3,"explanation":"Paragraph C warns that too many video meetings remove uninterrupted work time."},{"q":"According to Paragraph A, what matters more than location?","opts":["How work is organized","Commuting distance","Employee seniority","Office size"],"ans":0,"explanation":"The paragraph emphasizes responsibilities, technology, and collaboration design."},{"q":"What principle is recommended in Paragraph D?","opts":["Give managers private offices.","Require everyone to work remotely.","Recognize that employees have different workspace needs.","Let employees purchase all equipment themselves."],"ans":2,"explanation":"Fair policies account for differing home environments and access needs."}],"sourceSet":"R2","origin":"codex-original-unofficial-2026-07-28"},{"id":"X-R008","part":4,"partLabel":"Reading for Viewpoints","title":"Apartment Recycling Fee","category":"workplace","questions":[{"q":"Who believes rising collection costs justify introducing the fee promptly?","opts":["Gordon Lee","Priya Nair","Marcus Silva","Elena Petrova"],"ans":0,"explanation":"Gordon argues that reminders have failed and recommends starting the fee next month."},{"q":"Which pair agrees that residents need clearer information before financial penalties begin?","opts":["Marcus Silva and Elena Petrova","Gordon Lee and Priya Nair","Gordon Lee and Elena Petrova","Priya Nair and Marcus Silva"],"ans":0,"explanation":"Marcus calls for better signs and a grace period, while Elena proposes education and monitoring before a targeted fee."},{"q":"How does Marcus’s position differ from Priya’s?","opts":["Marcus wants a larger fee, while Priya wants a smaller one.","Marcus may accept a fee after better guidance, while Priya rejects household fees as unfair.","Marcus opposes education, while Priya supports it.","Marcus focuses on visitors, while Priya focuses only on collection costs."],"ans":1,"explanation":"Marcus conditionally accepts a future fee; Priya opposes charging households for mistakes that may not be theirs."},{"q":"Who recommends collecting and publishing contamination data during an education period?","opts":["Gordon Lee","Marcus Silva","Priya Nair","Elena Petrova"],"ans":3,"explanation":"Elena proposes a three-month record and a weekly report before targeted penalties are considered."}],"sourceSet":"R2","origin":"codex-original-unofficial-2026-07-28","intro":"A large apartment complex plans to charge residents $5 whenever staff find recyclable material in a garbage bag. Management says contamination has doubled collection costs and that warning notices have failed. Tenant representatives argue that the rule punishes entire households when visitors or children make mistakes. They want clearer signs and a three-month education campaign before any fee begins.","comments":[{"name":"Gordon Lee","text":"Management has already sent several reminders, yet contamination continues to increase. Every incorrect bag raises collection costs for the entire building. A modest fee gives households a reason to check their waste carefully. The policy should begin next month, with photographs available when a resident questions a charge."},{"name":"Marcus Silva","text":"A fee may eventually be necessary, but management has not made correct sorting easy. Labels in the garbage rooms are small, and the examples do not cover common packaging. Start with better signs and a short grace period. If contamination remains high after residents have clear information, a modest fee would be reasonable."},{"name":"Priya Nair","text":"Charging a household for one item is unfair because staff cannot know who placed it in the bag. Children, guests, and cleaning workers all use the same bins. Management should provide clear instructions and individual warnings, but it should not impose a fee that residents may have no realistic way to dispute."},{"name":"Elena Petrova","text":"Education should come first, but the building also needs evidence about which materials cause the most confusion. Staff could record contamination for three months and publish a simple weekly report. After that trial, a targeted fee could apply only to repeated problems that have been documented and explained."}]},{"id":"X-R009","part":1,"partLabel":"Reading Correspondence","title":"Digital Skills Workshop","category":"education","text":"Subject: Changes to the Digital Skills Workshop\n\nHi participants,\n\nThe library's Digital Skills Workshop will now take place in Meeting Room 3 because the computer lab is being upgraded. The date and start time remain Wednesday at 6:00 p.m. Since Meeting Room 3 has only twelve laptops, participants who own a laptop should bring it fully charged. Power outlets are limited. The first half of the session will cover password managers. The cloud-storage lesson has been postponed until next month, allowing us to add a longer section on identifying fraudulent emails. Please forward one suspicious message you have received to workshop@library.ca by Tuesday; remove any personal information first. If you registered for a family member, confirm that person's name so we can prepare an attendance certificate.\n\nRegards, Noah, Program Librarian","questions":[{"q":"What has changed about the workshop?","opts":["Its starting time","Its room","Its instructor","Its date"],"ans":1,"explanation":"The workshop moved from the computer lab to Meeting Room 3."},{"q":"Why should some participants bring a charged laptop?","opts":["The room has limited laptops and outlets.","The lesson is now online.","The lab charges a rental fee.","Certificates are stored on laptops."],"ans":0,"explanation":"Only twelve laptops are available and outlets are limited."},{"q":"Which topic has been delayed?","opts":["Cloud storage","Password managers","Personal-information removal","Fraudulent emails"],"ans":0,"explanation":"The cloud-storage lesson was postponed until next month."},{"q":"What should participants do before forwarding a suspicious email?","opts":["Print it.","Save it to cloud storage.","Delete personal details.","Ask a family member."],"ans":2,"explanation":"Noah asks participants to remove personal information first."}],"sourceSet":"R3","origin":"codex-original-unofficial-2026-07-28"},{"id":"X-R010","part":2,"partLabel":"Reading to Apply a Diagram","title":"North Valley College Evening Courses","category":"education","questions":[{"q":"Which course best matches Elena's goal and schedule?","opts":["Business Writing","Public Speaking","Data Basics","Project Planning"],"ans":3,"explanation":"Project Planning meets Wednesday, matches her goal, and costs $210."},{"q":"Which prerequisite does Elena satisfy for Project Planning?","opts":["A second-course registration","One year of work experience","Spreadsheet experience","A writing certificate"],"ans":1,"explanation":"She has worked for three years, exceeding the one-year requirement."},{"q":"Why is Data Basics unsuitable even before considering cost?","opts":["It has no prerequisite.","It lasts too few weeks.","It focuses on team projects.","It meets during her work shifts."],"ans":3,"explanation":"The class meets Tuesday and Thursday evenings when Elena works."},{"q":"How much is the discount for taking a second course?","opts":["$20","One free week","15 percent","$15"],"ans":2,"explanation":"The chart specifies a 15% discount."}],"sourceSet":"R3","origin":"codex-original-unofficial-2026-07-28","tableRows":[["Business Writing","Mon 6–8 p.m.","6 weeks","$180","No prerequisite"],["Data Basics","Tue/Thu 7–8:30 p.m.","5 weeks","$240","Spreadsheet experience"],["Project Planning","Wed 6–9 p.m.","4 weeks","$210","One year of work experience"],["Public Speaking","Sat 10 a.m.–1 p.m.","5 weeks","$195","No prerequisite"]],"notes":["Students receive a 15% discount when registering for a second course in the same term.","Message from Elena: I work Tuesday and Thursday evenings and every second Saturday. I want a course that will help me organize team projects. I have been employed for three years and can spend no more than $220."],"tableHeaders":["Course","Schedule","Length","Tuition","Prerequisite"]},{"id":"X-R011","part":3,"partLabel":"Reading for Information","title":"Digital Note-Taking","category":"education","text":"A. Digital notes are easy to search, copy, and reorganize. These advantages are especially useful when a project contains many sources. However, the ease of recording information can encourage students to collect material without deciding what is important.\n\nB. Handwriting is slower than typing, which may seem inefficient. That limitation can be useful: writers must summarize ideas rather than reproduce every sentence. The physical movement of writing may also provide an additional memory cue for some learners.\n\nC. Device choice is only one part of the issue. Effective note-takers review their notes soon after class, identify unclear points, and connect new information to earlier topics. Poor review habits cannot be repaired simply by buying a tablet or a better notebook.\n\nD. A combined method often works well. A student might sketch a diagram by hand during class, photograph it, and later add searchable labels. The goal is not to choose a universally superior tool but to match the method to the task.","questions":[{"q":"Which paragraph warns that convenience may reduce thoughtful selection?","opts":["B","C","D","A"],"ans":3,"explanation":"Paragraph A says easy digital collection may happen without deciding what matters."},{"q":"Which paragraph explains a possible benefit of writing more slowly?","opts":["B","D","A","C"],"ans":0,"explanation":"Slower handwriting can force the writer to summarize."},{"q":"What is the main point of Paragraph C?","opts":["Notes should be rewritten during class.","Review habits matter more than the device alone.","Tablets are better than notebooks.","Earlier topics should be deleted."],"ans":1,"explanation":"The paragraph emphasizes review and connection habits over equipment."},{"q":"What does Paragraph D recommend?","opts":["Photographing every lecture slide","Selecting methods according to the task","Using only handwritten notes","Avoiding searchable labels"],"ans":1,"explanation":"It recommends a combined, task-dependent approach."}],"sourceSet":"R3","origin":"codex-original-unofficial-2026-07-28"},{"id":"X-R012","part":4,"partLabel":"Reading for Viewpoints","title":"School Phone Pouch Policy","category":"education","questions":[{"q":"Who argues that a universal policy would reduce interruptions and avoid classroom-by-classroom disputes?","opts":["Noor Hassan","Dev Kapoor","James Walker","Ms. Caron"],"ans":3,"explanation":"Ms. Caron supports a consistent school-wide pouch rule because it would be simpler and less disruptive to enforce."},{"q":"Who proposes using a locked pouch only after an individual repeatedly misuses a phone?","opts":["Dev Kapoor","James Walker","Noor Hassan","Ms. Caron"],"ans":0,"explanation":"Dev recommends silent, hidden phones first and a pouch only as a consequence for repeated misuse."},{"q":"Which pair resists an immediate universal pouch rule, although for different reasons?","opts":["Ms. Caron and James Walker","Dev Kapoor and Noor Hassan","Noor Hassan and James Walker","Dev Kapoor and Ms. Caron"],"ans":1,"explanation":"Dev favours graduated consequences, while Noor believes classroom rules can teach responsible use."},{"q":"Whose support depends mainly on the school proving that families can make reliable emergency contact?","opts":["Ms. Caron","Noor Hassan","Dev Kapoor","James Walker"],"ans":3,"explanation":"James would support the policy only after the board publishes and tests a dependable emergency procedure."}],"sourceSet":"R3","origin":"codex-original-unofficial-2026-07-28","intro":"A school board is considering a rule requiring students to leave phones in locked classroom pouches. Teachers say notifications interrupt lessons even when students do not answer them. Some parents want children to keep phones for emergencies. The board’s proposal would let students access phones at lunch and would provide each classroom with a landline.","comments":[{"name":"Dev Kapoor","text":"Reducing distractions is worthwhile, but a single rule may create unnecessary conflict. Older students use phones to photograph assignments, check transit, and manage part-time work. Schools should require phones to stay silent and out of sight during instruction, while allowing teachers to approve academic use. Repeated misuse could then lead to a locked pouch for that student."},{"name":"Ms. Caron","text":"A universal pouch rule would be easier to enforce than a different decision in every classroom. Notifications interrupt attention even when a phone remains in a pocket, and teachers lose time debating exceptions. Students would still have access at lunch, while classroom landlines would cover genuine emergencies. Consistency is the fairest approach."},{"name":"Noor Hassan","text":"Students can learn responsible phone use only if they are allowed to practise it. Teachers should set clear rules for their own lessons and permit devices when they support learning. Locking every phone removes useful tools and treats responsible students as though they have already broken a rule."},{"name":"James Walker","text":"I could support the pouches if parents had a reliable way to reach their children. A single classroom landline may be busy or unanswered during an evacuation. Before approving the policy, the board should publish an emergency contact procedure and test it with families. Safety must come before convenience."}]},{"id":"X-R013","part":1,"partLabel":"Reading Correspondence","title":"Route 24 Detour","category":"environment","text":"Subject: Route 24 Detour Begins Monday\n\nHello riders,\n\nRoad construction will close Pine Avenue between 8th Street and Lakeshore Drive for approximately three weeks. Route 24 buses will use Cedar Street instead. The Pine Library and Market Square stops will be temporarily closed; riders can board at Cedar and 9th or at Lakeshore Station. Morning buses will leave Lakeshore Station five minutes earlier than usual to maintain connections with the commuter train. Afternoon times are unchanged, although delays are possible on Fridays because of the farmers' market. Passengers who use mobility devices may request assistance through the transit app or by calling customer service at least two hours before travel. Updated schedules are available online and at the library's temporary entrance on Oak Street.\n\nTransit Operations","questions":[{"q":"How long is the detour expected to last?","opts":["Two hours","Until Friday","About three weeks","Five days"],"ans":2,"explanation":"The road closure is expected to last approximately three weeks."},{"q":"Where can riders replace the closed Pine Library stop?","opts":["Cedar and 9th","Market Square","Pine and 8th","Oak and Friday"],"ans":0,"explanation":"Cedar and 9th is one of the two replacement boarding locations."},{"q":"Why will morning buses leave earlier?","opts":["To deliver schedules to the library","To connect with the commuter train","To help mobility-device users","To avoid the farmers' market"],"ans":1,"explanation":"The five-minute change preserves train connections."},{"q":"How far in advance should assistance be requested?","opts":["One day","Five minutes","Three weeks","At least two hours"],"ans":3,"explanation":"The notice asks for at least two hours' notice."}],"sourceSet":"R4","origin":"codex-original-unofficial-2026-07-28"},{"id":"X-R014","part":2,"partLabel":"Reading to Apply a Diagram","title":"Home Energy Rebates","category":"environment","questions":[{"q":"Which improvement best suits Omar?","opts":["High-efficiency furnace","Window sealing kit","Attic insulation","Smart thermostat"],"ans":1,"explanation":"The sealing kit targets window drafts, is low-cost, and is eligible for renters with consent."},{"q":"What must Omar keep?","opts":["A contractor's licence","An inspection report","A furnace warranty","A purchase receipt"],"ans":3,"explanation":"The window sealing rebate requires a receipt."},{"q":"Why is attic insulation unsuitable?","opts":["It is not energy efficient.","It requires a pre-inspection.","It must be completed on Friday.","It has no rebate."],"ans":1,"explanation":"Omar cannot arrange an inspection, which is required for attic insulation."},{"q":"What is the application deadline?","opts":["Within 40 days","Within 75 days","Before installation","Within 90 days of purchase"],"ans":3,"explanation":"All applications must be submitted within 90 days of purchase."}],"sourceSet":"R4","origin":"codex-original-unofficial-2026-07-28","tableRows":[["Smart thermostat","$75","Professional installation not required","—"],["Attic insulation","$600","Pre-inspection required","—"],["High-efficiency furnace","$1,000","Licensed installer required","—"],["Window sealing kit","$40","Receipt required","Rental homes eligible with owner consent"]],"notes":["Applications must be submitted within 90 days of purchase.","Message from Omar: I rent a small house and feel cold air around two windows. My landlord has approved a low-cost improvement, but I cannot arrange a home inspection or hire a contractor. I want to do the work this weekend."],"tableHeaders":["Improvement","Maximum rebate","Installation or inspection requirement","Additional condition"

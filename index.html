<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Word Rush · CELPIP 词汇冲刺</title>
<!-- PWA：可加到主屏、离线可用。单文件直接双击打开时这些会 404，无害。 -->
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#12131a">
<link rel="icon" href="./favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Word Rush">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  :root{
    --bg:#12131a; --s1:#1b1d28; --s2:#232636; --s3:#2d3145; --border:#343953;
    --t1:#f4f5fb; --t2:#a8adc4; --t3:#6f7590;
    --coral:#f47c5c; --gold:#ffd166; --teal:#43b895; --green:#4fd18b; --red:#f2637a; --blue:#6ba8ff;
    --accent:var(--coral);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{
    background:radial-gradient(1200px 600px at 50% -10%, #1c2030 0%, var(--bg) 60%);
    color:var(--t1); font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
    display:flex; justify-content:center; overflow-x:hidden;
  }
  #app{width:100%;max-width:480px;min-height:100vh;display:flex;flex-direction:column;padding:0 16px 18px}

  /* ── Top bar ─────────────────────────────── */
  .topbar{display:flex;align-items:center;gap:10px;padding:14px 2px 12px}
  .ring{position:relative;width:46px;height:46px;flex:none}
  .ring svg{transform:rotate(-90deg)}
  .ring .rt{fill:none;stroke:var(--s3);stroke-width:5}
  .ring .rf{fill:none;stroke:var(--teal);stroke-width:5;stroke-linecap:round;transition:stroke-dashoffset .5s cubic-bezier(.2,.8,.2,1)}
  .ring .rn{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800}
  .tb-mid{flex:1;min-width:0}
  .xp-line{display:flex;justify-content:space-between;font-size:11px;color:var(--t3);margin-bottom:4px}
  .xp-track{height:8px;background:var(--s2);border-radius:6px;overflow:hidden}
  .xp-fill{height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--coral));border-radius:6px;transition:width .45s cubic-bezier(.2,.8,.2,1)}
  .chip{display:flex;align-items:center;gap:4px;font-size:13px;font-weight:800;background:var(--s2);border:1px solid var(--border);padding:6px 9px;border-radius:12px;flex:none}
  .chip.flame{color:var(--gold)}
  .icon-btn{width:38px;height:38px;border-radius:12px;border:1px solid var(--border);background:var(--s2);color:var(--t1);font-size:16px;cursor:pointer;flex:none;display:flex;align-items:center;justify-content:center;transition:.15s}
  .icon-btn:hover{border-color:var(--accent)}

  .combo-bar{height:22px;display:flex;align-items:center;justify-content:center;margin:-2px 0 8px}
  .combo{font-size:14px;font-weight:900;color:var(--gold);opacity:0;transform:scale(.6);transition:.15s}
  .combo.show{opacity:1;transform:scale(1)}
  .combo.pump{animation:pump .28s ease}
  @keyframes pump{0%{transform:scale(1)}40%{transform:scale(1.35)}100%{transform:scale(1)}}

  /* ── Card ─────────────────────────────── */
  .stage{flex:1;display:flex;flex-direction:column;justify-content:center;position:relative}
  .card{background:linear-gradient(180deg,var(--s2),var(--s1));border:1px solid var(--border);border-radius:22px;padding:22px 18px 18px;box-shadow:0 18px 40px -20px #000;position:relative;overflow:hidden}
  .card.pop{animation:pop .32s cubic-bezier(.2,.9,.3,1.2)}
  @keyframes pop{0%{transform:scale(.96);opacity:.4}100%{transform:scale(1);opacity:1}}
  .card.shake{animation:shake .4s}
  @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
  .card.gold{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold),0 18px 44px -18px #ffd16688}

  .mode-tag{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--accent);background:var(--s3);padding:5px 11px;border-radius:20px;margin-bottom:16px}
  .gold-tag{color:#12131a;background:var(--gold)}

  .prompt{font-size:17px;line-height:1.5;font-weight:600;margin-bottom:18px;color:var(--t1)}
  .prompt .blank{color:var(--gold);font-weight:800;letter-spacing:1px}
  .big-word{font-size:34px;font-weight:900;letter-spacing:.5px;line-height:1.1}
  .ipa{font-size:15px;color:var(--t2);margin-top:6px;letter-spacing:.4px}
  .sub{font-size:12px;color:var(--accent);font-style:italic;margin-top:4px}

  .listen-hero{display:flex;flex-direction:column;align-items:center;gap:10px;padding:6px 0 18px}
  .listen-btn{width:96px;height:96px;border-radius:50%;border:none;background:radial-gradient(circle at 50% 35%,var(--coral),#c95238);color:#fff;font-size:40px;cursor:pointer;box-shadow:0 10px 30px -8px var(--coral);transition:transform .12s}
  .listen-btn:active{transform:scale(.92)}
  .listen-hint{font-size:12px;color:var(--t3)}

  .opts{display:flex;flex-direction:column;gap:10px;margin-top:4px}
  .opt{display:flex;align-items:center;gap:12px;text-align:left;background:var(--s3);border:1.5px solid var(--border);color:var(--t1);border-radius:14px;padding:14px 15px;font-size:16px;font-weight:600;cursor:pointer;transition:transform .1s,border-color .12s,background .12s}
  .opt:hover:not(:disabled){border-color:var(--accent);transform:translateY(-1px)}
  .opt:disabled{cursor:default}
  .opt .k{width:24px;height:24px;flex:none;border-radius:7px;background:var(--s1);color:var(--t3);font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center}
  .opt.correct{border-color:var(--green);background:#173a2c;color:#c8f7dd}
  .opt.correct .k{background:var(--green);color:#0c1f16}
  .opt.wrong{border-color:var(--red);background:#3a1822;color:#ffd0d9}
  .opt.wrong .k{background:var(--red);color:#2a0d13}

  .learn-body{display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px}
  .learn-zh{font-size:18px;font-weight:700;margin-top:14px}
  .learn-ex{font-size:14px;color:var(--t2);font-style:italic;line-height:1.5;margin-top:10px;background:var(--s3);padding:12px 14px;border-radius:12px;cursor:pointer;user-select:none;transition:background .15s}
  .learn-ex:active{background:var(--s2)}
  .ex-spk{font-style:normal;margin-left:6px;opacity:.7;font-size:13px}
  .spk{width:40px;height:40px;border-radius:12px;border:1px solid var(--border);background:var(--s3);color:var(--t1);font-size:17px;cursor:pointer;margin-top:14px}

  /* ✍️ 拼写产出模式 */
  .produce-hint{font-size:15px;color:var(--t2);margin:4px 0 14px}
  .produce-row{display:flex;gap:8px;margin-top:6px}
  .prod-in{flex:1;min-width:0;font-size:18px;padding:13px 14px;border-radius:13px;border:2px solid var(--s3);background:var(--s2);color:var(--t1);outline:none;transition:border-color .12s}
  .prod-in:focus{border-color:var(--gold)}
  .prod-in:disabled{opacity:.75}
  .produce-row .btn{width:auto;margin-top:0;padding:13px 20px;white-space:nowrap}

  .btn{width:100%;border:none;border-radius:15px;padding:15px;font-size:16px;font-weight:800;cursor:pointer;margin-top:16px;transition:filter .12s,transform .1s}
  .btn:active{transform:translateY(1px)}
  .btn-p{background:linear-gradient(180deg,var(--coral),#d95c3f);color:#fff}
  .btn-p:hover{filter:brightness(1.08)}
  .btn-g{background:var(--s3);color:var(--t1);border:1px solid var(--border)}

  .feedback{min-height:22px;text-align:center;font-size:14px;font-weight:800;margin-top:14px}
  .feedback.ok{color:var(--green)}
  .feedback.no{color:var(--red)}
  .fb-mean{font-size:13px;color:var(--t2);font-weight:600;margin-top:4px}

  /* floating +xp */
  .xpfloat{position:absolute;left:50%;top:40%;transform:translateX(-50%);font-size:26px;font-weight:900;color:var(--gold);pointer-events:none;text-shadow:0 2px 8px #000;animation:floatup 1s ease forwards}
  @keyframes floatup{0%{opacity:0;transform:translate(-50%,10px) scale(.8)}20%{opacity:1}100%{opacity:0;transform:translate(-50%,-46px) scale(1.15)}}

  /* ── Collection ─────────────────────────── */
  .view{display:none}
  .view.on{display:block}
  .coll-head{display:flex;align-items:center;justify-content:space-between;padding:6px 2px 12px}
  .coll-title{font-size:20px;font-weight:900}
  .coll-sub{font-size:12px;color:var(--t2);margin-bottom:12px}
  .sfx-box{background:var(--s2);border:1px solid var(--border);border-radius:14px;padding:12px 13px;margin-bottom:14px}
  .sfx-title{font-size:13px;font-weight:800;margin-bottom:9px}
  .sfx-hint{font-size:11px;font-weight:600;color:var(--t3);margin-left:4px}
  .sfx-row{display:flex;flex-wrap:wrap;gap:7px}
  .sfx-b{font-size:13px;font-weight:700;background:var(--s3);border:1.5px solid var(--border);color:var(--t1);border-radius:11px;padding:8px 11px;cursor:pointer;transition:.12s}
  .sfx-b:active{transform:scale(.95)}
  .sfx-b.on{border-color:var(--accent);color:var(--accent);background:#f47c5c1a}
  .sfx-desc{font-size:12px;color:var(--t2);margin-top:9px;min-height:16px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:9px;padding-bottom:20px}
  .cell{background:var(--s2);border:1px solid var(--border);border-radius:12px;padding:9px 8px;cursor:pointer;transition:.12s}
  .cell:hover{border-color:var(--accent)}
  .cell .emo{font-size:20px}
  .cell .cw{font-size:12px;font-weight:700;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cell .cz{font-size:10px;color:var(--t3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cell.locked{opacity:.4}
  .lvbar{height:4px;background:var(--s1);border-radius:3px;margin-top:6px;overflow:hidden}
  .lvbar>div{height:100%;background:var(--teal);border-radius:3px}

  /* ── Reward overlay ─────────────────────── */
  .overlay{position:fixed;inset:0;background:#0009;backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;z-index:40;padding:24px}
  .overlay.show{display:flex}
  .reward{background:linear-gradient(180deg,var(--s2),var(--s1));border:1px solid var(--border);border-radius:22px;padding:28px 24px;text-align:center;max-width:320px;width:100%;animation:pop .35s cubic-bezier(.2,.9,.3,1.2)}
  .reward .e{font-size:56px}
  .reward .t{font-size:22px;font-weight:900;margin:8px 0 4px}
  .reward .m{font-size:14px;color:var(--t2);line-height:1.5;margin-bottom:18px}

  /* confetti */
  #cnf{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}
  .cp{position:absolute;top:-12px}
  @keyframes fall{to{transform:translateY(104vh) rotate(680deg)}}

  /* ── 阅读 ─────────────────────────────── */
  .icon-btn.done{border-color:var(--teal);color:var(--teal)}
  .rd-title{font-size:18px;font-weight:900;line-height:1.3}
  .rd-meta{font-size:11px;color:var(--t3);letter-spacing:.6px;text-transform:uppercase;margin:4px 0 10px}
  .rd-passage{background:var(--s2);border:1px solid var(--border);border-radius:16px;padding:14px 15px;font-size:15px;line-height:1.7;color:#e7e9f5;max-height:46vh;overflow:auto}
  .rd-passage.small{max-height:26vh}
  .rd-passage p{margin:0 0 10px}
  .rd-passage p:last-child{margin-bottom:0}
  .vw{border-bottom:1.5px dotted var(--gold);cursor:pointer}
  .rd-gloss{display:none;align-items:center;gap:10px;background:var(--s3);border:1px solid var(--gold);border-radius:12px;padding:9px 12px;margin-top:8px;font-size:13px}
  .rd-gloss.show{display:flex}
  .rd-gloss b{font-size:15px}
  .rd-gloss .g-ipa{color:var(--t3);font-size:12px}
  .rd-gloss .g-zh{color:var(--gold);font-weight:700;margin-left:auto;text-align:right}
  .rd-table{width:100%;border-collapse:collapse;font-size:12.5px}
  .rd-table th,.rd-table td{border:1px solid var(--border);padding:6px 7px;text-align:left}
  .rd-table th{background:var(--s3);font-size:11px;color:var(--t2)}
  .rd-note{font-size:12.5px;color:var(--t2);line-height:1.5;margin-top:8px}
  .rd-cmt{border-left:3px solid var(--accent);padding-left:11px;margin-bottom:12px}
  .rd-cmt .nm{font-size:12px;font-weight:800;color:var(--accent);margin-bottom:2px}
  .rd-prog{display:flex;align-items:center;gap:6px;margin:14px 0 8px}
  .rd-prog .pd{flex:1;height:5px;border-radius:3px;background:var(--s3)}
  .rd-prog .pd.ok{background:var(--green)}
  .rd-prog .pd.no{background:var(--red)}
  .rd-prog .pd.now{background:var(--accent)}
  .rd-tip{font-size:12px;color:var(--t3);text-align:center;margin-top:10px;line-height:1.5}

  /* ── 写作 ─────────────────────────────── */
  .wr-pick{display:flex;gap:9px;margin-bottom:14px}
  .wr-pick .btn{margin-top:0}
  .wr-box{background:var(--s2);border:1px solid var(--border);border-radius:16px;padding:14px 15px;margin-bottom:12px}
  .wr-sit{font-size:15px;line-height:1.65;color:#e7e9f5}
  .wr-lbl{font-size:11px;color:var(--t3);letter-spacing:.6px;text-transform:uppercase;margin-bottom:6px}
  .wr-pts{margin:0;padding-left:19px;font-size:14px;line-height:1.7;color:#e7e9f5}
  .wr-meta{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
  .wr-tag{font-size:11px;font-weight:700;background:var(--s3);border:1px solid var(--border);border-radius:9px;padding:5px 9px;color:var(--t2)}
  /* 写作台 */
  .wr-bar{display:flex;align-items:center;gap:10px;margin-bottom:9px}
  .wr-timer{font-size:19px;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:.5px}
  .wr-timer.warn{color:var(--gold)} .wr-timer.crit{color:var(--red)}
  .wr-wc{margin-left:auto;font-size:13px;font-weight:800;color:var(--t3);font-variant-numeric:tabular-nums}
  .wr-wc.ok{color:var(--green)} .wr-wc.over{color:var(--gold)} .wr-wc.under{color:var(--t3)}
  .wr-ta{width:100%;min-height:38vh;background:var(--s2);border:1.5px solid var(--border);border-radius:14px;
         padding:13px 14px;color:var(--t1);font-size:15px;line-height:1.7;font-family:inherit;resize:vertical}
  .wr-ta:focus{outline:none;border-color:var(--accent)}
  .wr-save{font-size:11px;color:var(--t3);text-align:right;margin-top:5px;min-height:15px}
  /* 批改 */
  .wr-auto{display:flex;flex-direction:column;gap:7px}
  .wr-arow{display:flex;align-items:center;gap:9px;font-size:13.5px}
  .wr-arow .ic{width:19px;flex:none;text-align:center}
  .wr-dim{margin-bottom:13px}
  .wr-dim-h{display:flex;align-items:baseline;gap:7px;font-size:13.5px;font-weight:800;margin-bottom:7px}
  .wr-dim-h .sc{margin-left:auto;font-weight:900;color:var(--accent);font-variant-numeric:tabular-nums}
  .wr-chips{display:flex;gap:6px}
  .wr-chip{flex:1;font-size:12px;font-weight:700;background:var(--s3);border:1.5px solid var(--border);color:var(--t2);
           border-radius:10px;padding:8px 4px;cursor:pointer;transition:.12s}
  .wr-chip:active{transform:scale(.96)}
  .wr-chip.on{border-color:var(--accent);color:var(--accent);background:#f47c5c1a}
  .wr-total{text-align:center;font-size:15px;font-weight:900;padding:11px;background:var(--s3);border-radius:13px;margin:4px 0 12px}
  .wr-total .lv{color:var(--gold)}
  .wr-hint{font-size:13px;line-height:1.65;color:var(--t2)}
  .wr-hint ul{margin:5px 0 0;padding-left:19px}
  .wr-lock{text-align:center;font-size:12.5px;color:var(--t3);padding:13px;background:var(--s2);border:1px dashed var(--border);border-radius:13px}
  .wr-bench{font-size:14px;line-height:1.75;color:#e7e9f5;white-space:pre-wrap;max-height:44vh;overflow:auto}
  .wr-cmp{display:flex;flex-direction:column;gap:10px}
  .wr-cmp-col .wr-lbl{margin-bottom:5px}
  .wr-cmp-txt{background:var(--s2);border:1px solid var(--border);border-radius:12px;padding:11px 12px;
              font-size:13.5px;line-height:1.7;white-space:pre-wrap;max-height:30vh;overflow:auto;color:#e7e9f5}
  @media(min-width:430px){ .wr-cmp{flex-direction:row} .wr-cmp-col{flex:1;min-width:0} }

  .brand{text-align:center;font-size:11px;color:var(--t3);letter-spacing:2px;text-transform:uppercase;padding-top:2px}

  /* ── 云同步 ── */
  .sy-box{background:var(--s1);border:1px solid var(--border);border-radius:16px;padding:15px 14px;margin-bottom:12px}
  .sy-title{font-size:14px;font-weight:800;margin-bottom:9px}
  .sy-in{width:100%;background:var(--s2);border:1px solid var(--border);border-radius:11px;padding:11px 12px;
         color:var(--t1);font-size:15px;margin-bottom:9px;font-family:inherit}
  .sy-in:focus{outline:none;border-color:var(--accent)}
  .sy-tabs{display:flex;gap:8px;margin-bottom:11px}
  .sy-tab{flex:1;background:var(--s2);border:1px solid var(--border);border-radius:11px;padding:9px;
          color:var(--t2);font-size:13.5px;font-weight:700;cursor:pointer;font-family:inherit}
  .sy-tab.on{background:var(--accent);border-color:var(--accent);color:#12131a}
  .sy-msg{font-size:13px;line-height:1.6;margin-top:9px;padding:9px 11px;border-radius:10px;display:none}
  .sy-msg.on{display:block}
  .sy-msg.ok{background:rgba(79,209,139,.13);color:var(--green)}
  .sy-msg.err{background:rgba(242,99,122,.13);color:var(--red)}
  .sy-msg.info{background:var(--s2);color:var(--t2)}
  .sy-row{display:flex;justify-content:space-between;align-items:center;font-size:13.5px;
          padding:8px 0;border-bottom:1px solid var(--border)}
  .sy-row:last-child{border-bottom:none}
  .sy-row span:first-child{color:var(--t2)}
  .sy-row span:last-child{color:var(--t1);font-weight:700}
  .sy-dot{position:absolute;top:5px;right:5px;width:8px;height:8px;border-radius:50%;background:var(--t3)}
  .sy-dot.ok{background:var(--green)} .sy-dot.pend{background:var(--gold)} .sy-dot.err{background:var(--red)}
  #btnSync{position:relative}

  /* ── 窄屏顶栏 ──
     图标从 4 个增到 5 个（加了 ☁️）后，375px 以下会溢出、按钮被挤出屏幕。
     优先收间距、最后才缩按钮，尽量保住点击区。
     必须放在 .topbar/.icon-btn/.ring 之后 —— 媒体查询不增加特异性，
     写在前面会被后面的基础规则盖掉。 */
  @media(max-width:430px){ .topbar{gap:6px} .chip{padding:6px 7px;font-size:12px} }
  @media(max-width:365px){ .topbar{gap:4px} .icon-btn{width:34px;height:34px;font-size:15px} }
  @media(max-width:340px){ .topbar{gap:3px} .icon-btn{width:31px;height:31px;font-size:14px;border-radius:10px}
                           .ring{width:38px;height:38px} .ring svg{width:38px;height:38px}
                           .chip{padding:5px 6px;font-size:11px} }
</style>
</head>
<body>
<div id="app">
  <!-- Top bar -->
  <div class="topbar">
    <div class="ring" title="今日目标">
      <svg width="46" height="46" viewBox="0 0 46 46"><circle class="rt" cx="23" cy="23" r="18"></circle><circle id="ringF" class="rf" cx="23" cy="23" r="18" stroke-dasharray="113" stroke-dashoffset="113"></circle></svg>
      <div class="rn" id="ringN">0</div>
    </div>
    <div class="tb-mid">
      <div class="xp-line"><span>Lv <span id="lvNum">1</span></span><span id="xpNum">0 XP</span></div>
      <div class="xp-track"><div class="xp-fill" id="xpFill"></div></div>
    </div>
    <div class="chip flame">🔥<span id="streakN">0</span></div>
    <button class="icon-btn" id="btnRead" title="今日阅读">📖</button>

,"pre-owned","in stock"],"correct":1,"question":"This item is marked ________, so under the store's policy it cannot be returned or exchanged merely because the buyer changed their mind."},{"id":424,"word":"damaged in transit","pos":"phr.","zh":"运输途中损坏","ipa":"","ex":"The mirror arrived damaged in transit.","category":"consumer","options":["delayed in transit","damaged in transit","lost in transit","misdelivered"],"correct":1,"question":"The box was crushed and the contents were cracked, so the goods were clearly ________."},{"id":425,"word":"shipping fee","pos":"n. phr.","zh":"运费","ipa":"","ex":"Orders over $50 have no shipping fee.","category":"consumer","options":["deposit","shipping fee","membership fee","late fee"],"correct":1,"question":"The item costs $30, plus a $6 ________ to send it to your home address."},{"id":426,"word":"dispute a charge","pos":"v. phr.","zh":"对一笔扣款提出异议","ipa":"","ex":"You can dispute a charge you didn't authorize.","category":"consumer","options":["dispute a charge","schedule a payment","request a credit-limit increase","authorize a charge"],"correct":0,"question":"If an unfamiliar card transaction appears, contact the bank to ________—formally challenge that specific payment and request an investigation."},{"id":427,"word":"cancel a subscription","pos":"v. phr.","zh":"取消订阅","ipa":"","ex":"I want to cancel a subscription I no longer use.","category":"consumer","options":["cancel a subscription","renew a subscription","upgrade a subscription","pause a subscription"],"correct":0,"question":"To permanently stop both access and future monthly payments, log in and ________ before the next billing date."},{"id":428,"word":"price adjustment","pos":"n. phr.","zh":"价格调整（差价退补）","ipa":"","ex":"The store offered a price adjustment when the item went on sale.","category":"consumer","options":["price adjustment","store credit","full refund","price match"],"correct":0,"question":"The store's posted policy promises to refund the difference if its own ons":["advertise","restock","upgrade","discontinue"],"correct":3,"question":"You can't buy that phone anymore because the maker chose to ________ it last year."},{"id":435,"word":"loyalty program","pos":"n. phr.","zh":"会员积分计划","ipa":"","ex":"Join the loyalty program to earn points.","category":"consumer","options":["layaway plan","loyalty program","protection plan","referral program"],"correct":1,"question":"Every time you shop here, the ________ gives you points that you can later exchange for discounts."},{"id":436,"word":"gift receipt","pos":"n. phr.","zh":"礼品收据（通常不显示价格；可供收礼人按商店政策申请退换）","ipa":"","ex":"Include a gift receipt so the recipient can request an exchange under the store's policy.","category":"consumer","options":["warranty card","gift receipt","original receipt","packing slip"],"correct":1,"question":"Ask for a ________ so the recipient can request a return or exchange under the store's policy without seeing the price."},{"id":437,"word":"in-store pickup","pos":"n. phr.","zh":"到店自取","ipa":"","ex":"Choose in-store pickup to avoid shipping fees.","category":"consumer","options":["gift wrapping","express shipping","in-store pickup","home delivery"],"correct":2,"question":"Instead of paying for delivery, select ________ and collect the order at the shop yourself."},{"id":438,"word":"nurse practitioner","pos":"n. phr.","zh":"护士执业师／高级执业护士（NP；可在其省或地区的执业范围内评估、诊断和开药）","ipa":"","ex":"A nurse practitioner can diagnose common illnesses and write prescriptions.","category":"health","options":["receptionist","paramedic","nurse practitioner","caregiver"],"correct":2,"question":"If no family doctor is available, a ________ can often examine you and prescribe treatment."},{"id":439,"word":"lab results","pos":"n. phr.","zh":"化验/检验结果","ipa":"","ex":"The doctor called with my lab results.","category":"health","options":["medical records","prescription records","referral notes","lab results"],"correct":3,"question":"After the blood sample is analyzed, the clinic will contac const READING = [{"id":"R001","part":0,"title":"Community Composting Program","category":"civic","text":"The City of Riverside recently launched a mandatory composting program for all residential properties. Starting next month, households will be required to separate organic waste — such as food scraps and yard trimmings — into a designated green bin provided by the city.\n\nThe program is part of a broader strategy to divert organic waste from landfills, which currently account for nearly 40% of the city's total waste output. City officials estimate that the initiative could reduce greenhouse gas emissions by 25% over the next decade.\n\nResidents who fail to comply with the new rules may receive a warning for the first offence, followed by a fine of up to $150 for repeated violations. The city will offer free educational workshops throughout the month of June to help residents understand what materials can and cannot be composted.","questions":[{"q":"What is the main purpose of the composting program?","opts":["To increase property taxes","To replace the current recycling program","To encourage residents to grow their own food","To reduce organic waste sent to landfills"],"ans":3},{"q":"According to the passage, what happens to residents who repeatedly break the rules?","opts":["They are asked to leave the city","Their bins are removed","They must attend a mandatory workshop","They receive a fine of up to $150"],"ans":3},{"q":"The word 'divert' in the second paragraph is closest in meaning to:","opts":["increase","monitor","destroy","redirect"],"ans":3},{"q":"Based on the passage, what can be inferred about residents who do not attend the city's composting workshops?","opts":["They will automatically receive a fine","They will receive printed guides in the mail instead","They will be exempt from the new composting rules","They may find it harder to know which materials are compostable"],"ans":3}]},{"id":"R002","part":0,"title":"Remote Work Policy Update","category":"workplace","text":"Following a two-year pilot program, Greenfield Solutions has announced a permanent hybrid work policy for all full-time employees. Under the new policy, staff are required to work from the office a minimum of two days per week, while retaining the flexibility to work remotely for the remaining days.\n\nThe decision was based on an internal survey in which 78% of employees reported higher job satisfaction under hybrid arrangements compared to fully in-office work. However, managers expressed concern that fully remote teams showed lower levels of collaboration and mentorship.\n\nThe company will provide a monthly stipend of $75 to help employees cover home office expenses such as internet and ergonomic equipment. Employees wishing to work remotely more than three days per week must submit a formal request to their department head for approval.","questions":[{"q":"What did the internal survey find?","opts":["Most employees preferred fully remote work","The pilot program was considered unsuccessful","Managers preferred the fully remote model","Hybrid work increased job satisfaction for most employees"],"ans":3},{"q":"What is the purpose of the $75 monthly stipend?","opts":["To reward high-performing employees","To cover commuting costs","To fund team social events","To help pay for home office expenses"],"ans":3},{"q":"The word 'stipend' in the final paragraph is closest in meaning to:","opts":["penalty","requirement","contract","allowance"],"ans":3},{"q":"What does the passage suggest about managers' views on fully remote work?","opts":["They strongly support it because it reduces office costs","They think it should replace the hybrid model entirely","They believe it increases productivity across all departments","They are concerned it weakens teamwork and employee development"],"ans":3}]},{"id":"R003","part":0,"title":"City Transit Expansion","category":"civic","text":"The Regional Transit Authority has approved a $2.4 billion plan to expand the city's rapid transit network over the next eight years. The project includes the construction of two new subway lines, 24 additional stations, and 15 kilometres of new elevated track.\n\nPlanners anticipate that the expansion will reduce average commute times by up to 18 minutes for residents in the city's eastern and northern neighbourhoods, which are currently underserved by public transportation.\n\nConstruction is set to begin in the spring and will be carried out in phases to minimize disruption to existing services. Residents near construction zones will receive advance notice and can access detailed project timelines through the authority's website. Some road closures and detours should be expected throughout the construction period.","questions":[{"q":"Who is expected to benefit most from the transit expansion?","opts":["Residents in the city centre","Commercial truck drivers","Tourists visiting the city","Residents in eastern and northern neighbourhoods"],"ans":3},{"q":"How will the construction be organized to reduce disruption?","opts":["All construction will happen overnight","Work will only take place on weekends","Existing lines will be shut down temporarily","Construction will be carried out in phases"],"ans":3},{"q":"The word 'underserved' suggests that these neighbourhoods:","opts":["have too many transit options","are located far from the city","were recently built","do not receive adequate public services"],"ans":3},{"q":"What can be inferred about residents living near construction zones?","opts":["They will be asked to temporarily relocate during construction","They will have access to free transit passes during the construction period","They will receive financial compensation for the inconvenience","They will be kept informed and should expect some road disruptions"],"ans":3}]},{"id":"R004","part":0,"title":"Tenant Protection Act","category":"civic","text":"The provincial government has introduced new legislation to strengthen tenant protections across the region. Under the Tenant Protection Act, landlords will be required to provide a minimum of 90 days' written notice before a rent increase takes effect. The allowable annual rent increase will also be capped at 2.5%, regardless of market conditions.\n\nThe Act also introduces stronger protections against eviction. Landlords who wish to reclaim a unit for personal use must provide supporting documentation and a minimum of six months' notice. Tenants who believe they have been wrongfully evicted can now apply to a newly established Rental Dispute Tribunal.\n\nHousing advocates have praised the legislation as a significant step forward, though some landlord associations have raised concerns that the restrictions may discourage investment in rental housing construction.","questions":[{"q":"Under the new Act, how much notice must landlords give before a rent increase?","opts":["30 days","60 days","6 months","90 days"],"ans":3},{"q":"What can tenants do if they believe they were wrongfully evicted?","opts":["Contact the provincial police","File a complaint with the landlord association","Refuse to leave the property","Apply to the Rental Dispute Tribunal"],"ans":3},{"q":"The word 'cap' as used in the passage means to:","opts":["increase gradually","remove entirely","calculate the average of","set a maximum limit on"],"ans":3},{"q":"Based on the passage, which group is LEAST likely to support the Tenant Protection Act?","opts":["Renters who have recently received an eviction notice","Housing advocates working with low-income tenants","Tenants currently involved in a dispute with their landlord","Landlords who plan to build new rental units"],"ans":3}]},{"id":"R005","part":0,"title":"Library Digital Services","category":"daily","text":"The Westdale Public Library has expanded its digital services to meet growing demand from residents who prefer accessing resources from home. Members can now borrow up to 10 e-books and 5 audiobooks simultaneously through the library's app, with loan periods of three weeks.\n\nIn addition to reading materials, the library has launched an online learning platform that provides free access to over 2,000 courses in topics ranging from language learning and coding to business and personal finance. The platform is available to all library card holders at no additional cost.\n\nLibrary staff note that while digital services have grown significantly, physical attendance at branches has also remained steady. Many residents continue to use the library for in-person study space, community programs, and access to computers and printing services for those without home devices.","questions":[{"q":"How many e-books can library members borrow at one time?","opts":["5","8","10","15"],"ans":2},{"q":"What is the online learning platform primarily designed to do?","opts":["Replace physical library visits","Train library staff","Sell digital textbooks at a discount","Provide free educational courses to members"],"ans":3},{"q":"According to the passage, which statement about physical library attendance is TRUE?","opts":["It has remained stable despite the growth of digital services","It has declined significantly since digital services expanded","It has completely replaced digital service use","It is only used by people without internet access"],"ans":0},{"q":"What does the passage suggest about library members who do not have computers or internet at home?","opts":["They are not eligible to borrow digital resources","They must pay an additional fee to use library computers","They will receive a free device from the library","They can still access library services by visiting in person"],"ans":3}]},{"id":"R006","part":0,"title":"Workplace Safety Regulations","category":"workplace","text":"The provincial government has updated its workplace safety regulations, introducing stricter requirements for employers in high-risk industries such as construction, manufacturing, and healthcare. Under the new rules, all employers must conduct a formal hazard assessment at least once per year and submit a written report to their regional safety authority.\n\nEmployers are also now required to provide safety training to new employees within the first week of employment. Previously, the requirement was within the first 30 days. Workers who identify unsafe conditions have the right to refuse work without loss of pay until the issue is resolved.\n\nInspectors will conduct unannounced visits to workplaces to check compliance, and companies that fail to meet standards may face fines of up to $50,000. Repeat offenders could face temporary suspension of their operating licence.","questions":[{"q":"How often must employers now conduct a formal hazard assessment?","opts":["Once per year","Every six months","Every two years","Only when a new employee is hired"],"ans":0},{"q":"Under the new rules, when must safety training be provided to new employees?","opts":["Before the job offer is made","After the probationary period","Within the first 30 days","Within the first week"],"ans":3},{"q":"The word 'unannounced' in the final paragraph means the inspections will be:","opts":["carried out without prior notice","conducted at night","performed by volunteers","limited to large companies"],"ans":0},{"q":"What can be inferred about a company that has already been fined once for non-compliance?","opts":["It will be required to retrain all of its employees immediately","It must submit monthly safety reports to the government","It will no longer be subject to unannounced inspections","It faces the risk of having its operating licence suspended if violations continue"],"ans":3}]},{"id":"R007","part":0,"title":"Urban Green Space Initiative","category":"civic","text":"A new report released by the City Planning Department recommends transforming at least 15% of the city's paved surfaces into green space over the next 20 years. The proposal includes converting underused parking lots, widening sidewalks with tree canopies, and creating small neighbourhood parks in densely built areas.\n\nResearch cited in the report indicates that access to green space is associated with reduced stress levels, lower rates of chronic disease, and stronger social cohesion in communities. The report also highlights environmental benefits, including reduced urban heat, improved air quality, and better management of stormwater runoff.\n\nThe initiative is expected to cost approximately $180 million over the 20-year period. City staff have proposed funding the project through a combination of development charges, federal grants, and an annual contribution from the city's capital budget.","questions":[{"q":"What is the city's target for converting paved surfaces to green space?","opts":["15% over 20 years","10% over 15 years","5% over 10 years","20% over 25 years"],"ans":0},{"q":"According to the report, which is NOT mentioned as a benefit of green space?","opts":["Reduced stress levels","Better stormwater management","Improved air quality","Lower property taxes"],"ans":3},{"q":"How does the city plan to fund the initiative?","opts":["Through development charges, federal grants, and capital budget contributions","Only through property tax increases","Entirely through federal grants","By selling unused city-owned land"],"ans":0},{"q":"Based on the report, which type of area would benefit most from the green space initiative?","opts":["Suburban neighbourhoods with large private gardens","Industrial zones near the city's waterfront","Rural communities on the city's outskirts","Densely built urban areas with limited existing green space"],"ans":3}]},{"id":"R008","part":0,"title":"Consumer Protection Update","category":"consumer","text":"New consumer protection regulations that came into effect this month give buyers greater rights when purchasing goods and services online. Under the updated rules, online retailers must clearly display total costs — including all taxes, fees, and shipping charges — before a customer confirms a purchase. Hidden fees added after checkout are now prohibited.\n\nCustomers also have an expanded right of return. For most online purchases, buyers now have 30 days to return goods for any reason and receive a full refund, up from the previous 14-day window. Items must be returned in their original condition, but retailers cannot charge restocking fees for standard returns.\n\nBusiness groups have raised concerns that the regulations may increase operating costs, particularly for smaller retailers. Consumer advocacy groups, however, argue that clearer pricing and fairer return policies are long overdue.","questions":[{"q":"What do the new regulations require online retailers to do before a purchase is confirmed?","opts":["Display all costs including taxes and fees","Offer free shipping on all orders","Provide a written receipt by email","Allow customers to speak with a representative"],"ans":0},{"q":"How has the return window for online purchases changed?","opts":["It has been reduced from 30 days to 14 days","It has been eliminated for digital goods","It now depends on the type of product","It has been extended from 14 days to 30 days"],"ans":3},{"q":"The word 'prohibited' in the first paragraph means:","opts":["not allowed","recommended","required","unclear"],"ans":0},{"q":"What does the reaction of business groups suggest about the new regulations?","opts":["The regulations will likely be reversed within a year","Small businesses will benefit more than large retailers","Most businesses already followed these practices voluntarily","Complying with the regulations may increase costs for some sellers"],"ans":3}]},{"id":"R009","part":0,"title":"Immigration Settlement Services","category":"immigration","text":"The federal government has announced a $45 million funding increase for immigration settlement services over the next three years. The funding will be distributed to community organizations that provide language training, employment assistance, and social integration support to newcomers.\n\nSettlement workers play a key role in helping new immigrants navigate systems such as healthcare, education, and housing. Research shows that newcomers who access settlement services within their first year in Canada are significantly more likely to find stable employment and report higher levels of life satisfaction compared to those who do not.\n\nDemand for settlement services has increased sharply in recent years due to higher immigration targets and the arrival of refugees from several countries. Service providers note that waitlists for language training programs, in particular, have grown to several months in many cities, highlighting the need for additional investment.","questions":[{"q":"What is the purpose of the $45 million in new funding?","opts":["To support community organizations providing settlement services","To build new immigrant processing centres","To increase the number of immigration officers","To fund language research programs"],"ans":0},{"q":"According to the passage, newcomers who access settlement services in their first year are more likely to:","opts":["become Canadian citizens faster","be reunited with family members sooner","qualify for additional government benefits","find stable employment and report higher life satisfaction"],"ans":3},{"q":"Why have settlement service waitlists grown in recent years?","opts":["Higher immigration targets and refugee arrivals have increased demand","Services have been cut due to budget constraints","Many settlement workers have left the profession","The government moved services online"],"ans":0},{"q":"Based on the passage, what would most likely happen to a newcomer who does not access settlement services in their first year?","opts":["They would be required to reapply for immigration status","They would be assigned a settlement worker automatically","They would lose eligibility for future government support","They might face greater difficulty finding stable employment"],"ans":3}]},{"id":"R010","part":0,"title":"Electric Vehicle Incentive Program","category":"environment","text":"The provincial government has expanded its electric vehicle incentive program, offering rebates of up to $5,000 for the purchase or lease of a new fully electric vehicle. Plug-in hybrid vehicles are also eligible for a smaller rebate of up to $2,500. The incentive applies to vehicles priced below $55,000 and is available to both individual buyers and businesses.\n\nTo qualify, buyers must be residents of the province and must not have previously claimed the rebate. The vehicle must be registered in the province within 30 days of purchase. The rebate is applied at the point of sale, meaning buyers do not need to submit a separate application after the fact.\n\nProvincial officials noted that electric vehicle registrations have grown by 40% year over year. However, access to public charging infrastructure remains uneven, with rural areas receiving fewer investments than urban centres. The government has committed to installing 500 new charging stations across the province by the end of next year.","questions":[{"q":"What is the maximum rebate available for a fully electric vehicle?","opts":["$2,500","$3,500","$5,000","$7,500"],"ans":2},{"q":"How is the rebate applied to the purchase?","opts":["It is applied at the point of sale","It is sent by cheque after registration","It reduces the annual vehicle tax","It is credited to a future purchase"],"ans":0},{"q":"What challenge with electric vehicles does the passage highlight?","opts":["The vehicles are too expensive for most buyers","Electric vehicles are not available in all provinces","The rebate program has run out of funding","Charging infrastructure is uneven, especially in rural areas"],"ans":3},{"q":"Based on the passage, which person would NOT be eligible for the electric vehicle rebate?","opts":["A person who previously claimed the rebate buying a second electric car","A resident purchasing a $54,000 plug-in hybrid","A business owner buying a $50,000 fully electric van","A new resident who registered their address in the province two months ago"],"ans":0}]},{"id":"R011","part":4,"title":"Should Downtown Parking Fees Be Increased?","category":"civic","intro":"The city of Millbrook is considering raising parking fees in the downtown core from $3 to $8 per hour to reduce traffic congestion and encourage transit use. Residents have shared a range of views.","comments":[{"name":"Karen Osei","text":"Higher parking fees are exactly what this city needs. If driving downtown becomes more expensive, people will finally start using the bus and LRT. We can't keep building roads and parking garages forever — it's not sustainable."},{"name":"Derek Fontaine","text":"This is just another way to squeeze money out of ordinary people. Not everyone can take transit — I work early mornings and the buses don't run then. Raising fees punishes workers, not wealthy commuters."},{"name":"Priya Mehta","text":"I support the idea in principle, but only if the extra revenue is reinvested directly into expanding transit routes and hours. Without that commitment, the policy just creates hardship without fixing the underlying problem."},{"name":"Tom Wiśniewski","text":"My concern is the impact on small businesses downtown. When parking gets too expensive, customers shop online or go to suburban malls instead. We've seen that happen in other cities, and it's not good for local merchants."}],"questions":[{"q":"Which person believes that higher parking fees would encourage more people to use public transit?","opts":["Derek Fontaine","Priya Mehta","Tom Wiśniewski","Karen Osei"],"ans":3},{"q":"Derek Fontaine's main objection to higher parking fees is that:","opts":["not all workers have access to transit at the times they need it","downtown businesses would lose customers","the fees would be used inefficiently by the city","the current fee of $3 is already too high"],"ans":0},{"q":"What condition does Priya Mehta place on her support for the policy?","opts":["The fees must not apply to electric vehicles","Businesses must be consulted before the policy takes effect","The increase must be phased in gradually over several years","The revenue must be used to improve transit services"],"ans":3},{"q":"Which person would most likely agree with the statement: \"Changes to parking policy could harm the economic vitality of the city centre\"?","opts":["Karen Osei","Priya Mehta","Derek Fontaine","Tom Wiśniewski"],"ans":3}]},{"id":"R012","part":4,"title":"Should Landlords Be Required to Allow Pets?","category":"housing","intro":"The provincial government is considering legislation that would prevent landlords from including \"no-pets\" clauses in residential lease agreements. The proposal has prompted strong reactions from renters and property owners alike.","comments":[{"name":"Simone Tremblay","text":"This legislation is long overdue. Renters with pets are constantly turned away from perfectly good units, and it forces people to choose between their home and their animal companions. Pets are part of the family."},{"name":"Gerald Hawkins","text":"As a landlord, I have a right to protect my property. Pet damage — scratched floors, stained carpets, lingering odours — is real and costly. No law should force me to accept that risk in a unit I own."},{"name":"Lucia Ferreira","text":"I'd support this if the law also required tenants to carry pet liability insurance and pay a refundable pet deposit. That way landlords have financial protection without being able to ban pets outright."},{"name":"Raj Patel","text":"I'm less concerned about the principle than the enforcement. Who decides whether pet damage is beyond normal wear and tear? Without clear standards, this will just lead to more disputes at the Landlord and Tenant Board."}],"questions":[{"q":"Which person most strongly supports the proposed legislation without any conditions?","opts":["Simone Tremblay","Lucia Ferreira","Gerald Hawkins","Raj Patel"],"ans":0},{"q":"Gerald Hawkins opposes the legislation primarily because:","opts":["he believes pets disturb other tenants","he disagrees with government involvement in rental agreements","he thinks landlords already allow pets voluntarily","he is concerned about the cost of repairing pet-related damage"],"ans":3},{"q":"What specific safeguard does Lucia Ferreira suggest should accompany the legislation?","opts":["A requirement for pet liability insurance and a refundable deposit","A government fund to cover landlord repair costs","A limit on the number of pets per unit","Annual inspections of units where pets are kept"],"ans":0},{"q":"Raj Patel's concern suggests he believes the legislation would most likely lead to:","opts":["a reduction in available rental housing","landlords selling their properties rather than renting them","higher rents for all tenants regardless of pet ownership","increased legal disputes between landlords and tenants"],"ans":3}]},{"id":"R013","part":4,"title":"Should Public Libraries Lend Video Games?","category":"community","intro":"Several municipalities across Canada are debating whether public libraries should expand their lending programs to include video games and gaming consoles. The proposal has divided community members.","comments":[{"name":"Fatima Al-Rashid","text":"Libraries have always evolved with the times — from books to DVDs to e-books. Video games are a legitimate art form and an important part of modern culture. Making them accessible to everyone, regardless of income, is exactly what public libraries are for."},{"name":"Bruce Calloway","text":"Libraries are already underfunded. Every dollar spent on gaming consoles and titles is a dollar not spent on books, literacy programs, or community meeting spaces. This is a misuse of public money."},{"name":"Yuki Tanaka","text":"I support it, as long as the library focuses on educational and family-friendly titles rather than violent games. There's real value in strategy games, puzzle games, and interactive learning tools for children."},{"name":"Melissa Grant","text":"My main question is practical: video games get outdated fast, and consoles need regular replacement. Has anyone actually looked at the long-term maintenance costs? I'd want to see a pilot program with a full cost-benefit analysis before committing."}],"questions":[{"q":"Which person argues that lending video games aligns with the traditional purpose of public libraries?","opts":["Fatima Al-Rashid","Bruce Calloway","Melissa Grant","Yuki Tanaka"],"ans":0},{"q":"Bruce Calloway's main concern is that:","opts":["video games are inappropriate for a public setting","the library does not have enough space for gaming equipment","children would spend too much time gaming instead of reading","funding games would come at the expense of more essential library services"],"ans":3},{"q":"What type of video games does Yuki Tanaka consider acceptable for library lending?","opts":["Educational and family-friendly games","Only games produced by Canadian developers","Popular titles regardless of content","Games rated for adults only"],"ans":0},{"q":"Which person would most likely agree that the library board should gather more data before making a final decision?","opts":["Fatima Al-Rashid","Bruce Calloway","Yuki Tanaka","Melissa Grant"],"ans":3}]},{"id":"R020","part":3,"title":"Understanding Employment Insurance in Canada","category":"government","text":"Paragraph A\nEmployment Insurance (EI) is a federal program that provides temporary income support to Canadians who have lost their job through no fault of their own. To be eligible, you must have worked a minimum number of insurable hours in the past 52 weeks. The exact number of hours required depends on the unemployment rate in your region — areas with higher unemployment typically require fewer hours to qualify.\n\nParagraph B\nApplying for EI is done entirely online through the Government of Canada website. You will need your Social Insurance Number, banking information for direct deposit, and details about your employment history, including the name of your last employer and your reason for separation. Most applicants receive a decision within 28 days of submitting their claim.\n\nParagraph C\nOnce approved, EI benefits are calculated at 55% of your average insurable weekly earnings, up to a maximum set by the government each year. Payments are made every two weeks. You must continue to meet eligibility requirements throughout the benefit period, which means actively looking for work and reporting any income you earn while receiving benefits.\n\nParagraph D\nCertain life situations allow you to access special EI benefits beyond the standard employment insurance. These include maternity and parental benefits for new parents, sickness benefits for those unable to work due to illness or injury, and compassionate care benefits for people who must take time off to care for a seriously ill family member. Each type has its own eligibility criteria and maximum duration.","questions":[{"q":"Which paragraph explains how the amount of EI payments is determined?","opts":["Paragraph A","Paragraph B","Paragraph C","Paragraph D"],"ans":2},{"q":"According to Paragraph A, what factor affects how many hours a person needs to qualify for EI?","opts":["The type of job the person held","Whether they quit or were laid off","The number of years they have worked","The unemployment rate in their region"],"ans":3},{"q":"According to Paragraph B, what document is required when applying for EI?","opts":["A Social Insurance Number","A record of all jobs held in the past five years","A letter from a previous employer confirming dismissal","Proof of Canadian citizenship"],"ans":0},{"q":"The word 'separation' in Paragraph B refers to:","opts":["moving to a different city for work","transferring to another department","taking an unpaid leave of absence","ending an employment relationship"],"ans":3}]},{"id":"R021","part":3,"title":"Types of Rental Arrangements in Canada","category":"housing","text":"Paragraph A\nA fixed-term lease is a rental agreement that covers a set period, most commonly 12 months. During this time, neither the landlord nor the tenant can end the agreement early without penalty, unless specific conditions outlined in the lease are met. At the end of the term, the lease either converts to a month-to-month arrangement or is renewed for another fixed period, depending on what both parties agree to.\n\nParagraph B\nA month-to-month tenancy offers more flexibility than a fixed-term lease. Either the landlord or the tenant can end the agreement by giving proper notice — typically 60 days for a tenant and longer for a landlord, depending on provincial rules. Rent can also be reviewed more frequently, though increases must still follow the limits set by provincial legislation.\n\nParagraph C\nSublet arrangements occur when a tenant temporarily rents their unit to another person while retaining their own lease. The original tenant remains legally responsible for rent and any damage caused by the subtenant. Most leases require the landlord's written permission before subletting, and some landlords may refuse if the lease prohibits it.\n\nParagraph D\nRoom rentals, sometimes called boarding arrangements, involve renting a single room within a property where the landlord also lives. These arrangements are often less formal than full-unit leases and may not be covered by the same tenant protection laws. Prospective tenants should clarify what is included — such as kitchen access, utilities, and shared spaces — before agreeing to terms.","questions":[{"q":"Which paragraph describes a situation where a tenant lets someone else live in their unit temporarily?","opts":["Paragraph A","Paragraph B","Paragraph C","Paragraph D"],"ans":2},{"q":"According to Paragraph A, what happens at the end of a fixed-term lease?","opts":["The lease converts to month-to-month or is renewed","The landlord can increase rent by any amount","The tenant must immediately vacate the unit","The tenant loses any deposit paid at the start"],"ans":0},{"q":"According to Paragraph D, why should tenants in a room rental clarify terms in advance?","opts":["Room rentals always cost more than full-unit leases","Room rentals are not permitted in most Canadian provinces","Landlords in room rentals can evict tenants without notice","These arrangements may have fewer legal protections and unclear inclusions"],"ans":3},{"q":"The word 'retaining' in Paragraph C is closest in meaning to:","opts":["keeping","cancelling","transferring","sharing"],"ans":0}]},{"id":"R022","part":3,"title":"Waste Sorting in Canadian Municipalities","category":"civic","text":"Paragraph A\nGarbage, or residual waste, refers to items that cannot be recycled, composted, or reused. Most municipalities collect garbage on a weekly or biweekly schedule using grey or black bins. Items commonly placed in garbage include broken ceramics, soiled food packaging, and non-recyclable plastics. Many cities have introduced limits on the amount of garbage a household can put out each collection day to encourage waste reduction.\n\nParagraph B\nRecycling programs collect materials that can be processed and turned into new products. Common recyclables include paper, cardboard, glass bottles, metal cans, and many plastic containers. Items must generally be clean and dry before being placed in the recycling bin. Contamination — putting non-recyclable items in the blue bin — is one of the biggest challenges recycling programs face, as it can cause entire loads to be sent to landfill.\n\nParagraph C\nOrganics collection, often managed through a green bin program, diverts food waste and yard trimmings from landfills. Accepted materials typically include fruit and vegetable scraps, coffee grounds, eggshells, and grass clippings. Composted organics are processed into nutrient-rich soil amendments used in parks, farms, and gardens. Some municipalities also accept compostable packaging, though this varies by region.\n\nParagraph D\nHazardous household waste — such as batteries, paint, motor oil, and fluorescent light bulbs — requires special handling because it can be harmful to people and the environment if disposed of incorrectly. Most municipalities operate drop-off depots where residents can bring these items for safe processing. Some communities also hold scheduled collection events throughout the year to make disposal more convenient.","questions":[{"q":"Which paragraph explains how food scraps and yard waste are handled?","opts":["Paragraph A","Paragraph B","Paragraph C","Paragraph D"],"ans":2},{"q":"According to Paragraph B, what is one major problem with recycling programs?","opts":["Not enough households participate in recycling","Recycling bins are not large enough for most households","Recyclable materials take too long to process into new products","Contamination from non-recyclable items reduces program effectiveness"],"ans":3},{"q":"According to Paragraph D, how can residents dispose of hazardous household waste?","opts":["Bring it to a municipal drop-off depot or scheduled collection event","Place it in a clearly labelled garbage bag on collection day","Mix it with regular recycling for special processing","Contact a private waste removal company"],"ans":0},{"q":"The word 'diverts' in Paragraph C is closest in meaning to:","opts":["collects","breaks down","increases","redirects away from"],"ans":3}]},{"id":"R014","part":1,"title":"Annual Unit Inspection Notice","category":"housing","text":"Subject: Notice of Annual Unit Inspection — Suite 4B\n\nDear Resident,\n\nThis letter is to inform you that we will be conducting our annual inspection of your unit at 112 Elmwood Avenue on Thursday, October 17th, between 10:00 a.m. and 12:00 p.m. The purpose of this inspection is to check the general condition of the unit and identify any maintenance issues that require attention.\n\nYou are not required to be present during the inspection, but you are welcome to stay if you prefer. Please ensure that all areas of the unit, including storage closets and the balcony, are accessible to our maintenance staff.\n\nIf the scheduled date is not convenient for you, please contact our office by October 10th to arrange an alternative time. We will make every effort to accommodate your schedule.\n\nThank you for your cooperation.\n\nSincerely,\nDarla Hooper\nProperty Manager, Elmwood Residential","questions":[{"q":"What is the main purpose of this letter?","opts":["To notify the tenant of a scheduled inspection","To inform the tenant of a rent increase","To report a maintenance problem in the unit","To ask the tenant to renew their lease"],"ans":0},{"q":"What must the tenant do if October 17th does not work for them?","opts":["Wait for a new notice to be sent","Contact the office before October 10th","Leave a note on their door on the day of the inspection","Call the maintenance staff directly"],"ans":1},{"q":"According to the letter, which area of the unit must be made accessible?","opts":["Only the kitchen and bathrooms","All areas including storage closets and the balcony","Only the main living areas","Only rooms that have reported problems"],"ans":1},{"q":"The letter implies that the tenant:","opts":["is required to be home during the inspection","has previously refused an inspection","must clean the unit before the inspection","has the option to be absent when the inspection takes place"],"ans":3}]},{"id":"R015","part":1,"title":"Road Construction Parking Notice","category":"civic","text":"Subject: Temporary Parking Restrictions — Birchwood Crescent Resurfacing Project\n\nDear Birchwood Crescent Resident,\n\nThe City of Lakeview will be resurfacing Birchwood Crescent from Maple Drive to Cedar Hill Road beginning Monday, November 4th. Work is expected to take approximately ten business days to complete, weather permitting.\n\nDuring this period, parking on both sides of Birchwood Crescent will be suspended between 7:00 a.m. and 6:00 p.m. on weekdays. Vehicles that remain on the street during restricted hours will be towed at the owner's expense. Overnight parking (6:00 p.m. to 7:00 a.m.) and weekend parking will not be affected.\n\nResidents who do not have access to off-street parking may apply for a temporary permit to use the Lakeview Community Centre parking lot at 88 Riverside Drive, free of charge. Applications must be submitted online at lakeview.ca/permits or in person at City Hall by October 30th.\n\nWe apologize for the inconvenience and thank you for your patience as we work to improve your neighbourhood.\n\nCity of Lakeview Transportation Department","questions":[{"q":"What is the main reason for the parking restrictions?","opts":["A new housing development is being built nearby","The road on Birchwood Crescent is being resurfaced","A community event is taking place on the street","Emergency utility repairs are being carried out"],"ans":1},{"q":"What will happen to vehicles left on the street during restricted hours?","opts":["They will receive a parking ticket","They will be towed at the owner's expense","They will be moved to the community centre lot","The owner will be contacted by phone"],"ans":1},{"q":"Where can residents without off-street parking apply for a temporary permit?","opts":["At the Birchwood Crescent construction office","At the Lakeview Community Centre directly","Online at lakeview.ca/permits or in person at City Hall","By calling the Transportation Department"],"ans":2},{"q":"A resident who works Monday to Friday and parks on Birchwood Crescent every night would most likely need to:","opts":["find alternative parking only on weekends","apply for a temporary permit or arrange off-street parking on weekdays","avoid the street entirely for ten months","contact the city to request an exemption from the restrictions"],"ans":1}]},{"id":"R016","part":1,"title":"Employee Benefits Plan Changes","category":"workplace","text":"Subject: Important Changes to Your Employee Benefits Plan — Action Required by December 1st\n\nDear Team Member,\n\nAs part of our annual benefits review, Northgate Financial Services will be transitioning to a new benefits provider effective January 1st. Most of your current coverage will remain unchanged; however, there are several updates you should be aware of.\n\nFirst, the dental coverage maximum will increase from $1,500 to $2,000 per calendar year. Orthodontic coverage, which was previously excluded, will now be available for dependants under the age of 18, up to a lifetime maximum of $3,000 per dependent.\n\nSecond, employees who currently use paramedical services — such as physiotherapy, massage therapy, or chiropractic care — will be required to re-register their preferred providers through the new provider's online portal before their first claim in the new year. Claims submitted without prior provider registration will be delayed.\n\nTo ensure uninterrupted coverage, all employees must log in to the new benefits portal at northgatebenefits.ca and confirm their personal and dependent information by December 1st. Employees who do not complete this step by the deadline may experience a gap in coverage at the start of the new year.\n\nPlease contact HR at benefits@northgatefs.ca if you have any questions.\n\nHuman Resources\nNorthgate Financial Services","questions":[{"q":"What is the main purpose of this email?","opts":["To announce the company's annual performance review process","To inform employees of upcoming changes to their benefits plan","To introduce a new HR management system","To remind employees to submit their expense claims"],"ans":1},{"q":"Under the new plan, which group is newly eligible for orthodontic coverage?","opts":["All employees regardless of age","Employees who have been with the company for over five years","Dependants under the age of 18","Retirees and former employees"],"ans":2},{"q":"What must employees who use physiotherapy or massage therapy do before making a claim in the new year?","opts":["Obtain a referral from their family doctor","Submit receipts from the current year before December 1st","Re-register their providers through the new portal","Switch to providers approved by Northgate Financial Services"],"ans":2},{"q":"The phrase \"gap in coverage\" in the final paragraph most likely means that the employee would:","opts":["receive a reduced salary during the transition period","temporarily lose access to their benefits","need to pay higher premiums under the new plan","be required to attend an additional orientation session"],"ans":1}]},{"id":"R017","part":2,"title":"Clearwater Community Pool — Schedule & Fees","category":"community","tableHeaders":["Session","Days","Time","Adult (18+)","Youth (13–17)","Child (3–12)","Senior (65+)"],"tableRows":[["Early Bird Lap Swim","Mon–Fri","6:00–8:00 a.m.","$5.50","$4.00","N/A","$3.50"],["Morning Family Swim","Sat–Sun","8:00–10:00 a.m.","$6.00","$4.50","$3.00","$4.00"],["Leisure Swim","Daily","10:00 a.m.–12:00 p.m.","$6.50","$5.00","$3.50","$4.50"],["Aquafit Class","Mon/Wed/Fri","12:00–1:00 p.m.","$8.00","$6.00","N/A","$6.00"],["Afternoon Lap Swim","Mon–Fri","1:00–4:00 p.m.","$5.50","$4.00","N/A","$3.50"],["Evening Family Swim","Daily","6:00–8:00 p.m.","$6.00","$4.50","$3.00","$4.00"],["Lane Rentals (per lane/hour)","Daily","By appointment","$22.00","N/A","N/A","N/A"]],"notes":["Children under 3 are admitted free when accompanied by a paying adult.","A 10% discount applies to all drop-in fees when purchasing a 10-visit pass.","Aquafit Class is not available to children under 13."],"questions":[{"q":"What is the drop-in fee for an adult attending the Evening Family Swim?","opts":["$5.50","$6.00","$6.50","$8.00"],"ans":1},{"q":"On which days is the Aquafit Class available?","opts":["Every day","Monday, Wednesday, and Friday only","Weekdays only","Saturday and Sunday only"],"ans":1},{"q":"A senior who buys a 10-visit pass for Early Bird Lap Swim would pay how much per visit?","opts":["$3.15","$3.50","$4.50","$5.50"],"ans":0},{"q":"Marcus wants to bring his 2-year-old daughter to Saturday morning Family Swim. He will pay:","opts":["$6.00 for himself and $3.00 for his daughter","$6.00 for himself only, as his daughter is free","$9.00 total for both","$3.00 for his daughter only"],"ans":1}]},{"id":"R018","part":2,"title":"City of Harborview — Waste Collection Schedule","category":"civic","tableHeaders":["Collection Type","Zone A","Zone B","Zone C","Zone D"],"tableRows":[["Garbage (grey bin)","Monday","Tuesday","Wednesday","Thursday"],["Blue Box Recycling","Monday","Wednesday","Thursday","Friday"],["Green Bin (organics)","Monday & Thursday","Tuesday & Friday","Wednesday & Saturday","Thursday & Sunday"],["Yard Waste (seasonal)","Wednesday","Wednesday","Thursday","Thursday"],["Large Item Pickup","First Monday of month","First Tuesday of month","First Wednesday of month","First Thursday of month"]],"notes":["When a statutory holiday falls on a collection day, all collections that week shift one day later (e.g., Monday becomes Tuesday).","Bins must be placed at the curb by 7:00 a.m. on collection day. Bins set out after 7:00 a.m. will not be collected until the next scheduled pickup.","Large items must be registered online at harborview.ca/largeitems at least 48 hours before the scheduled pickup date."],"questions":[{"q":"On which days does Zone B have its Green Bin (organics) collected?","opts":["Monday and Thursday","Tuesday and Friday","Wednesday and Saturday","Thursday and Sunday"],"ans":1},{"q":"A resident in Zone C wants to put out a large item for pickup. When is their scheduled Large Item Pickup day?","opts":["First Monday of the month","First Tuesday of the month","First Wednesday of the month","First Thursday of the month"],"ans":2},{"q":"A statutory holiday falls on a Tuesday. A Zone B resident whose garbage is normally collected o

]},{"id":"X-R015","part":3,"partLabel":"Reading for Information","title":"Urban Tree Canopy","category":"environment","text":"A. City trees cool streets by providing shade and by releasing water vapour. The effect is strongest where trees form a connected canopy. A single young tree offers limited cooling, but coordinated planting can lower temperatures across an entire block over time.\n\nB. Planting is only the beginning. Young trees need regular watering, protection from road salt, and enough soil for their roots. Municipal programs that count the number of trees planted without tracking survival may exaggerate their success.\n\nC. Tree selection also matters. A city that relies heavily on one species risks losing much of its canopy to a single pest or disease. Greater diversity reduces this danger, although maintenance becomes more complicated when species have different needs.\n\nD. Residents sometimes oppose new trees because they fear blocked signs, fallen leaves, or damage to sidewalks. Early consultation can identify suitable locations and explain long-term benefits. It can also reveal where shade is most urgently needed, such as bus stops used by seniors.","questions":[{"q":"Which paragraph explains why planting totals can be misleading?","opts":["B","D","A","C"],"ans":0,"explanation":"Paragraph B says programs may count planted trees without checking whether they survive."},{"q":"Which paragraph discusses the risk of depending on one species?","opts":["B","C","A","D"],"ans":1,"explanation":"Paragraph C links low species diversity to pest and disease risk."},{"q":"According to Paragraph A, when is cooling strongest?","opts":["When trees are very young","When each block has one tree","When roads contain more salt","When trees form a connected canopy"],"ans":3,"explanation":"A connected canopy produces the strongest cooling effect."},{"q":"What can consultation reveal according to Paragraph D?","opts":["Locations with an urgent need for shade","Which pest will arrive next","The price of road salt","How to reduce watering"],"ans":0,"explanation":"Residents can help identify places such as exposed bus stops."}],"sourceSet":"R4","origin":"codex-original-unofficial-2026-07-28"},{"id":"X-R016","part":4,"partLabel":"Reading for Viewpoints","title":"Grocery Self-Checkout","category":"environment","questions":[{"q":"Who supports expansion partly because employees could be reassigned to other customer-service tasks?","opts":["Daniel Price","Rosa Alvarez","Michael Chen","Aisha Rahman"],"ans":2,"explanation":"Michael says employees can help in the aisles, prepare online orders, and support the machines."},{"q":"Who questions the average wait-time result because difficult transactions can delay several shoppers?","opts":["Michael Chen","Aisha Rahman","Rosa Alvarez","Daniel Price"],"ans":1,"explanation":"Aisha warns that one complicated purchase can block several people despite a lower overall average."},{"q":"Which pair agrees that self-checkout is useful in some situations but not suitable for every purchase?","opts":["Michael Chen and Rosa Alvarez","Rosa Alvarez and Daniel Price","Michael Chen and Aisha Rahman","Aisha Rahman and Daniel Price"],"ans":3,"explanation":"Both Aisha and Daniel prefer self-checkout for simple purchases while supporting staffed service for more complex ones."},{"q":"Who is most concerned about the effect of the proposal on employees’ income and schedules?","opts":["Aisha Rahman","Rosa Alvarez","Daniel Price","Michael Chen"],"ans":1,"explanation":"Rosa focuses on reduced paid hours and asks for a staffing commitment before lanes are removed."}],"sourceSet":"R4","origin":"codex-original-unofficial-2026-07-28","intro":"A grocery chain plans to replace half of its staffed checkout lanes with self-checkout machines. The company says shorter lines will allow staff to spend more time helping shoppers in the aisles. The workers’ association expects reduced hours and argues that customers already perform unpaid scanning. A store pilot found that average waiting time fell by two minutes, but requests for employee assistance increased sharply.","comments":[{"name":"Michael Chen","text":"The pilot shows that self-checkout can reduce routine waiting. Replacing some lanes does not have to mean eliminating service jobs; employees can help customers find products, prepare online orders, and support the machines. The company should expand the system while measuring both wait times and customer satisfaction."},{"name":"Aisha Rahman","text":"Self-checkout is useful when I have only a few items, but it becomes frustrating with produce or coupons. The company should keep enough staffed lanes for customers who need them and schedule an employee specifically to assist at the machines. Faster averages are not meaningful if one complicated transaction holds up six shoppers."},{"name":"Rosa Alvarez","text":"The proposal transfers work to customers and is likely to reduce paid hours. Promises about moving staff into the aisles are not enough without guaranteed schedules. The chain should publish a staffing commitment before removing any lanes and consult employees whose income may be affected."},{"name":"Daniel Price","text":"I prefer self-checkout for a small, simple purchase because I can leave quickly. For a full cart, coupons, or age-restricted products, a staffed lane is far more efficient. Stores should offer both choices rather than assuming one system works for every customer and every transaction."}]}];
const WRITING = [{"id":"T1-001","type":"task1","relationship":"tenant to landlord","tone":"polite formal complaint","situation":"You are renting an apartment and the heating has not been working for a week. Write an email to your landlord.","points":["Describe the problem with the heating","Explain how it is affecting you","Request that the issue be fixed by a specific date"],"checks":["heating","week","cold","repair","deadline","affect"],"rubricHints":{"content":["State clearly that the heating has not been working and for how long","Describe a concrete personal impact (health, discomfort, or daily life)","Give a specific repair deadline (e.g., by Friday, within three days)"],"tone":"Polite but firm — you are a paying tenant asserting a legal right, not making a casual request. Avoid aggressive language; maintain formal register throughout.","taskFulfillment":["All three bullet points must be addressed","Email must include a Subject line, greeting, body, and closing"]},"benchmarkLevel":"CLB 8","benchmarkAnswer":"Subject: Heating Not Working — Urgent Repair Needed\n\nDear Mr. Thompson,\n\nI am writing to inform you that the heating system in my apartment, Unit 4B at 220 Maple Street, has not been functioning for the past seven days. Despite adjusting the thermostat, no heat is produced at any time of day.\n\nThis situation is seriously affecting my daily life. The indoor temperature has dropped below 15°C on several nights, making it difficult to sleep and concentrate on work. I am also concerned about the health risks, particularly as I have a young child at home.\n\nUnder the residential tenancy agreement, tenants are entitled to adequate heat. I kindly request that a qualified technician be sent to inspect and repair the heating system by this Friday, May 16th. If the issue cannot be resolved by that date, I would appreciate written confirmation of the expected timeline.\n\nThank you for your prompt attention to this matter. Please feel free to contact me at 613-555-0192 to arrange access.\n\nSincerely,\nAlex Chen"},{"id":"T1-002","type":"task1","relationship":"neighbour to neighbour","tone":"informal apology","situation":"You borrowed a book from your neighbour two months ago and you accidentally damaged it. Write an email to your neighbour.","points":["Apologize for the damage","Explain what happened","Suggest how you will make it up to them"],"checks":["sorry","damaged","accident","replace","borrow","apologize"],"rubricHints":{"content":["Open with a genuine, direct apology before explaining","Give a specific, believable account of how the damage occurred","Offer a concrete remedy — replacing the book or compensating monetarily"],"tone":"Warm and informal — this is a neighbour, not a stranger. The email should feel personal and sincere, not like a formal letter.","taskFulfillment":["All three bullet points must be addressed","The remedy offered must be specific, not vague ('I'll make it up to you somehow')"]},"benchmarkLevel":"CLB 8","benchmarkAnswer":"Subject: So Sorry About Your Book\n\nHi Sarah,\n\nI hope you are doing well. I am writing because I owe you a big apology about the book I borrowed from you a couple of months ago — The Midnight Library.\n\nI am really sorry to tell you that it got damaged. Last week, I accidentally knocked over a glass of water on my desk and the book was sitting right there. Several pages got soaked and are now warped. I feel terrible about it because I know you lent it to me in perfect condition.\n\nI would like to replace it for you right away. I checked online and I can order a new copy from Indigo for about $20. I will have it delivered directly to you, or if you prefer, I can give you the money and you can choose the edition you want.\n\nAgain, I am truly sorry. I should have been more careful. Let me know which option works best for you.\n\nWarm regards,\nJamie"},{"id":"T1-003","type":"task1","relationship":"attendee to event organizer","tone":"polite constructive complaint","situation":"You recently attended a community event and were disappointed by the organization. Write an email to the event organizer.","points":["Describe what the event was and when you attended","Explain what you were disappointed by","Offer a suggestion for improvement"],"checks":["event","disappointed","attended","suggestion","improve","organized"],"rubricHints":{"content":["Name the event and provide the date or approximate time of attendance","Be specific about what went wrong — not just 'it was disorganized'","Frame the suggestion positively, as a way to help future events succeed"],"tone":"Politely critical but constructive — not a rant. The organizer is a community volunteer, so the tone should be respectful and solution-focused.","taskFulfillment":["All three bullet points must be addressed","Suggestion must be concrete and actionable"]},"benchmarkLevel":"CLB 8","benchmarkAnswer":"Subject: Feedback on the Riverside Community Fair — May 10th\n\nDear Organizer,\n\nI attended the Riverside Community Fair on Saturday, May 10th, and I wanted to share some feedback about my experience.\n\nWhile I appreciated the effort that went into organizing the event, I was disappointed by the lack of clear signage and scheduling information. Many attendees, including myself, had difficulty finding the main stage area, and there was no printed or posted schedule indicating when activities would take place. As a result, I missed two performances I had specifically come to see.\n\nI understand that organizing a large community event is a significant undertaking, and I genuinely appreciate the work involved. For future events, I would suggest setting up a few information boards at the entrance with a map and timed schedule. Even a simple handout at the gate would make a big difference for visitors who are unfamiliar with the venue.\n\nI look forward to attending future events and hope this feedback is helpful.\n\nSincerely,\nMorgan Lee"},{"id":"T1-004","type":"task1","relationship":"employee to manager","tone":"semi-formal request","situation":"You need to take an unexpected week off work due to a family emergency. Write an email to your manager.","points":["Explain that you need time off and when","Describe the situation briefly","Suggest how your work can be covered while you are away"],"checks":["emergency","leave","week","cover","family","absence"],"rubricHints":{"content":["State the dates of the requested leave clearly","Provide enough context about the family emergency without oversharing personal details","Name a specific colleague or describe a concrete handover plan"],"tone":"Semi-formal — professional and respectful, but not as stiff as a letter to a landlord or professor. The manager relationship allows some warmth.","taskFulfillment":["All three bullet points must be addressed","Coverage plan must be specific — a named person or a concrete action, not just 'I will arrange coverage'"]},"benchmarkLevel":"CLB 8","benchmarkAnswer":"Subject: Emergency Leave Request — May 13–17\n\nHi David,\n\nI am writing to let you know that I need to take an urgent leave of absence from Tuesday, May 13th to Friday, May 17th due to a family emergency. My mother has been hospitalized unexpectedly and I need to travel to be with my family during this time.\n\nI apologize for the short notice and I understand the timing is not ideal given our current project deadlines.\n\nTo minimize disruption, I have already spoken with Priya and she has agreed to handle my client calls and respond to urgent emails while I am away. I will also prepare a brief handover document this afternoon outlining any pending tasks and their priorities. I will have my phone on and will check messages once a day if anything truly urgent comes up.\n\nThank you for your understanding. I will keep you updated on my return date as the situation develops.\n\nBest regards,\nTaylor"},{"id":"T1-005","type":"task1","relationship":"customer to supplier","tone":"formal complaint and inquiry","situation":"You ordered office supplies for your team two weeks ago, but the order has not arrived. Write an email to the supplier.","points":["Provide the order details","Explain the inconvenience this has caused","Ask for an update and a delivery timeline"],"checks":["order","delayed","invoice","inconvenience","delivery","update"],"rubricHints":{"content":["Include a specific order number, date, or product name to identify the order","Describe the business impact of the delay (team affected, deadlines missed, etc.)","Request both a status update AND a specific delivery date"],"tone":"Formal and business-like. This is a B2B interaction — precise and direct, without being rude.","taskFulfillment":["All three bullet points must be addressed","Must ask for both an update on the current status and a committed delivery date"]},"benchmarkLevel":"CLB 8","benchmarkAnswer":"Subject: Follow-Up on Overdue Order #78432\n\nDear Customer Service Team,\n\nI am following up on Order #78432, placed on April 29th for printer paper, pens, and binders totalling $340. As of today, May 13th — two full weeks after placing the order — we have received no delivery confirmation or any shipping update from your team.\n\nThis delay has caused a genuine disruption to our office operations. Our team has run out of essential printing supplies, which is directly affecting our ability to prepare documents and materials for client meetings scheduled this week.\n\nCould you please confirm the current status of this order and provide a specific, committed delivery date? If any items are out of stock or back-ordered, we would appreciate being informed immediately so we can explore alternative suppliers without further delay.\n\nI look forward to your prompt response. You may reply to this email or reach me directly at 416-555-0273.\n\nSincerely,\nRobin Park\nOffice Manager, Brightside Solutions"},{"id":"T1-006","type":"task1","relationship":"guest to hotel manager","tone":"positive formal feedback","situation":"You recently stayed at a hotel and were very satisfied with your experience. Write an email to the hotel manager.","points":["Mention when you stayed and in which room type","Describe one or two things that impressed you","Say that you will recommend the hotel to others"],"checks":["stayed","impressed","recommend","service","room","experience"],"rubricHints":{"content":["Include the check-in date and room type (e.g., deluxe double, suite)","Be specific about what impressed you — name a staff member, a facility, or a particular service","State the recommendation actively — not just 'it was good' but 'I will tell my colleagues / post a review'"],"tone":"Warm and formal appreciation — sincere without being over-the-top. The email should feel genuine, not like a template.","taskFulfillment":["All three bullet points must be addressed","Recommendation statement must be explicit and forward-looking"]},"benchmarkLevel":"CLB 8","benchmarkAnswer":"Subject: Wonderful Stay — Thank You\n\nDear Hotel Manager,\n\nI recently stayed at your hotel from May 2nd to May 5th in a Standard Queen room, and I wanted to take a moment to share how pleased I was with the experience.\n\nTwo things stood out in particular. First, the front desk staff were exceptionally welcoming — especially a team member named Marcus who helped us with a last-minute restaurant recommendation and even arranged a late checkout at no extra charge. Second, the room was spotless and quiet, with comfortable bedding that made for a genuinely restful stay.\n\nI travel to Ottawa several times a year for work, and I can say without hesitation that your hotel will be my first choice going forward. I also plan to recommend it to my colleagues who visit the city regularly, and I will be leaving a positive review on TripAdvisor.\n\nThank you again to your entire team for making the stay so enjoyable.\n\nWarm regards,\nCameron Brooks"},{"id":"T1-007","type":"task1","relationship":"customer to company customer service","tone":"formal complaint requesting resolution","situation":"You bought a laptop online two weeks ago, but it stopped working after five days. Write an email to the company's customer service department.","points":["Describe the product and when you bought it","Explain the problem you experienced","Request a refund or replacement"],"checks":["laptop","defective","refund","replacement","purchased","warranty"],"rubricHints":{"content":["Include the product model name and purchase date","Describe the malfunction specifically — what exactly stopped working and when","State clearly whether you want a refund or a replacement, and why"],"tone":"Firm and formal — you are asserting consumer rights. Avoid being apologetic; the fault is not yours. Be professional but direct.","taskFulfillment":["All three bullet points must be addressed","Resolution request must be specific — refund OR replacement, not both vaguely mentioned"]},"benchmarkLevel":"CLB 8","benchmarkAnswer":"Subject: Defective Laptop — Order #CC-99021 — Requesting Replacement\n\nDear Customer Service,\n\nI am writing regarding a laptop I purchased from your website on April 29th — a TechPro X5 15-inch, Order #CC-99021. The total cost was $1,149.\n\nAfter just five days of normal use, the laptop stopped turning on entirely. I have tried charging it with two different cables and holding the power button for an extended period, but the screen remains completely black. I have not dropped or damaged the device in any way.\n\nGiven that the laptop failed within one week of purchase, I believe this is a manufacturing defect covered under your warranty. I am requesting a full replacement unit rather than a repair, as I need a reliable device for my work and cannot afford to be without a computer for an extended period.\n\nPlease advise on the return process and the expected timeline for the replacement. I have the original packaging and all accessories available.\n\nSincerely,\nJordan Kim\nOrder #CC-99021"},{"id":"T1-008","type":"task1","relationship":"resident to city bylaw enforcement office","tone":"formal complaint to government office","situation":"A construction project near your home has been causing noise early in the morning, before the allowed hours. Write an email to the city bylaw enforcement office.","points":["Describe the location and nature of the disturbance","Mention the times the noise occurs","Request that the rules be enforced"],"checks":["construction","noise","bylaw","hours","enforcement","disturbance"],"rubricHints":{"content":["Provide the street address or intersection of the construction site","State the exact times the noise starts and how many days this has occurred","Reference the bylaw or permitted hours if known; request specific enforcement action"],"tone":"Formal and factual — like a complaint to a government office. Avoid emotional language; rely on facts and cite rules.","taskFulfillment":["All three bullet points must be addressed","Must explicitly request enforcement action, not just describe the problem"]},"benchmarkLevel":"CLB 8","benchmarkAnswer":"Subject: Noise Bylaw Complaint — Construction at 85 Rideau Terrace\n\nDear Bylaw Enforcement Officer,\n\nI am writing to file a formal complaint regarding a construction project at 85 Rideau Terrace, Ottawa. For the past ten days, heavy machinery and drilling have been operating as early as 5:30 a.m., which is before the permitted construction hours of 7:00 a.m. under the City of Ottawa Noise Control By-Law.\n\nThe noise has occurred every weekday morning, consistently starting between 5:30 and 6:15 a.m. It is audible from several homes on our street and has disrupted sleep for a number of residents, including my household.\n\nI am requesting that your office investigate this complaint and take appropriate action to ensure the construction contractor complies with the permitted hours. If helpful, I am prepared to provide dates and times I have documented, as well as contact information for other affected neighbours.\n\nThank you for your attention to this matter.\n\nSincerely,\nAvery Nguyen\n47 Rideau Terrace, Ottawa"},{"id":"T1-009","type":"task1","relationship":"resident to city parks department","tone":"semi-formal proposal and inquiry","situation":"You want to apply for a grant to start a community garden in your neighbourhood. Write an email to the city parks department.","points":["Describe your idea for the community garden","Explain the benefits for the neighbourhood","Ask about the grant application process"],"checks":["garden","grant","community","benefits","application","neighbourhood"],"rubricHints":{"content":["Describe the garden concept with at least one specific detail (location, size, type of plants)","Give two or more concrete community benefits beyond just 'it's nice'","Ask a direct question about how to apply for the grant"],"tone":"Semi-formal and enthusiastic — you are a civic-minded resident approaching a government department with a positive proposal. Warm but professional.","taskFulfillment":["All three bullet points must be addressed","Must include an actual question about the grant process, not just mention that a grant exists"]},"benchmarkLevel":"CLB 8","benchmarkAnswer":"Subject: Community Garden Grant Inquiry — Elmwood Park Area\n\nDear Parks Department,\n\nMy name is Sam Rivera, and I am a resident of the Elmwood Park neighbourhood. I am writing to inquire about grant opportunities to establish a community vegetable garden on the unused green space adjacent to the Elmwood Community Centre on Beechwood Avenue.\n\nThe plan is to create a shared garden with approximately 20 raised planting beds for local residents. The garden would grow vegetables and herbs, with a small tool storage area and water access.\n\nThis project would benefit the neighbourhood in two key ways. It would give residents — particularly families and seniors — an accessible outdoor space for activity and social connection, and it would provide fresh produce to households without private gardens.\n\nCould you let me know whether the city offers grants for projects like this, and if so, how to apply and when the next deadline is?\n\nThank you for your time. I appreciate any guidance you can offer.\n\nSincerely,\nSam Rivera"},{"id":"T1-010","type":"task1","relationship":"student to professor","tone":"polite formal request","situation":"You are a student and you need an extension on a major assignment due to illness. Write an email to your professor.","points":["Explain that you have been unwell","Request a specific extension (e.g., one week)","Assure your professor you will submit quality work by the new date"],"checks":["extension","illness","assignment","deadline","submit","quality"],"rubricHints":{"content":["Briefly describe the illness without excessive detail — enough to be credible","State a specific new deadline you are requesting, not just 'a few more days'","Express commitment to the quality of your work by the new date"],"tone":"Respectful and formal — a professor expects academic register. Avoid being overly casual or making excuses; be direct and take responsibility.","taskFulfillment":["All three bullet points must be addressed","Extension request must include a specific date","Closing should reaffirm commitment, not just apologize"]},"benchmarkLevel":"CLB 8","benchmarkAnswer":"Subject: Extension Request — Research Paper, ENGL 302\n\nDear Professor Okonkwo,\n\nI am writing to respectfully request a short extension on the research paper due this Friday, May 16th, for ENGL 302.\n\nUnfortunately, I have been ill with a respiratory infection since last Tuesday and was advised by a doctor to rest for several days. As a result, I was unable to complete the research and writing required to produce work that meets the standard I would normally hold myself to.\n\nI would be very grateful if you could grant me a one-week extension, with a new submission date of Friday, May 23rd. I have already completed a solid outline and gathered my sources; with one additional week, I am confident I can submit a well-argued and carefully written paper.\n\nI can provide a doctor's note if required. Thank you very much for your understanding, and I apologize for any inconvenience this request may cause.\n\nRespectfully,\nChris Yamamoto\nStudent ID: 20198834"},{"id":"T2-001","type":"task2","relationship":"resident responding to city survey","tone":"persuasive opinion essay","situation":"A local survey asked residents whether the city should convert an unused parking lot downtown into a public park.","points":["Option A: Keep the parking lot to support local businesses","Option B: Convert it into a public green space for residents"],"checks":["park","parking","businesses","residents","community","benefit"],"rubricHints":{"content":["State a clear position in the opening sentence — do not delay","Provide two distinct reasons, each with a specific supporting detail or example","Acknowledge the opposing view briefly and counter it"],"tone":"Confident and persuasive — this is a survey response, so write as an informed citizen making a case, not just listing neutral pros and cons.","taskFulfillment":["Must clearly choose ONE option and defend it","Do not sit on the fence or say 'both have advantages'","Conclusion must restate the position, not introduce new information"]},"benchmarkLevel":"CLB 8","benchmarkAnswer":"I strongly support converting the unused parking lot into a public park. While I understand that some business owners rely on nearby parking, the long-term benefits of accessible green space far outweigh the short-term convenience of extra spots.\n\nFirst, a downtown park would meaningfully improve quality of life for residents and workers in the area. Many people in urban centres have very limited access to outdoor spaces for relaxation or exercise. A park with benches, trees, and walking paths would serve these daily needs throughout the year.\n\nSecond, green spaces attract more foot traffic to nearby businesses, not less. A well-used park can draw people downtown on weekends and after work, benefiting local cafés and shops more effectively than an empty parking lot would.\n\nFor those concerned about parking, the city can encourage use of nearby parkades or strengthen transit connections to reduce car dependency. Converting this lot into a park is a meaningful investment in community well-being that our city should make."},{"id":"T2-002","type":"task2","relationship":"employee responding to company survey","tone":"persuasive opinion essay","situation":"A company survey is asking employees for their preference on work arrangements.","points":["Option A: Work entirely from home","Option B: Work in the office full time"],"checks":["remote","office","productivity","collaboration","work-life","commute"],"rubricHints":{"content":["Open with a clear preference for one option","Give two reasons specific to the work context — not just general life preferences","Address one practical concern about your chosen option and counter it"],"tone":"Professional — this is a workplace survey. Avoid complaining about commutes in a way that sounds lazy; frame the argument around productivity and outcomes.","taskFulfillment":["Must clearly choose ONE option","Arguments should be workplace-relevant, not purely personal","Conclusion must be decisive"]},"benchmarkLevel":"CLB 8","benchmarkAnswer":"I prefer working from home full time, as I have found it to be significantly more productive for my role and well-being.\n\nThe most important benefit is the reduction in daily interruptions. In an open-plan office, it can be difficult to focus on complex tasks due to noise and frequent unplanned conversations. At home, I can structure my day around deep work periods and schedule calls and collaboration at specific times, which has noticeably improved the quality of my output.\n\nAdditionally, eliminating the daily commute gives me back approximately two hours each day. I use this time for exercise and meal preparation, which has improved my energy levels and reduced the fatigue I used to feel by midweek. This translates directly into better performance during working hours.\n\nI recognize that in-person collaboration has value, particularly for brainstorming and onboarding new team members. A hybrid model with optional office days could address this without requiring full-time office attendance. However, if the choice is between fully remote and fully in-office, I would choose remote work without hesitation."},{"id":"T2-003","type":"task2","relationship":"parent responding to school board survey","tone":"persuasive opinion essay","situation":"A school board survey asked parents whether homework should be required for elementary school students.","points":["Option A: Assign homework regularly to build study habits","Option B: Eliminate homework to reduce stress and allow more family time"],"checks":["homework","children","habits","stress","learning","family"],"rubricHints":{"content":["Take a clear position in the opening — which option do you choose?","Ground your argument in child development or educational outcomes, not just parental convenience","Acknowledge the opposing view's strongest point and respond to it"],"tone":"Thoughtful and measured — this is a parenting/education topic where nuance matters. Be confident but not dismissive of the other side.","taskFulfillment":["Must clearly choose ONE option","Reasons should relate to children's well-being or academic outcomes","Avoid making the essay purely about parental schedule preferences"]},"benchmarkLevel":"CLB 8","benchmarkAnswer":"I believe homework should be eliminated for elementary school students. While the intention is to reinforce learning, the evidence suggests that for young children, it does more harm than good.\n\nFor children in grades one through six, the most important learning happens in the classroom, through direct instruction and interaction with peers. After school, children need unstructured time to play and rest — activities essential for healthy development and creativity. When evenings are consumed by homework, children often rush through it in a stressed state, which does little to deepen their understanding.\n\nHomework also creates inequality. Children whose parents have time and education to assist them have a clear advantage over those whose parents work multiple jobs or do not speak the language of instruction. Eliminating homework makes the learning experience more equitable.\n\nI understand the concern about building study habits early. However, this goal can be met through in-class activities such as reading logs and short projects. Elementary school should build a love of learning — not become a nightly source of stress."},{"id":"T2-004","type":"task2","relationship":"citizen responding to national survey","tone":"persuasive opinion essay","situation":"A national survey is asking whether voting in elections should be made mandatory for all citizens.","points":["Your task: Do you support or oppose mandatory voting?","Use specific reasons and examples to explain your position."],"checks":["voting","mandatory","democracy","rights","participation","citizens"],"rubricHints":{"content":["State support or opposition clearly in the first sentence","Make at least one argument about democratic principles or civic responsibility","Use a real-world example — a country that has implemented mandatory voting (e.g., Australia)"],"tone":"Civic and persuasive — you are engaging with a policy question. Be confident and take a real stance; avoid writing a neutral pros-and-cons list.","taskFulfillment":["Must clearly support OR oppose — no fence-sitting","At least one reason must go beyond 'it's a good idea' — explain WHY it matters","Conclusion must reinforce the position"]},"benchmarkLevel":"CLB 8","benchmarkAnswer":"I support mandatory voting for all eligible citizens. While some argue it violates individual freedom, I believe the health of a democracy depends on broad participation, and making voting compulsory is a reasonable civic duty.\n\nWhen turnout is low, election results reflect only a small, unrepresentative portion of the population. This can produce governments and policies that serve narrow interests rather than the majority. Mandatory voting ensures that all voices are counted, not just those of the most politically engaged.\n\nAustralia provides a compelling real-world example. Since making voting compulsory in 1924, it has consistently achieved turnout above 90%. Crucially, voters are not required to choose a candidate — submitting a blank ballot is permitted — so personal freedom is preserved while participation is guaranteed.\n\nCritics argue people should not be forced into a system they distrust. However, compulsory voting gives governments a direct incentive to address public concerns, since they can no longer win elections simply by mobilizing their existing base. I believe this ultimately strengthens democracy."},{"id":"T2-005","type":"task2","relationship":"resident responding to city survey","tone":"persuasive opinion essay","situation":"A city survey asked residents whether all public transit should be made free for everyone, funded by increased municipal taxes.","points":["Your task: Do you support or oppose free public transit?","Use specific reasons and examples to explain your view."],"checks":["transit","free","tax","environment","affordable","buses"],"rubricHints":{"content":["State your position clearly upfront","Connect the argument to either affordability, environment, or traffic congestion — pick the strongest angle","Address the tax funding concern directly — do not ignore it"],"tone":"Civic and policy-focused. Avoid making it purely about personal savings; frame arguments in terms of community benefit.","taskFulfillment":["Must clearly support or oppose","Must address the tax trade-off, not just argue for free transit in a vacuum","Conclusion should restate the core reason for the position"]},"benchmarkLevel":"CLB 8","benchmarkAnswer":"I support making public transit free for all residents, funded through municipal taxes. Although this requires additional public spending, the broader community benefits clearly justify the investment.\n\nThe most significant benefit is reduced traffic congestion. Many people drive to work not because they prefer it, but because transit is too expensive or inconvenient. Removing the cost barrier would encourage more commuters to switch to buses and trains, reducing the number of vehicles on the road, improving air quality, and shortening commute times for everyone in the city.\n\nFree transit would also provide meaningful financial relief to low-income residents, who currently spend a disproportionate share of their income on transportation. In many Canadian cities, monthly transit passes cost over $100 — a serious and ongoing burden for families living paycheque to paycheque.\n\nI understand that tax funding raises legitimate concerns. However, the city already spends heavily on road maintenance and parking infrastructure. Redirecting a portion of that spending toward free transit is a more equitable and environmentally responsible use of public funds."},{"id":"T2-006","type":"task2","relationship":"consumer responding to government survey","tone":"persuasive opinion essay","situation":"A consumer survey is asking whether stores should be required to charge an extra fee for plastic bags.","points":["Your task: Do you support or oppose a mandatory plastic bag fee?","Give specific reasons and examples to support your position."],"checks":["plastic","fee","environment","reusable","waste","policy"],"rubricHints":{"content":["State your position in the opening sentence","Use at least one piece of evidence or real-world example — cities or countries that have implemented bag fees","Acknowledge consumer inconvenience as a counterargument and address it"],"tone":"Confident and evidence-based. Reference real-world examples to strengthen the argument.","taskFulfillment":["Must clearly support or oppose","At least one argument should reference environmental impact specifically","Counter the strongest objection before concluding"]},"benchmarkLevel":"CLB 8","benchmarkAnswer":"I strongly support a mandatory fee on plastic bags. This simple policy change has been shown to dramatically reduce plastic waste and shift consumer behaviour in cities around the world.\n\nIreland introduced a plastic bag tax in 2002 and saw a 90% drop in usage within a year. Similar results followed the introduction of five-cent fees in cities across Canada. The evidence is clear: even a small financial nudge consistently encourages people to bring reusable bags instead.\n\nPlastic bags are among the most common forms of litter found in parks, rivers, and along coastlines. They take hundreds of years to break down and cause serious harm to wildlife. A bag fee is a low-cost, proven way to reduce this environmental damage without banning anything outright.\n\nSome argue the fee unfairly burdens low-income shoppers. This concern is valid, but the cost is small and entirely avoidable — shoppers who bring their own bags pay nothing extra. The environmental benefits far outweigh the minor inconvenience."},{"id":"T2-007","type":"task2","relationship":"community member responding to public survey","tone":"persuasive opinion essay","situation":"A survey asked people whether smartphones should be banned in classrooms from kindergarten to Grade 12.","points":["Your task: Do you support or oppose banning smartphones in schools?","Use specific reasons and examples to support your view."],"checks":["smartphones","ban","distraction","students","focus","school"],"rubricHints":{"content":["Take a clear stance immediately","Make at least one argument about academic outcomes or student well-being — not just 'phones are distracting'","Address the argument that phones have legitimate educational uses"],"tone":"Direct and evidence-aware. Reference observable trends in student attention or mental health to ground the argument.","taskFulfillment":["Must clearly support or oppose","Go deeper than surface-level arguments — explain the mechanism, not just the outcome","Conclusion must be decisive"]},"benchmarkLevel":"CLB 8","benchmarkAnswer":"I support banning smartphones in schools from kindergarten to Grade 12. Phones have become one of the most significant barriers to student learning and social development, and a clear policy ban is the most effective solution.\n\nThe core problem is not that students occasionally check their phones — it is that social media and messaging apps are specifically engineered to capture attention repeatedly. Even when phones are face-down on desks, students report thinking about them. Research from several countries shows that removing phones from classrooms improves focus and academic performance, particularly for students who already struggle with attention.\n\nThere is also growing evidence linking heavy phone use during school hours to increased anxiety and social comparison among teenagers. A phone-free environment gives students a meaningful daily break from these pressures.\n\nOpponents argue that phones have legitimate educational value for research. However, schools already provide computers and tablets for this purpose. A ban on personal smartphones removes an uncontrolled distraction without limiting access to educational technology."},{"id":"T2-008","type":"task2","relationship":"citizen responding to government survey","tone":"persuasive opinion essay","situation":"A government survey is asking whether all new residential buildings should be required to install solar panels.","points":["Your task: Do you support or oppose this requirement?","Give specific reasons and examples."],"checks":["solar","energy","environment","cost","buildings","renewable"],"rubricHints":{"content":["State your position clearly at the outset","Make at least one argument about long-term cost savings or energy independence, not just environmental idealism","Address the upfront cost concern directly"],"tone":"Pragmatic and forward-looking. Avoid making this purely about environmentalism — the strongest argument combines environmental and economic reasoning.","taskFulfillment":["Must clearly support or oppose","Address the cost objection with a specific counter (e.g., payback period, government incentives)","Conclusion must be decisive and summary-focused"]},"benchmarkLevel":"CLB 8","benchmarkAnswer":"I support requiring all new residential buildings to install solar panels. While the upfront cost is a legitimate concern, the long-term benefits for homeowners and Canada's energy infrastructure make this a sound and timely policy.\n\nSolar panels installed during new construction cost significantly less than retrofitting an existing building — often 30 to 40 percent less. This makes the construction phase the most efficient point to deploy them at scale. Homeowners benefit from lower electricity bills for decades, with most systems paying back their full cost within seven to ten years.\n\nAt a national level, widespread residential solar reduces dependence on fossil fuel power plants, helping Canada meet its emissions reduction targets. California has required solar on all new homes since 2020 and has seen measurable reductions in peak grid demand as a result.\n\nCritics point to the added cost for new homebuyers. However, solar panels add measurable resale value, and the government can offer low-interest financing to ease the burden. The long-term benefits clearly outweigh the upfront costs."},{"id":"T2-009","type":"task2","relationship":"worker or citizen responding to government survey","tone":"persuasive opinion essay","situation":"A survey is asking whether the government should raise the minimum wage significantly over the next two years.","points":["Your task: Do you support or oppose raising the minimum wage?","Use specific reasons and examples to explain your position."],"checks":["minimum wage","workers","cost of living","businesses","income","poverty"],"rubricHints":{"content":["Take a clear position in the opening sentence","Ground the argument in real economic impact — purchasing power, poverty reduction, or small business concerns","Address the counterargument about job losses or business burden"],"tone":"Economically aware and balanced in tone, while still taking a clear side. Avoid purely emotional language.","taskFulfillment":["Must clearly support or oppose","Must engage with the economic trade-offs, not just moral arguments","Conclusion must restate why the benefits outweigh the costs, or vice versa"]},"benchmarkLevel":"CLB 8","benchmarkAnswer":"I support raising the minimum wage significantly over the next two years. With the costs of housing, groceries, and transportation rising sharply, the current minimum wage no longer provides workers with a basic standard of living, and a meaningful increase is long overdue.\n\nThe clearest benefit is reduced poverty among working adults. Many full-time minimum wage earners still cannot afford rent in major Canadian cities. A higher wage also increases consumer spending, which supports local businesses and stimulates the broader economy.\n\nOpponents warn that higher labour costs will force small businesses to cut jobs. However, evidence from provinces and states that have already raised wages shows the anticipated job losses often do not materialize. Workers who earn more also tend to stay in their jobs longer, reducing the significant cost of staff turnover.\n\nA phased increase over two years gives businesses adequate time to adjust. Combined with targeted support such as tax credits for small employers, this policy can be implemented fairly. I believe it is the right step for working Canadians."},{"id":"T2-010","type":"task2","relationship":"student or community member responding to university survey","tone":"persuasive opinion essay","situation":"A university is considering requiring all first-year students to take a mandatory course in financial literacy.","points":["Your task: Do you support or oppose this requirement?","Use specific reasons and examples."],"checks":["financial literacy","budgeting","students","debt","mandatory","education"],"rubricHints":{"content":["State your position in the opening sentence","Make at least one argument about the practical gap in financial education that most students have","Address the concern about adding to an already full course load"],"tone":"Practical and student-focused. The strongest argument connects this to real financial challenges young people face — student debt, credit cards, first apartments.","taskFulfillment":["Must clearly support or oppose","Arguments should be grounded in the student experience, not abstract theory","Conclusion must be clear and forward-looking"]},"benchmarkLevel":"CLB 8","benchmarkAnswer":"I support requiring first-year university students to complete a mandatory financial literacy course. Most young people arrive at university with little understanding of personal finance, and this gap has real, lasting consequences.\n\nMany students take on significant debt without fully understanding interest rates or loan repayment schedules. Others use credit cards without knowing how minimum payments work, leading to debt that follows them for years. A course covering budgeting, student loans, credit scores, and basic investing would give students the tools to make informed decisions during one of the most financially consequential periods of their lives.\n\nPractical skills like reading a lease, filing taxes for the first time, or building an emergency fund are rarely taught in school. A single introductory course could fill this gap for an entire student population.\n\nSome argue the course adds burden to an already demanding first year. However, designed as a low-credit, one-semester offering, it is a small time investment with lifelong value. I believe every university should make it a standard requirement."},{"id":"X-T1-001","type":"task1","title":"Unresolved Washing Machine Repair","relationship":"customer to service manager","tone":"polite formal complaint","situation":"You arranged for a company to repair your washing machine. The technician arrived two hours late, left without testing the machine, and the same problem returned the next day. Write an email to the service manager. In your email:","points":["explain what happened during the appointment","describe how the unresolved problem has affected you","request a specific solution"],"checks":["repair","technician","late","unresolved","affected","solution"],"rubricHints":{"content":["State the purpose clearly in the opening paragraph","Address all three bullet points with specific details","Make the requested solution or next step unambiguous"],"tone":"Match the relationship and purpose. Be polite, clear, and appropriately firm.","taskFulfillment":["Use email format with a greeting and closing","Write 150-200 words","Cover every instruction in the prompt"]},"wordTarget":"150-200","timeMinutes":27,"sourceSet":"W1","origin":"codex-original-unofficial-2026-07-28","benchmarkAnswer":"Subject: Request for Follow-Up Washing Machine Repair\n\nDear Service Manager,\n\nI am writing about the repair appointment for my washing machine on July 24. The technician was scheduled to arrive at 1:00 p.m. but did not arrive until 3:00. After a brief inspection, he adjusted the drainage hose and left without running a complete wash cycle.\n\nUnfortunately, the same problem returned the following morning. The machine stopped halfway through a load, leaving water in the drum and our clothes soaking wet. My family has been unable to wash work uniforms or towels, and I have already spent additional money at a laundromat.\n\nI would appreciate a follow-up visit from an experienced technician within the next two business days. Please ask the technician to test a full cycle before leaving. Since the first repair did not resolve the problem, I also request that the second visit be provided without another service fee. If a prompt repair is not possible, please refund the original charge.\n\nPlease confirm the appointment time by email.\n\nSincerely,\nJordan Lee","benchmarkLevel":"CLB 8"},{"id":"X-T2-001","type":"task2","title":"Neighbourhood Park Funding","relationship":"resident or employee responding to a survey","tone":"persuasive opinion response","situation":"Your city has received extra funding for a neighbourhood park.","points":["Option A: Build a fenced off-leash dog area.","Option B: Add shaded seating and public washrooms."],"checks":["park","dog","seating","washrooms","residents","community"],"rubricHints":{"content":["State one clear choice near the beginning","Develop two distinct reasons with examples","Briefly compare the other option where useful"],"tone":"Write as an informed resident or employee making a persuasive recommendation.","taskFulfillment":["Choose and defend one option","Write 150-200 words","Use connected paragraphs rather than a list"]},"wordTarget":"150-200","timeMinutes":26,"sourceSet":"W1","origin":"codex-original-unofficial-2026-07-28","benchmarkAnswer":"I would use the extra funding to add shaded seating and public washrooms. Although a fenced dog area would benefit pet owners, the second option would serve a much wider range of residents.\n\nFirst, shade and seating would make the park usable for longer periods. At present, older adults and parents with young children often leave quickly on hot days because there is nowhere comfortable to rest. Covered tables and benches would also support picnics, community events, and casual meetings.\n\nPublic washrooms would provide an equally important improvement. Families, seniors, runners, and people with medical needs could remain in the park without having to search for a nearby business. This would make the space more accessible and encourage residents to visit throughout the day.\n\nAn off-leash area could still be considered in a future project, especially if another suitable site becomes available. However, limited public funding should address needs shared by the greatest number of people. For that reason, shaded seating and washrooms would be the more inclusive and practical investment for our neighbourhood.","benchmarkLevel":"CLB 8"},{"id":"X-T1-002","type":"task1","title":"Request to Adjust a Changed Work Schedule","relationship":"employee to manager","tone":"polite semi-formal request","situation":"Your employer has changed your work schedule with very little notice. The new hours conflict with an evening course that your manager previously approved. Write an email to your manager. In your email:","points":["explain the scheduling conflict","describe why the course is important to your work","suggest a workable compromise"],"checks":["schedule","course","approved","conflict","work","compromise"],"rubricHints":{"content":["State the purpose clearly in the opening paragraph","Address all three bullet points with specific details","Make the requested solution or next step unambiguous"],"tone":"Match the relationship and purpose. Be polite, clear, and appropriately firm.","taskFulfillment":["Use email format with a greeting and closing","Write 150-200 words","Cover every instruction in the prompt"]},"wordTarget":"150-200","timeMinutes":27,"sourceSet":"W2","origin":"codex-original-unofficial-2026-07-28","benchmarkAnswer":"Subject: Request to Review My New Work Schedule\n\nDear Ms. Ahmed,\n\nI am writing about the schedule issued yesterday. Beginning next Monday, I have been assigned to work until 8:00 p.m. on Tuesdays and Thursdays. These hours conflict with the project-management course you approved in May, which runs from 6:30 to 8:30 on both evenings.\n\nThe course is directly related to my current role. It covers scheduling, risk tracking, and team communication, and I have already begun applying several of these methods to the Riverside account. I also paid the tuition after receiving approval and cannot transfer to another section this term.\n\nCould I keep my previous daytime schedule on Tuesdays and Thursdays for the next six weeks? In return, I am willing to take the late shift on Wednesdays and alternate Saturdays. I can also remain available by phone for urgent questions after class.\n\nI understand that the team needs reliable evening coverage, and I hope this arrangement would meet that need without forcing me to withdraw from the course. Please let me know if we can discuss the proposal tomorrow.\n\nBest regards,\nMina Chen","benchmarkLevel":"CLB 8"},{"id":"X-T2-002","type":"task2","title":"Hybrid Workplace Policy","relationship":"resident or employee responding to a survey","tone":"persuasive opinion response","situation":"Your company is reviewing its workplace policy.","points":["Option A: Employees should work in the office five days a week.","Option B: Employees should be allowed a hybrid schedule."],"checks":["office","hybrid","employees","collaboration","flexibility","productivity"],"rubricHints":{"content":["State one clear choice near the beginning","Develop two distinct reasons with examples","Briefly compare the other option where useful"],"tone":"Write as an informed resident or employee making a persuasive recommendation.","taskFulfillment":["Choose and defend one option","Write 150-200 words","Use connected paragraphs rather than a list"]},"wordTarget":"150-200","timeMinutes":26,"sourceSet":"W2","origin":"codex-original-unofficial-2026-07-28","benchmarkAnswer":"I recommend allowing employees to follow a hybrid schedule. Requiring everyone to attend the office five days a week may appear simple, but it would reduce flexibility without guaranteeing better collaboration.\n\nHybrid work allows employees to complete focused tasks at home while reserving office days for meetings, training, and group decisions. For example, our analysts often need several uninterrupted hours to prepare reports. They can do this efficiently at home and then review the results with colleagues in person the following day.\n\nThe policy would also reduce commuting time and make the company more competitive when recruiting experienced staff. Employees who spend less time travelling are likely to have more energy and may be less likely to leave for a more flexible employer.\n\nTo maintain teamwork, the company could require two shared office days each week and allow individual departments to schedule additional in-person sessions when necessary. Performance should be measured by deadlines and quality rather than by the number of hours spent at a desk. A structured hybrid policy would therefore protect collaboration while giving employees practical flexibility.","benchmarkLevel":"CLB 8"},{"id":"X-T1-003","type":"task1","title":"Refund Request for a Cancelled Festival","relationship":"customer to event organizer","tone":"polite formal complaint","situation":"You bought tickets for a weekend food festival. The event was cancelled because of weather, but the organizer offered only a credit for next year's festival. Write an email to the organizer. In your email:","points":["explain why the credit is not suitable for you","describe the information that was unclear when you purchased","request an alternative form of compensation"],"checks":["festival","cancelled","credit","purchase","compensation","refund"],"rubricHints":{"content":["State the purpose clearly in the opening paragraph","Address all three bullet points with specific details","Make the requested solution or next step unambiguous"],"tone":"Match the relationship and purpose. Be polite, clear, and appropriately firm.","taskFulfillment":["Use email format with a greeting and closing","Write 150-200 words","Cover every instruction in the prompt"]},"wordTarget":"150-200","timeMinutes":27,"sourceSet":"W3","origin":"codex-original-unofficial-2026-07-28","benchmarkAnswer":"Subject: Refund Request for Cancelled Food Festival\n\nDear Festival Organizer,\n\nI am writing regarding two weekend passes I purchased for the Lakeside Food Festival. I understand that severe weather required the event to be cancelled; however, the credit offered for next year is not a suitable solution for me.\n\nI will be moving out of the province in September, so I will not be able to attend next year’s event. In addition, when I bought the tickets, the checkout page did not clearly state that cancelled events would be compensated only with a future credit. The confirmation email simply said that schedule changes would be announced online.\n\nI paid $86 for the two passes and also purchased them on behalf of a visiting relative. I therefore request a refund to the original payment method. If a full refund is not available, I would accept a transferable voucher that can be used at another event operated by your company within the next six months.\n\nPlease confirm which option you can provide and when it will be processed. I appreciate your attention to this matter.\n\nSincerely,\nAlex Morgan","benchmarkLevel":"CLB 8"},{"id":"X-T2-003","type":"task2","title":"Extended Library Hours","relationship":"resident or employee responding to a survey","tone":"persuasive opinion response","situation":"Your local library can extend its hours in only one way.","points":["Option A: Open two hours earlier on weekdays.","Option B: Stay open three hours later on Fridays and Saturdays."],"checks":["library","hours","weekdays","evening","access","community"],"rubricHints":{"content":["State one clear choice near the beginning","Develop two distinct reasons with examples","Briefly compare the other option where useful"],"tone":"Write as an informed resident or employee making a persuasive recommendation.","taskFulfillment":["Choose and defend one option","Write 150-200 words","Use connected paragraphs rather than a list"]},"wordTarget":"150-200","timeMinutes":26,"sourceSet":"W3","origin":"codex-original-unofficial-2026-07-28","benchmarkAnswer":"I would extend the library’s hours on Friday and Saturday evenings. Opening earlier on weekdays may help a small number of morning visitors, but later weekend hours would meet a greater community need.\n\nMany students and full-time employees cannot reach the library before it closes. Three additional evening hours would give them a quiet place to study, use reliable internet, or receive help with research. This is particularly important for residents who share crowded housing or do not have a computer at home.\n\nLater hours would also support community activities. The library could schedule language clubs, workshops, and tutoring sessions at times when working adults and families are available. Because these programs would occur on only two evenings, staffing should be easier to manage than adding ten separate morning hours across the workweek.\n\nSome retirees and shift workers might prefer an earlier weekday opening. However, many of them already have access during the current daytime schedule. Extending Friday and Saturday evenings would reach people who are presently excluded. It would therefore provide the strongest return on the library’s limited budget.","benchmarkLevel":"CLB 8"},{"id":"X-T1-004","type":"task1","title":"Repeated Late-Night Apartment Noise","relationship":"tenant to property manager","tone":"polite but firm complaint","situation":"A new tenant in the apartment above you regularly makes loud noise after midnight. You have spoken politely to the tenant, but the problem has continued. Write an email to your property manager. In your email:","points":["describe the noise and when it occurs","explain what you have already done","ask the manager to take specific action"],"checks":["noise","midnight","tenant","spoken","continued","action"],"rubricHints":{"content":["State the purpose clearly in the opening paragraph","Address all three bullet points with specific details","Make the requested solution or next step unambiguous"],"tone":"Match the relationship and purpose. Be polite, clear, and appropriately firm.","taskFulfillment":["Use email format with a greeting and closing","Write 150-200 words","Cover every instruction in the prompt"]},"wordTarget":"150-200","timeMinutes":27,"sourceSet":"W4","origin":"codex-original-unofficial-2026-07-28","benchmarkAnswer":"Subject: Ongoing Late-Night Noise from Unit 504\n\nDear Property Manager,\n\nI am writing to report ongoing noise from the apartment directly above mine. During the past three weeks, loud music, furniture movement, and repeated footsteps have occurred after midnight, usually between 12:30 and 2:00 a.m. The disturbance has happened at least four nights each week.\n\nI spoke politely with the tenant on July 18 and explained that I begin work early in the morning. The tenant apologized and said the noise would stop, but there has been no lasting improvement. I also left a friendly written reminder two days ago.\n\nThe interrupted sleep is now affecting my concentration at work. Could you please contact the tenant formally, remind them of the building’s quiet-hours policy, and document the complaint? If the problem continues, I ask that you follow the next step in the lease-enforcement process. I can provide a log of dates and times if required.\n\nPlease let me know what action will be taken. I would prefer to resolve this calmly and maintain a respectful relationship with my neighbour.\n\nSincerely,\nTaylor Wong\nUnit 404","benchmarkLevel":"CLB 8"},{"id":"X-T2-004","type":"task2","title":"Commercial Street Redesign","relationship":"resident or employee responding to a survey","tone":"persuasive opinion response","situation":"The city will redesign a busy commercial street.","points":["Option A: Add protected bicycle lanes and wider sidewalks.","Option B: Keep the existing lanes and add more short-term parking."],"checks":["bicycle","sidewalk","parking","business","safety","street"],"rubricHints":{"content":["State one clear choice near the beginning","Develop two distinct reasons with examples","Briefly compare the other option where useful"],"tone":"Write as an informed resident or employee making a persuasive recommendation.","taskFulfillment":["Choose and defend one option","Write 150-200 words","Use connected paragraphs rather than a list"]},"wordTarget":"150-200","timeMinutes":26,"sourceSet":"W4","origin":"codex-original-unofficial-2026-07-28","benchmarkAnswer":"I support adding protected bicycle lanes and wider sidewalks to the commercial street. Keeping the current road design for a few extra parking spaces would preserve convenience for some drivers, but it would not address the street’s safety and congestion problems.\n\nProtected lanes would separate cyclists from moving vehicles and reduce sudden conflicts at the curb. Wider sidewalks would also give pedestrians, wheelchair users, and parents with strollers more room. A safer and more comfortable street encourages people to walk or cycle rather than making every short trip by car.\n\nThe redesign could also help local businesses. Customers travelling on foot or by bicycle often stop at several stores, while drivers may pass through without shopping. Wider sidewalks would create space for benches, trees, and small patios, making the area a destination instead of merely a traffic route.\n\nSome merchants may worry about losing short-term parking. The city could provide loading spaces on side streets and improve signs directing drivers to nearby lots. These adjustments would protect essential access while creating a safer, more attractive commercial district with long-term value.","benchmarkLevel":"CLB 8"},{"id":"X-T1-005","type":"task1","title":"Overlapping Volunteer Assignments","relationship":"volunteer to coordinator","tone":"cooperative semi-formal request","situation":"You volunteered to help at a community fundraiser, but the coordinator has assigned you two jobs at overlapping times. Write an email to the coordinator. In your email:","points":["identify the two conflicting responsibilities","explain which role you are better prepared to do","propose how the other role could still be covered"],"checks":["volunteer","overlap","responsibilities","prepared","role","covered"],"rubricHints":{"content":["State the purpose clearly in the opening paragraph","Address all three bullet points with specific details","Make the requested solution or next step unambiguous"],"tone":"Match the relationship and purpose. Be polite, clear, and appropriately firm.","taskFulfillment":["Use email format with a greeting and closing","Write 150-200 words","Cover every instruction in the prompt"]},"wordTarget":"150-200","timeMinutes":27,"sourceSet":"W5","origin":"codex-original-unofficial-2026-07-28","benchmarkAnswer":"Subject: Conflict Between My Fundraiser Assignments\n\nHello Ms. Rivera,\n\nThank you for organizing Saturday’s community fundraiser. I noticed that I have been assigned to register guests from 9:00 to 11:00 a.m. and lead the children’s activity station from 10:30 a.m. to noon. Because the two responsibilities overlap, I will not be able to complete both properly.\n\nI am better prepared to manage registration. I helped with check-in at last year’s event, I am familiar with the payment system, and I can answer common questions about the schedule. Remaining at the entrance would also provide continuity during the busiest arrival period.\n\nCould another volunteer take over the activity station at 10:30? I would be happy to prepare the craft supplies and a one-page instruction sheet before the event. I can also arrive thirty minutes early to explain the activity to the replacement volunteer. If no one is available, perhaps my registration shift could end at 10:15 after a second person has been trained.\n\nPlease let me know which arrangement works best. I want to make sure both areas are fully covered.\n\nBest,\nNora Patel","benchmarkLevel":"CLB 8"},{"id":"X-T2-005","type":"task2","title":"Elementary School Meal Program","relationship":"resident or employee responding to a survey","tone":"persuasive opinion response","situation":"A school board is choosing a meal program for elementary students.","points":["Option A: Provide a free basic breakfast to every student.","Option B: Provide subsidized lunches only to families who apply."],"checks":["breakfast","lunch","students","families","universal","subsidized"],"rubricHints":{"content":["State one clear choice near the beginning","Develop two distinct reasons with examples","Briefly compare the other option where useful"],"tone":"Write as an informed resident or employee making a persuasive recommendation.","taskFulfillment":["Choose and defend one option","Write 150-200 words","Use connected paragraphs rather than a list"]},"wordTarget":"150-200","timeMinutes":26,"sourceSet":"W5","origin":"codex-original-unofficial-2026-07-28","benchmarkAnswer":"I would provide a free basic breakfast to every elementary student. A targeted lunch program might direct more food to families with low incomes, but requiring an application could prevent some children from receiving help.\n\nA universal breakfast avoids embarrassment and administrative barriers. Children would not be separated according to family income, and parents would not need to submit financial documents. This is important because some eligible families may miss a deadline, have changing circumstances, or hesitate to ask for assistance.\n\nBreakfast can also improve learning for the entire school. Students who arrive hungry often find it difficult to concentrate during morning lessons. A simple meal such as oatmeal, fruit, and milk would give every child a consistent start without requiring an expensive menu.\n\nThe board could control costs by purchasing basic ingredients in bulk and inviting community partners to support the program. Families who do not need breakfast would not be required to participate, but the service would remain open to everyone. A universal program would be easier to administer, less stigmatizing, and more reliable for children who need it most.","benchmarkLevel":"CLB 8"},{"id":"X-T1-006","type":"task1","title":"Damaged Appliance Delivery","relationship":"customer to online store","tone":"polite formal complaint","situation":"An expensive kitchen appliance arrived with damaged packaging and a cracked part. The online store says the damage must have occurred after delivery. Write an email to customer service. In your email:","points":["describe the condition of the parcel when it arrived","explain the evidence you have","state how you want the company to resolve the problem"],"checks":["parcel","damaged","cracked","evidence","delivery","resolve"],"rubricHints":{"content":["State the purpose clearly in the opening paragraph","Address all three bullet points with specific details","Make the requested solution or next step unambiguous"],"tone":"Match the relationship and purpose. Be polite, clear, and appropriately firm.","taskFulfillment":["Use email format with a greeting and closing","Write 150-200 words","Cover every instruction in the prompt"]},"wordTarget":"150-200","timeMinutes":27,"sourceSet":"W6","origin":"codex-original-unofficial-2026-07-28","benchmarkAnswer":"Subject: Damaged Mixer Delivered — Order 58419\n\nDear Customer Service Team,\n\nI am writing about the stand mixer delivered to my home on July 21. When the courier arrived, one corner of the shipping box was crushed and the sealing tape was partly open. After unpacking the appliance, I found a large crack in the mixer’s base.\n\nThe damage was present immediately after delivery. I took several photographs before removing the mixer from its protective wrapping, including images of the crushed box, the shipping label, and the cracked part. My building’s security camera also recorded the parcel being carried into the lobby in that condition. The appliance has not been used.\n\nI cannot accept the suggestion that the damage occurred after delivery. Please arrange a prepaid return and send a new, undamaged mixer within seven business days. If that model is no longer available, I would like a full refund to my original payment method. I should not be charged return shipping or a restocking fee.\n\nI have attached the photographs and order confirmation. Please reply with a return label and confirm how the replacement or refund will be handled.\n\nSincerely,\nChris Bell","benchmarkLevel":"CLB 8"},{"id":"X-T2-006","type":"task2","title":"Use of an Unused Community Room","relationship":"resident or employee responding to a survey","tone":"persuasive opinion response","situation":"Your community centre has one unused room.","points":["Option A: Turn it into a small fitness room.","Option B: Turn it into a quiet study and co-working room."],"checks":["fitness","study","community","room","residents","benefit"],"rubricHints":{"content":["State one clear choice near the beginning","Develop two distinct reasons with examples","Briefly compare the other option where useful"],"tone":"Write as an informed resident or employee making a persuasive recommendation.","taskFulfillment":["Choose and defend one option","Write 150-200 words","Use connected paragraphs rather than a list"]},"wordTarget":"150-200","timeMinutes":26,"sourceSet":"W6","origin":"codex-original-unofficial-2026-07-28","benchmarkAnswer":"I would convert the unused room into a quiet study and co-working space. A small fitness room would be useful, but the centre already offers exercise classes in its gymnasium and several private gyms operate nearby.\n\nA study room would fill a more obvious gap. High school and college students need a quiet place to work after class, especially if their homes are crowded. Job seekers and remote workers could also use the room for online interviews, short meetings, or tasks requiring reliable internet.\n\nThe project would be relatively inexpensive. The centre would mainly need desks, comfortable chairs, power outlets, and improved Wi-Fi. In contrast, a fitness room would require specialized equipment, regular maintenance, safety inspections, and additional insurance. Those continuing costs could limit access or force the centre to charge a high fee.\n\nThe room could remain flexible by using movable furniture. During quiet hours it would support study and work, while occasional workshops could be scheduled when demand is lower. This option would serve several age groups, duplicate fewer existing services, and make practical use of the centre’s limited budget.","benchmarkLevel":"CLB 8"},{"id":"X-T1-007","type":"task1","title":"Unsafe Sidewalk Snow Clearing","relationship":"resident to municipal service department","tone":"polite civic complaint","situation":"The sidewalk near your home has repeatedly remained covered in snow and ice for several days after storms. It is used by seniors and children walking to school. Write an email to the municipal service department. In your email:","points":["identify the location and ongoing problem","explain the safety impact","recommend an improvement to the clearing schedule"],"checks":["sidewalk","snow","ice","safety","seniors","schedule"],"rubricHints":{"content":["State the purpose clearly in the opening paragraph","Address all three bullet points with specific details","Make the requested solution or next step unambiguous"],"tone":"Match the relationship and purpose. Be polite, clear, and appropriately firm.","taskFulfillment":["Use email format with a greeting and closing","Write 150-200 words","Cover every instruction in the prompt"]},"wordTarget":"150-200","timeMinutes":27,"sourceSet":"W7","origin":"codex-original-unofficial-2026-07-28","benchmarkAnswer":"Subject: Repeated Ice Hazard on Cedar Avenue\n\nDear Municipal Services Team,\n\nI am writing about the sidewalk on the north side of Cedar Avenue between Pine Street and the elementary school. After each of the last three snowfalls, this section remained covered with packed snow and ice for two or three days, even though nearby streets had already been cleared.\n\nThe delay creates a serious safety risk. Many children use the route when walking to school, and several residents of the seniors’ building cross there to reach the bus stop. Last Tuesday, I saw an older pedestrian slip near the corner. Wheelchair users and parents with strollers are often forced onto the road because the sidewalk is impassable.\n\nPlease add this block to the priority clearing route and inspect it within twelve hours after a storm. It may also require more salt or sand because water collects and refreezes near the bus stop. A simple service-status notice online would help residents know when the route is expected to be safe.\n\nCould you confirm whether the location will be inspected before the next snowfall?\n\nSincerely,\nMorgan Ellis","benchmarkLevel":"CLB 8"},{"id":"X-T2-007","type":"task2","title":"Mandatory Staff Training Format","relationship":"resident or employee responding to a survey","tone":"persuasive opinion response","situation":"Your employer is planning mandatory professional training.","points":["Option A: One full-day in-person workshop.","Option B: Four one-hour online sessions over two weeks."],"checks":["training","workshop","online","employees","schedule","learning"],"rubricHints":{"content":["State one clear choice near the beginning","Develop two distinct reasons with examples","Briefly compare the other option where useful"],"tone":"Write as an informed resident or employee making a persuasive recommendation.","taskFulfillment":["Choose and defend one option","Write 150-200 words","Use connected paragraphs rather than a list"]},"wordTarget":"150-200","timeMinutes":26,"sourceSet":"W7","origin":"codex-original-unofficial-2026-07-28","benchmarkAnswer":"I would deliver the mandatory training through four one-hour online sessions. A full-day workshop may be easier to schedule once, but shorter sessions would make the material easier to absorb and apply.\n\nEmployees often lose concentration during a long presentation, particularly when several complex topics are covered in one day. Weekly online sessions would allow participants to focus on one skill at a time and practise it before the next lesson. For example, staff could complete the communication module, use the method with a customer, and discuss the result during the following session.\n\nThe online format would also reduce disruption. Departments could choose from two available times for each module, maintaining customer coverage without closing operations for an entire day. Employees working remotely or at another location would not need to travel.\n\nTo keep the sessions interactive, the trainer could use short case studies, polls, and small-group discussions. Attendance and completion could still be tracked electronically. Spreading the course over two weeks would therefore support better learning, provide scheduling flexibility, and cost the organization less in travel and lost working time.","benchmarkLevel":"CLB 8"},{"id":"X-T1-008","type":"task1","title":"Double-Booked Restaurant Room","relationship":"customer to restaurant manager","tone":"polite but firm complaint","situation":"You reserved a private room at a restaurant for a family celebration. A week before the event, the restaurant informed you that the room was double-booked and offered tables in the main dining area. Write an email to the restaurant manager. In your email:","points":["explain why the main dining area is unsuitable","describe the arrangements you have already made","request a satisfactory alternative"],"checks":["reservation","double-booked","celebration","arrangements","unsuitable","alternative"],"rubricHints":{"content":["State the purpose clearly in the opening paragraph","Address all three bullet points with specific details","Make the requested solution or next step unambiguous"],"tone":"Matc

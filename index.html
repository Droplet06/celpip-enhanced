h the relationship and purpose. Be polite, clear, and appropriately firm.","taskFulfillment":["Use email format with a greeting and closing","Write 150-200 words","Cover every instruction in the prompt"]},"wordTarget":"150-200","timeMinutes":27,"sourceSet":"W8","origin":"codex-original-unofficial-2026-07-28","benchmarkAnswer":"Subject: Request for Suitable Alternative to Private Room Booking\n\nDear Restaurant Manager,\n\nI am writing about my reservation for a private room on August 3 for my parents’ fortieth anniversary. Yesterday, I was informed that the room had been double-booked and that our group could instead use several tables in the main dining area.\n\nThe proposed arrangement is not suitable. Our party includes eighteen relatives, two of whom use hearing aids and would struggle to follow conversation in a noisy dining room. We also planned to show a short family video and make several speeches, which would disturb other customers in the shared space.\n\nInvitations have already been sent, a cake has been ordered for delivery to your restaurant, and three relatives have booked hotels nearby. Cancelling the event at this stage would be extremely difficult.\n\nPlease offer us another private room at your restaurant or arrange an equivalent private space at a nearby partner location for the same price. If neither option is possible, I request a full refund and reimbursement of the non-refundable cake delivery fee.\n\nI would appreciate confirmation within two days so our family can finalize its plans.\n\nSincerely,\nJamie Park","benchmarkLevel":"CLB 8"},{"id":"X-T2-008","type":"task2","title":"Household Waste Reduction","relationship":"resident or employee responding to a survey","tone":"persuasive opinion response","situation":"Your municipality wants to reduce household waste.","points":["Option A: Collect garbage every two weeks and recycling every week.","Option B: Keep weekly garbage collection but introduce smaller garbage bins."],"checks":["garbage","recycling","collection","bins","waste","households"],"rubricHints":{"content":["State one clear choice near the beginning","Develop two distinct reasons with examples","Briefly compare the other option where useful"],"tone":"Write as an informed resident or employee making a persuasive recommendation.","taskFulfillment":["Choose and defend one option","Write 150-200 words","Use connected paragraphs rather than a list"]},"wordTarget":"150-200","timeMinutes":26,"sourceSet":"W8","origin":"codex-original-unofficial-2026-07-28","benchmarkAnswer":"I would keep weekly garbage collection but introduce smaller bins. Collecting garbage every two weeks might reduce municipal trips, but it could create sanitation problems without necessarily changing what households purchase or discard.\n\nA smaller bin gives residents a clear weekly limit while preserving regular collection. Families would have an incentive to separate recycling and food scraps because unnecessary garbage would quickly use the available space. The municipality could support the change by providing clear sorting guides and larger recycling containers at no additional cost.\n\nWeekly pickup is particularly important during warm weather. Food packaging, diapers, and pet waste can produce odours and attract pests when stored for fourteen days. This would be difficult for apartment residents or households without a secure garage.\n\nThe city could offer temporary extra-garbage tags for unusual situations, such as moving or caring for a sick family member. It should also provide larger bins to households that demonstrate a genuine medical need. Smaller standard bins, combined with these limited exceptions, would encourage waste reduction without sacrificing cleanliness. This approach is more practical and flexible than cutting collection frequency for every resident.","benchmarkLevel":"CLB 8"}];

async function supaFetch(path, opts, withAuth){
  opts = opts || {};
  const h = Object.assign({'apikey':SUPA_KEY, 'Content-Type':'application/json'}, opts.headers||{});
  if(withAuth !== false && AUTH) h.Authorization = 'Bearer ' + AUTH.access_token;
  return fetch(SUPA_URL + path, Object.assign({}, opts, {headers:h}));
}

async function authGo(kind, email, password){
  const path = kind==='signup' ? '/auth/v1/signup' : '/auth/v1/token?grant_type=password';
  const r = await supaFetch(path, {method:'POST', body:JSON.stringify({email, password})}, false);
  const j = await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(j.error_description || j.msg || j.message || ('HTTP '+r.status));
  if(!j.access_token) throw new Error('服务器没返回 token —— Supabase 后台的「Confirm email」可能还开着');
  setAuth({ access_token:j.access_token, refresh_token:j.refresh_token,
            expires_at: Date.now() + (j.expires_in||3600)*1000,
            user_id:j.user.id, email:j.user.email });
}

async function ensureToken(){
  if(!AUTH) return false;
  if(Date.now() < AUTH.expires_at - 60000) return true;
  const r = await supaFetch('/auth/v1/token?grant_type=refresh_token',
    {method:'POST', body:JSON.stringify({refresh_token:AUTH.refresh_token})}, false);
  if(!r.ok){ setAuth(null); throw new Error('登录已过期，请重新登录'); }
  const j = await r.json();
  setAuth(Object.assign({}, AUTH, {
    access_token:j.access_token,
    refresh_token:j.refresh_token || AUTH.refresh_token,
    expires_at: Date.now() + (j.expires_in||3600)*1000 }));
  return true;
}

/* ── 字段级合并 ──
   不能用 last-write-wins：手机练完半小时，电脑一开旧存档就把你覆盖了。
   状态几乎全是单调增长的，所以逐字段取「更进一步」的那份，且幂等
   （同一份数据重复同步不会把计数翻倍）。 */
function mergeWord(a, b){
  if(!a) return b; if(!b) return a;
  return { lvl:  Math.max(a.lvl||0,   b.lvl||0),
           seen: Math.max(a.seen||0,  b.seen||0),
           wrong:Math.max(a.wrong||0, b.wrong||0) };
}

function mergeState(loc, rem){
  if(!rem) return loc;
  if(!loc) return rem;
  const out = Object.assign({}, rem, loc);          // 本地为底，远端补缺字段
  const mx = k => Math.max(loc[k]||0, rem[k]||0);

  out.xp = mx('xp'); out.introPtr = mx('introPtr');
  out.readPtr = mx('readPtr'); out.wrPtr = mx('wrPtr');

  // 顺序数组一旦生成就锁定 —— 两边不一致会让出词/出题顺序整个错乱
  out.introOrder = loc.introOrder || rem.introOrder || null;
  out.readOrder  = loc.readOrder  || rem.readOrder  || null;
  out.wrOrder    = loc.wrOrder    || rem.wrOrder    || null;

  out.words = {};
  new Set([...Object.keys(loc.words||{}), ...Object.keys(rem.words||{})])
    .forEach(id => { out.words[id] = mergeWord((loc.words||{})[id], (rem.words||{})[id]); });

  out.readLog = Object.assign({}, rem.readLog||{}, loc.readLog||{});
  out.wrLog   = Object.assign({}, rem.wrLog||{},   loc.wrLog||{});

  // 连击：以「最后达标日」更晚的一方为准，不取 max（否则断掉的连击会被复活）
  const la = loc.lastGoalDay||'', lr = rem.lastGoalDay||'';
  if(lr > la){ out.lastGoalDay = rem.lastGoalDay; out.streak = rem.streak||0; }
  else if(la > lr){ out.lastGoalDay = loc.lastGoalDay; out.streak = loc.streak||0; }
  else { out.lastGoalDay = loc.lastGoalDay||null; out.streak = Math.max(loc.streak||0, rem.streak||0); }

  // 当天进度：同一天取大，跨天以更晚那天为准
  const da = loc.day||'', dr = rem.day||'';
  if(da === dr){ out.day = da; out.dailyDone = mx('dailyDone'); }
  else if(dr > da){ out.day = rem.day; out.dailyDone = rem.dailyDone||0; }
  else { out.day = loc.day; out.dailyDone = loc.dailyDone||0; }

  // 未提交的写作草稿：先比日期，同日取写得更久的那份
  const ca = loc.wrCur, cr = rem.wrCur;
  if(!ca) out.wrCur = cr || null;
  else if(!cr) out.wrCur = ca;
  else if((cr.day||'') > (ca.day||'')) out.wrCur = cr;
  else if((ca.day||'') > (cr.day||'')) out.wrCur = ca;
  else out.wrCur = (cr.usedMs||0) > (ca.usedMs||0) ? cr : ca;

  // 本机偏好不被远端覆盖
  out.muted = loc.muted; out.sfx = loc.sfx || rem.sfx;
  return out;
}

  const r = await supaFetch('/rest/v1/wordrush_state?user_id=eq.'+AUTH.user_id+'&select=state,rev');

  return (await r.json())[0] || null;
}

async function pushRemote(state){
  const r = await supaFetch('/rest/v1/wordrush_state?on_conflict=user_id', {
    method:'POST',
    headers:{'Prefer':'resolution=merge-duplicates,return=representation'},
    body: JSON.stringify({ user_id:AUTH.user_id, state })
  });
  if(!r.ok) throw new Error('上传失败 HTTP '+r.status+' '+(await r.text()).slice(0,140));
  return (await r.json().catch(()=>[]))[0] || null;
}

async function syncNow(){
  if(!cloudReady() || syncing) return;
  syncing = true; setSync('syncing');
  try{
    await ensureToken();
    const rem = await pullRemote();
    const before = JSON.stringify(S);
    S = mergeState(S, rem ? rem.state : null);
    localStorage.setItem(LS_KEY, JSON.stringify(S));
    await pushRemote(S);
    syncDirty = false; lastSyncAt = Date.now();
    setSync('ok');
    if(JSON.stringify(S) !== before){ rebuildDeck(); updateHUD(); updateReadBtn(); }
  }catch(e){
    syncDirty = true;
    setSync(navigator.onLine ? 'err' : 'offline', e.message);
  }finally{ syncing = false; }
}

/* save() 调用它：本地立刻落盘，云端防抖 3 秒再推 */
function syncQueue(){
  if(!cloudReady()) return;
  syncDirty = true;
  if(syncStatus !== 'syncing') setSync('pending');
  clearTimeout(syncTimer);
  syncTimer = setTimeout(syncNow, SYNC_WAIT);
}

/* 离线转在线、切回前台、关页面前：补推 */
addEventListener('online', () => { if(syncDirty) syncNow(); });
addEventListener('visibilitychange', () => { if(document.visibilityState==='visible' && cloudReady()) syncNow(); });
addEventListener('pagehide', () => {
  if(!cloudReady() || !syncDirty) return;
  // 用 fetch keepalive 而不是 sendBeacon：beacon 无法带 Authorization 头，
  // 而 RLS 认的是用户 JWT，光有 apikey 会被策略挡掉。
  fetch(SUPA_URL+'/rest/v1/wordrush_state?on_conflict=user_id', {
    method:'POST', keepalive:true,
    headers:{ 'apikey':SUPA_KEY, 'Authorization':'Bearer '+AUTH.access_token,
              'Content-Type':'application/json', 'Prefer':'resolution=merge-duplicates' },
    body: JSON.stringify({ user_id:AUTH.user_id, state:S })
  }).catch(()=>{});
});

// 每日滚动 + 连击维护
(function rollover(){
  const t = today();
  if(!S.introOrder){ S.introOrder = shuffle(VOCAB.map(v=>v.id)); }
  if(!S.sfx) S.sfx = 'arcade';   // 旧存档补上音效风格
  if(!S.wrLog) S.wrLog = {};     // 旧存档补上写作字段
  if(S.wrPtr === undefined) S.wrPtr = 0;
  if(S.wrCur === undefined) S.wrCur = null;
  if(S.day !== t){
    // 判断连击是否中断：上次达标日必须是「昨天」才续；否则清零
    const y = new Date(Date.now()-864e5).toLocaleDateString('en-CA');
    if(S.lastGoalDay !== t && S.lastGoalDay !== y) S.streak = 0;
    S.day = t; S.dailyDone = 0;
  } else {
    const y = new Date(Date.now()-864e5).toLocaleDateString('en-CA');
    if(S.lastGoalDay && S.lastGoalDay !== t && S.lastGoalDay !== y) S.streak = 0;
  }
  save();
})();

/* ═══════════════ 工具 ═══════════════ */
function shuffle(a){ a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function rint(n){ return Math.floor(Math.random()*n); }
function requeue(id,pos){ pos=Math.max(0,Math.min(pos,deck.length)); deck.splice(pos,0,id); }

/* ═══════════════ 音效（WebAudio）═══════════════ */
let AC=null, MASTER=null;
function ac(){
  if(!AC){ const C=window.AudioContext||window.webkitAudioContext;
    if(C){ AC=new C(); MASTER=AC.createGain(); MASTER.gain.value=1; MASTER.connect(AC.destination); } }
  return AC;
}
/* 可用的 audio context；静音返回 null，被系统挂起时先唤醒（防"吞音"）*/
function actx(){ const c=ac(); if(!c||S.muted) return null; if(c.state!=='running') c.resume(); return c; }
const st=n=>Math.pow(2,n/12);   // 半音数 → 频率倍数

/* 单音：极快起音 + 指数衰减（拨弦/铃声质感），可选低通扫频、失谐 */
function pluck(freq,{dur=.35,type='triangle',vol=.14,delay=0,detune=0,cut=0}={}){
  const c=actx(); if(!c) return;
  const t=c.currentTime+delay, o=c.createOscillator(), g=c.createGain();
  o.type=type; o.frequency.setValueAtTime(freq,t); if(detune) o.detune.setValueAtTime(detune,t);
  g.gain.setValueAtTime(.0001,t);
  g.gain.exponentialRampToValueAtTime(vol,t+.008);
  g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);
  let out=g;
  if(cut){ const f=c.createBiquadFilter(); f.type='lowpass'; f.Q.value=4;
    f.frequency.setValueAtTime(Math.min(16000,cut*3),t);
    f.frequency.exponentialRampToValueAtTime(Math.max(120,cut),t+dur*.6);
    g.connect(f); out=f; }
  out.connect(MASTER); o.start(t); o.stop(t+dur+.03);
}
/* 低频"砰"：下潜正弦，给音效底气 */
function thump({vol=.22,delay=0,f0=180,f1=55,dur=.17}={}){
  const c=actx(); if(!c) return;
  const t=c.currentTime+delay, o=c.createOscillator(), g=c.createGain();
  o.type='sine'; o.frequency.setValueAtTime(f0,t); o.frequency.exponentialRampToValueAtTime(f1,t+dur);
  g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+.008);
  g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g); g.connect(MASTER); o.start(t); o.stop(t+dur+.02);
}
/* 极短噪声：起音的"咔"，冲击力来源 */
function noise(dur=.04,{vol=.05,delay=0,hp=1500}={}){
  const c=actx(); if(!c) return;
  const n=Math.max(1,Math.floor(c.sampleRate*dur)), buf=c.createBuffer(1,n,c.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/n,3);
  const s=c.createBufferSource(); s.buffer=buf;
  const f=c.createBiquadFilter(); f.type='highpass'; f.frequency.value=hp;
  const g=c.createGain(); g.gain.value=vol;
  s.connect(f); f.connect(g); g.connect(MASTER); s.start(c.currentTime+delay);
}
/* 铃：基频 + 泛音，明亮通透 */
function bell(f,{dur=.5,vol=.12,delay=0}={}){
  pluck(f,      {dur,        vol,       delay,        type:'triangle'});
  pluck(f*2,    {dur:dur*.6, vol:vol*.35,delay:delay+.004, type:'sine'});
  pluck(f*3.01, {dur:dur*.35,vol:vol*.14,delay:delay+.008, type:'sine'});
}
/* 失谐锯齿和弦音：能量感最强 */
function stab(f,{dur=.45,vol=.1,delay=0}={}){
  [-9,0,9].forEach(d=>pluck(f,{dur,vol:vol*.6,delay,type:'sawtooth',detune:d,cut:f*3.2}));
}

/* ── 答对音效：5 种风格，收集册里可随时切换 ────────────────
   每种都随连击升调（越连越高、越上头）；n = 当前连击数 */

/* ═══════════════ 选项构造 ═══════════════ */
function englishOptions(v){
  // 直接复用词库自带的 4 选项（英文），保证质量
  if(Array.isArray(v.options) && v.options.length>=2 && v.options[v.correct] &&
     v.options[v.correct].toLowerCase()===v.word.toLowerCase()){   // 大小写无关：句首大写的连接词也能用自带干扰项
    return { opts:v.options.slice(), ans:v.correct };
  }
  const pool=shuffle(VOCAB.filter(w=>w.id!==v.id)).slice(0,3).map(w=>w.word);
  const opts=shuffle([v.word,...pool]); return { opts, ans:opts.indexOf(v.word) };
}
function meaningOptions(v){
  const same=shuffle(VOCAB.filter(w=>w.id!==v.id && w.pos===v.pos));
  const any=shuffle(VOCAB.filter(w=>w.id!==v.id));
  const picks=[]; [...same,...any].forEach(w=>{ if(picks.length<3 && w.zh!==v.zh && !picks.includes(w.zh)) picks.push(w.zh); });
  const opts=shuffle([v.zh,...picks]); return { opts, ans:opts.indexOf(v.zh) };
}

/* ═══════════════ 出卡逻辑 ═══════════════ */
function pickMode(v){
  const lvl=S.words[v.id].lvl;
  if(v.tier==='receptive') return 'w2m';   // 仅识别层：只做「词→义」认词，不进主动产出（填空/听音/拼写）
  let modes=['m2w','w2m'];              // 认词：释义↔选词
  if(lvl>=2){ modes.push('blank'); modes.push('produce'); }   // 填空 / 拼写产出
  if(lvl>=3) modes.push('listen');      // 听音
  // 填空与拼写产出都需要句子里有空
  if(!/_{3,}/.test(v.question||'')) modes=modes.filter(m=>m!=='blank'&&m!=='produce');
  return modes[rint(modes.length)];
}
function nextCard(){
  const canIntro = S.introPtr < S.introOrder.length;
  const activeUnmastered = deck.length;
  const wantIntro = canIntro && (deck.length<3 || (cardsSinceIntro>=INTRO_EVERY && activeUnmastered<MAX_ACTIVE));
  if(wantIntro){
    const id=S.introOrder[S.introPtr++];
    if(!BYID.has(id)) return nextCard();   // 旧存档里的失效 id：跳过（introPtr 已前进，不会死循环）
    if(!S.words[id]) S.words[id]={lvl:0,seen:0,wrong:0};
    cardsSinceIntro=0; save();
    requeue(id,2);              // 学完后过 ~2 张卡开始考它
    return renderLearn(BYID.get(id));
  }
  cardsSinceIntro++;
  deck=deck.filter(id=>BYID.has(id));       // 同上：清掉失效 id
  if(deck.length===0) return renderEmpty();
  let id=deck.shift();
  if(id===lastQuizId && deck.length>0){ deck.push(id); id=deck.shift(); }  // 不立刻重复同一个词
  lastQuizId=id;
  const v=BYID.get(id);
  if(!S.words[id]) S.words[id]={lvl:0,seen:0,wrong:0};
  const gold = Math.random()<GOLD_CHANCE;
  renderQuiz(v, pickMode(v), gold);
}

/* ═══════════════ 渲染：测验卡 ═══════════════ */
const MODE_LABEL={ m2w:'选出正确的英文词', w2m:'选出中文意思', blank:'填空', listen:'🔊 听音选词' };
function renderQuiz(v, mode, gold){
  locked=false;
  if(mode==='produce'){   // ✍️ 拼写产出：给填空句+中文，键入英文
    const el=document.getElementById('card');
    el.className='card pop'+(gold?' gold':'');
    el.innerHTML=`
      <div class="mode-tag ${gold?'gold-tag':''}">${gold?'✨ 金色词 x2':'✍️ 拼写产出'}</div>
      <div class="prompt">${v.question.replace(/_+/g,'<span class="blank">＿＿＿</span>')}</div>
      <div class="produce-hint">意思：<b>${v.zh}</b></div>
      <div class="produce-row">
        <input id="prodIn" class="prod-in" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="输入英文，回车提交">
        <button class="btn btn-p" id="prodGo">提交</button>
      </div>
      <div class="feedback" id="fb"></div>`;
    const inp=document.getElementById('prodIn');
    const submit=()=>answerProduce(v, gold, inp.value);
    document.getElementById('prodGo').onclick=submit;
    inp.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); submit(); } });
    setTimeout(()=>inp.focus(), 40);
    return;
  }
  let opts, ans, promptHTML='', listen=false;
  if(mode==='w2m'){ const o=meaningOptions(v); opts=o.opts; ans=o.ans;
    promptHTML=`<div class="big-word">${v.word}</div>${v.ipa?`<div class="ipa">${v.ipa}</div>`:''}`;
  } else if(mode==='blank'){ const o=englishOptions(v); opts=o.opts; ans=o.ans;
    promptHTML=`<div class="prompt">${v.question.replace(/_+/g,'<span class="blank">＿＿＿</span>')}</div>`;
  } else if(mode==='listen'){ const o=englishOptions(v); opts=o.opts; ans=o.ans; listen=true;
    promptHTML=`<div class="listen-hero"><button class="listen-btn" id="lbtn">🔊</button><div class="listen-hint">点击重听，选出你听到的词</div></div>`;
  } else { const o=englishOptions(v); opts=o.opts; ans=o.ans;   // m2w
    promptHTML=`<div class="prompt">哪个词的意思是：<b style="color:var(--gold)">${v.zh}</b>？</div>`;
  }
  const el=document.getElementById('card');
  el.className='card pop'+(gold?' gold':'');
  el.innerHTML=`
    <div class="mode-tag ${gold?'gold-tag':''}">${gold?'✨ 金色词 x2':MODE_LABEL[mode]}</div>
    ${promptHTML}
    <div class="opts" id="opts">${opts.map((o,i)=>`<button class="opt" data-i="${i}"><span class="k">${'ABCD'[i]}</span><span>${o}</span></button>`).join('')}</div>
    <div class="feedback" id="fb"></div>`;
  if(listen){ document.getElementById('lbtn').onclick=()=>speak(v.word); speak(v.word); }
  el.querySelectorAll('.opt').forEach(b=>{
    b.onclick=()=>answer(v, mode, gold, +b.dataset.i, ans, opts);
  });

/* ═══════════════ 答题处理 ═══════════════ */
// 共用的「答对/答错」结算逻辑（选择题与拼写产出模式复用）
function applyCorrect(v, gold, msg){
  const w=S.words[v.id];
  combo++; bestComboSession=Math.max(bestComboSession,combo);
  const mult=Math.floor(combo/5)+1;
  const xp=10*mult*(gold?2:1);
  addXP(xp); floatXP(xp, gold);
  S.dailyDone++;
  w.lvl=Math.min(4,(w.lvl||0)+1);
  if(w.lvl<4) requeue(v.id, Math.min(deck.length, 4+w.lvl*3));  // 等级越高，隔越久
  if(gold){ goldSound(); confetti(30); } else dingCombo(combo);
  showCombo();
  const fb=document.getElementById('fb');
  fb.className='feedback ok'; fb.innerHTML=(msg?msg+'　':'')+(gold?`✨ +${xp} XP！`:`✓ +${xp} XP`);
  save(); updateHUD(); checkGoal();
  scheduleAdvance(620);
}
// 答对后自动翻页：被奖励弹层挡住时不丢，记成「待翻页」，回到练习页时补上
function scheduleAdvance(ms){
  clearTimeout(advTimer); pendingAdvance=true;
  advTimer=setTimeout(()=>{
    advTimer=null;
    if(document.getElementById('overlay').classList.contains('show')) return;   // 保留 pendingAdvance
    advance();
  }, ms);
}
function applyWrong(v, fbHTML){
  const w=S.words[v.id];
  document.getElementById('card').classList.add('shake');
  combo=0; showCombo(); buzzWrong();
  w.wrong=(w.wrong||0)+1; w.lvl=Math.max(0,(w.lvl||1)-1);
  requeue(v.id, 2);   // 很快再考一次
  const fb=document.getElementById('fb');
  fb.className='feedback no'; fb.innerHTML=fbHTML;
  save(); updateHUD();
  if(!document.getElementById('contBtn')){   // 答错需手动继续（看清答案）
    const b=document.createElement('button'); b.className='btn btn-g'; b.id='contBtn'; b.textContent='继续 →'; b.onclick=advance;
    document.getElementById('card').appendChild(b);
  }
}
function answer(v, mode, gold, chosen, ans, opts){
  if(locked) return; locked=true;
  const w=S.words[v.id]; w.seen=(w.seen||0)+1;
  const btns=document.querySelectorAll('.opt'); btns.forEach(b=>b.disabled=true);
  try{
    if(chosen===ans){
      btns[chosen].classList.add('correct');
      applyCorrect(v, gold);
    } else {
      btns[chosen].classList.add('wrong'); btns[ans].classList.add('correct');
      applyWrong(v, `正确答案：${'ABCD'[ans]}. <b>${v.word}</b><div class="fb-mean">${v.zh}</div>`);
    }
  }catch(err){ console.error(err); scheduleAdvance(900); }   // 结算出错也要能翻页，别卡死
}

// 拼写产出：无选项，键入英文。允许 1 个字母的拼写差（算对但提示正确拼写）。
function normAns(s){ return (s||'').toLowerCase().trim().replace(/\s+/g,' ').replace(/[.!?,;:"'’]+$/,''); }
function editDist(a,b){
  const m=a.length,n=b.length,d=Array.from({length:m+1},(_,i)=>[i,...Array(n).fill(0)]);
  for(let j=0;j<=n;j++) d[0][j]=j;
  for(let i=1;i<=m;i++) for(let j=1;j<=n;j++)
    d[i][j]=Math.min(d[i-1][j]+1, d[i][j-1]+1, d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
  return d[m][n];
}
function answerProduce(v, gold, raw){
  if(locked) return;
  const guess=normAns(raw); if(!guess) return;   // 空提交忽略
  locked=true;
  const w=S.words[v.id]; w.seen=(w.seen||0)+1;
  const inp=document.getElementById('prodIn'); if(inp) inp.disabled=true;
  const go=document.getElementById('prodGo'); if(go) go.disabled=true;
  const target=normAns(v.word);
  if(guess===target){
    speak(v.word); applyCorrect(v, gold, '✓ 拼写正确！');
  } else if(target.length>=4 && editDist(guess,target)<=1){
    speak(v.word); applyCorrect(v, gold, `差一点 → 正确拼写 <b>${v.word}</b>`);
  } else {
    applyWrong(v, `正确答案：<b>${v.word}</b><div class="fb-mean">${v.zh}</div><div class="fb-mean" style="opacity:.7">你输入：${raw||'（空）'}</div>`);
  }
}

function advance(){
  clearTimeout(advTimer); advTimer=null; pendingAdvance=false; locked=false;
  // 出卡万一报错也别把卡片卡死：退回「再来一轮」，用户点一下就能继续
  try{ nextCard(); }catch(err){ console.error(err); rebuildDeck(); renderEmpty(); }

function todayReading(){

function readDoneToday(){ return !!(S.readToday && S.readToday.day===today() && S.readToday.done); }
function updateReadBtn(){
  const b=document.getElementById('btnRead');

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
// 词形还原：notified→notify、accommodating→accommodate，让变形词也能点开
function baseForm(w){
  if(GLOSS.has(w)) return w;
  const cand=[];
  if(/ies$/.test(w)) cand.push(w.slice(0,-3)+'y');
  if(/ied$/.test(w)) cand.push(w.slice(0,-3)+'y');
  if(/(es|ed)$/.test(w)) cand.push(w.slice(0,-2), w.slice(0,-1));
  if(/s$/.test(w)) cand.push(w.slice(0,-1));
  if(/ing$/.test(w)) cand.push(w.slice(0,-3), w.slice(0,-3)+'e');
  if(/ly$/.test(w)) cand.push(w.slice(0,-2));
  if(/(ment|tion|ance|ence|ity|ness)$/.test(w)) cand.push(w.replace(/(ment|tion|ance|ence|ity|ness)$/,''));
  // 双写辅音：planned→plan、running→run
  const m=w.match(/^(.*?)([bdfglmnprt])\2(ed|ing)$/); if(m) cand.push(m[1]+m[2]);
  for(const c of cand) if(c.length>2 && GLOSS.has(c)) return c;
  return null;
}
// 正文里把词库里的词标成可点的虚线词
function markWords(s){
  return esc(s).replace(/[A-Za-z]+/g, m => {
    const b=baseForm(m.toLowerCase());
    return b ? `<span class="vw" data-w="${b}">${m}</span>` : m;
  });
}
function paras(text){ return text.split(/\n{2,}|\n/).filter(x=>x.trim()).map(p=>`<p>${markWords(p)}</p>`).join(''); }

function passageHTML(r){
  if(r.part===2){
    const heads=r.tableHeaders||[];   // 表头可缺省：部分表格各列语义不齐，硬编表头反而误导
    return `<table class="rd-table">
      ${heads.length?`<tr>${heads.map(h=>`<th>${esc(h)}</th>`).join('')}</tr>`:''}
      ${(r.tableRows||[]).map(row=>`<tr>${row.map(c=>`<td>${markWords(c)}</td>`).join('')}</tr>`).join('')}
    </table>${(r.notes||[]).map(n=>`<div class="rd-note">※ ${markWords(n)}</div>`).join('')}`;
  }
  if(r.part===4){
    return `${r.intro?paras(r.intro):''}
      ${(r.comments||[]).map(c=>`<div class="rd-cmt"><div class="nm">${esc(c.name)}</div>${paras(c.text)}</div>`).join('')}`;
  }
  return paras(r.text||'');
}

}

/* ═══════════════ 写作训练 ═══════════════ */
/* 说明：本模块是「练习台」——抽题、限时、字数、草稿、自评、范文对照。
   四维打分是**自评**，不是自动判分：离线环境没有评分模型，真正的批改仍由 Claude 做，
   所以提交后提供「复制给 Claude 批改」。范文在提交前锁定，避免形成背模板依赖。 */
let wrTick=null;

function wcount(s){ return (String(s||'').trim().match(/\S+/g)||[]).length; }
function wrLimitMs(it){ return (it.timeMinutes || WR_MIN[it.type] || 27) * 60000; }
function wrUsed(c){ return (c.usedMs||0) + (c.resumedAt ? Date.now()-c.resumedAt : 0); }
function mmss(ms){ const s=Math.max(0,Math.round(ms/1000)); return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); }

// 抽题：按类型洗牌轮转，一轮走完再洗，避免重复撞题
function pickWriting(type){
  if(!S.wrOrder || !S.wrOrder.length) { S.wrOrder = shuffle(WRITING.map(w=>w.id)); S.wrPtr = 0; }
  const n = S.wrOrder.length;
  for(let i=0;i<n;i++){
    const id = S.wrOrder[(S.wrPtr + i) % n];
    const it = WBYID.get(id);
    if(it && (!type || it.type===type)){ S.wrPtr = (S.wrPtr + i + 1) % n; if(S.wrPtr===0) S.wrOrder = shuffle(S.wrOrder); save(); return it; }
  }
  return WRITING.find(w=>!type||w.type===type) || WRITING[0];
}

  showView('write');
  if(S.wrCur && !S.wrCur.submitted) renderWrDesk();

function wrLeave(){                                  // 离开写作台：计时暂停并落盘

  document.getElementById('wrBody').innerHTML=`
    <div class="wr-box">
      <div class="wr-lbl">${isT1?'情境':'话题'}</div>
      <div class="wr-sit">${esc(it.situation)}</div>
      <div class="wr-lbl" style="margin-top:12px">${isT1?'必须写到的 3 点':'二选一'}</div>
      <ul class="wr-pts">${it.points.map(p=>`<li>${esc(p)}</li>`).join('')}</ul>
      <div class="wr-meta">
        ${it.relationship?`<span class="wr-tag">对象：${esc(it.relationship)}</span>`:''}
        ${it.tone?`<span class="wr-tag">语气：${esc(it.tone)}</span>`:''}
        <span class="wr-tag">${WR_LO}–${WR_HI} 词</span>
      </div>
    </div>
    <div class="wr-bar">
      <div class="wr-timer" id="wrTimer">--:--</div>
      <div class="wr-wc" id="wrWc">0 词</div>
    </div>
    <textarea class="wr-ta" id="wrTa" placeholder="${isT1?'Subject: ...\n\nDear ...,':'在这里写你的观点...'}" spellcheck="true"></textarea>
    <div class="wr-save" id="wrSave"></div>
    <button class="btn btn-p wr-go" id="wrSubmit">提交并批改 →</button>
    <button class="btn btn-g" id="wrGiveUp">换一题（丢弃这篇）</button>`;

  const ta=document.getElementById('wrTa');
  ta.value = c.draft || '';
  c.resumedAt = Date.now(); save();
  updateWrCount();

  let deb=null;
  ta.addEventListener('input',()=>{
    updateWrCount();
    clearTimeout(deb);
    deb=setTimeout(()=>{
      S.wrCur.draft = ta.value; save();
      document.getElementById('wrSave').textContent = '已自动保存 · ' + new Date().toLocaleTimeString('zh-CN',{hour12:false});
    }, 700);
  });
  document.getElementById('wrSubmit').onclick=()=>{
    S.wrCur.draft = ta.value;
    const n = wcount(ta.value);
    if(n < 60){ alert('还太短（'+n+' 词），先写完再提交。'); return; }
    if(n < WR_LO && !confirm('只有 '+n+' 词，低于 '+WR_LO+' 词下限。真实考试会因此扣分。仍然提交吗？')) return;
    submitWriting();
  };
  document.getElementById('wrGiveUp').onclick=()=>{
    if(!confirm('丢弃这篇草稿，重新抽题？')) return;
    wrLeave(); S.wrCur=null; save(); renderWrPick();
  };

  if(wrTick) clearInterval(wrTick);
  wrTick = setInterval(tickWr, 1000);
  tickWr();
}

function tickWr(){
  const c=S.wrCur; if(!c || c.submitted){ if(wrTick){clearInterval(wrTick);wrTick=null;} return; }
  const el=document.getElementById('wrTimer'); if(!el) return;
  const left = wrLimitMs(WBYID.get(c.id)) - wrUsed(c);
  el.textContent = mmss(left);
  el.className = 'wr-timer' + (left<=60000?' crit' : left<=5*60000?' warn':'');
  if(left<=0){
    const ta=document.getElementById('wrTa'); if(ta) S.wrCur.draft = ta.value;
    clearInterval(wrTick); wrTick=null;
    if(wcount(S.wrCur.draft) < 20){ alert('时间到了，但内容太少，这篇不计入记录。'); wrLeave(); S.wrCur=null; save(); return renderWrPick(); }
    alert('⏰ 时间到——按真实考试规则自动交卷。');
    submitWriting();
  }
}

function updateWrCount(){
  const ta=document.getElementById('wrTa'), el=document.getElementById('wrWc');
  if(!ta||!el) return;
  const n=wcount(ta.value);
  el.textContent = n + ' 词';
  el.className = 'wr-wc ' + (n<WR_LO?'under' : n<=WR_HI?'ok':'over');
  if(n>WR_HI) el.textContent = n + ' 词 · 超出 ' + (n-WR_HI);
}

/* ── 提交 ── */
function submitWriting(){
  const c=S.wrCur;
  c.usedMs = wrUsed(c); c.resumedAt=null;
  c.submitted = true; c.submittedAt = Date.now(); c.day = today();
  S.wrLog[c.id] = { day:c.day, words:wcount(c.draft), usedMs:c.usedMs };
  addXP(WRITE_XP); save(); updateHUD(); chordUp(); confetti(40);
  renderWrReview();
}

/* ── 批改页 ── */
function renderWrReview(){
  const c=S.wrCur, it=WBYID.get(c.id);
  if(!it){ S.wrCur=null; save(); return renderWrPick(); }
  const n=wcount(c.draft), limit=wrLimitMs(it);
  const hit = (it.checks||[]).filter(k=>new RegExp('\\b'+k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'i').test(c.draft));
  const miss = (it.checks||[]).filter(k=>!hit.includes(k));
  const row=(ok,txt)=>`<div class="wr-arow"><span class="ic">${ok?'✅':'⚠️'}</span><span>${txt}</span></div>`;

  document.getElementById('wrTitle').textContent = '📋 批改 · ' + (it.type==='task1'?'Task 1':'Task 2');
  document.getElementById('wrBody').innerHTML=`
    <div class="wr-box">
      <div class="wr-lbl">客观检查（自动）</div>
      <div class="wr-auto">
        ${row(n>=WR_LO&&n<=WR_HI, `字数 ${n} 词${n<WR_LO?`（少 ${WR_LO-n} 词）`:n>WR_HI?`（多 ${n-WR_HI} 词）`:'（达标）'}`)}
        ${row(c.usedMs<=limit, `用时 ${mmss(c.usedMs)} / 限时 ${mmss(limit)}`)}
        ${row(miss.length===0, `要点词覆盖 ${hit.length}/${(it.checks||[]).length}${miss.length?`　未出现：${miss.map(esc).join('、')}`:''}`)}
      </div>
    </div>

    <div class="wr-box">
      <div class="wr-lbl">四维自评（CELPIP 官方维度，各 0–12）</div>
      <div id="wrDims"></div>
      <div class="wr-total" id="wrTotal"></div>
      <div class="wr-lbl">评分提示</div>
      <div class="wr-hint">
        <b>内容：</b><ul>${(it.rubricHints?.content||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul>
        ${it.rubricHints?.tone?`<div style="margin-top:8px"><b>语气：</b>${esc(it.rubricHints.tone)}</div>`:''}
        <div style="margin-top:8px"><b>任务完成：</b><ul>${(it.rubricHints?.taskFulfillment||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>
      </div>
    </div>

    <div class="wr-box">
      <div class="wr-lbl">你的原文 ↔ 修改稿</div>
      <div class="wr-cmp">
        <div class="wr-cmp-col"><div class="wr-lbl">原文（${n} 词）</div><div class="wr-cmp-txt">${esc(c.draft)}</div></div>
        <div class="wr-cmp-col"><div class="wr-lbl">修改稿 <span id="wrRevWc"></span></div>
          <textarea class="wr-ta" id="wrRev" style="min-height:22vh" placeholder="根据上面的提示改写，改完对照左边"></textarea></div>
      </div>
    </div>

    <div class="wr-box">
      <div class="wr-lbl">参考范文 · ${esc(it.benchmarkLevel||'CLB 8')}</div>
      <div id="wrBenchWrap"></div>
    </div>

    <button class="btn btn-p" id="wrCopy">📋 复制给 Claude 批改</button>
    <button class="btn btn-g wr-go" id="wrNext">下一题 →</button>
    <div class="rd-tip">自评只是让你自己过一遍标准；真正的批改把上面复制给 Claude。</div>`;

  // 四维自评
  const dimBox=document.getElementById('wrDims');
  dimBox.innerHTML = WR_DIMS.map(d=>`
    <div class="wr-dim">
      <div class="wr-dim-h"><span>${d.name}</span><span style="color:var(--t3);font-weight:600">${d.zh}</span><span class="sc" id="sc-${d.k}">—</span></div>
      <div class="wr-chips" data-k="${d.k}">${WR_BANDS.map(b=>`<button class="wr-chip" data-v="${b.v}">${b.t}<br>${b.v}</button>`).join('')}</div>
    </div>`).join('');
  const paintScores=()=>{
    let sum=0, all=true;
    WR_DIMS.forEach(d=>{
      const v=c.scores[d.k];
      document.getElementById('sc-'+d.k).textContent = v==null?'—':v;
      if(v==null) all=false; else sum+=v;
    });
    const el=document.getElementById('wrTotal');
    el.innerHTML = all
      ? `总分 ${sum} / 48　→　估算 <span class="lv">${wrBand(sum)}</span>`
      : `总分 — / 48　<span style="font-weight:600;color:var(--t3)">（四维都选完才显示）</span>`;
  };
  dimBox.querySelectorAll('.wr-chips').forEach(row=>{
    const k=row.dataset.k;
    row.querySelectorAll('.wr-chip').forEach(b=>{
      if(c.scores[k]===+b.dataset.v) b.classList.add('on');
      b.onclick=()=>{
        c.scores[k]=+b.dataset.v; save();
        row.querySelectorAll('.wr-chip').forEach(x=>x.classList.toggle('on', x===b));
        paintScores();
      };
    });
  });
  paintScores();

  // 修改稿
  const rev=document.getElementById('wrRev');
  rev.value = c.revised||'';
  const paintRev=()=>{ document.getElementById('wrRevWc').textContent = '（'+wcount(rev.value)+' 词）'; };
  let rdeb=null;
  rev.addEventListener('input',()=>{ paintRev(); clearTimeout(rdeb); rdeb=setTimeout(()=>{ c.revised=rev.value; save(); },700); });
  paintRev();

  // 范文：提交后才解锁，且再点一次才展开——避免顺手就抄
  const wrap=document.getElementById('wrBenchWrap');
  wrap.innerHTML = `<div class="wr-lock" id="wrReveal">🔒 点击展开范文（建议先写完修改稿再看）</div>`;
  document.getElementById('wrReveal').onclick=()=>{
    wrap.innerHTML = `<div class="wr-bench">${esc(it.benchmarkAnswer||'（此题暂无范文）')}</div>`;
  };

  document.getElementById('wrCopy').onclick=()=>wrCopyForClaude(it,c);
  document.getElementById('wrNext').onclick=()=>{ S.wrCur=null; save(); renderWrPick(); };
}

function wrBand(sum){                       // 粗略换算，仅作自我参照
  if(sum>=44) return 'CLB 10+';
  if(sum>=38) return 'CLB 9';
  if(sum>=32) return 'CLB 8';
  if(sum>=26) return 'CLB 7';
  if(sum>=20) return 'CLB 6';
  return 'CLB 5 及以下';
}

function wrCopyForClaude(it,c){
  const txt =
`请按 CELPIP 四维标准批改我的写作（Content & Coherence / Vocabulary / Readability / Task Fulfillment，各 0–12）。

【题目】${it.type==='task1'?'Task 1 邮件':'Task 2 观点'}
${it.situation}
要求：
${it.points.map((p,i)=>(i+1)+'. '+p).join('\n')}

【我的作文】（${wcount(c.draft)} 词，用时 ${mmss(c.usedMs)}）
${c.draft}
${c.revised?`\n【我的修改稿】（${wcount(c.revised)} 词）\n${c.revised}`:''}`;
  const done=()=>{ const b=document.getElementById('wrCopy'); b.textContent='✅ 已复制，去粘给 Claude'; setTimeout(()=>b.textContent='📋 复制给 Claude 批改',2500); };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(done, ()=>wrFallbackCopy(txt));
  } else wrFallbackCopy(txt);
}
function wrFallbackCopy(txt){               // file:// 下剪贴板可能被拦，退回手动全选
  const ta=document.createElement('textarea');
  ta.value=txt; ta.style.cssText='position:fixed;top:8vh;left:5%;width:90%;height:60vh;z-index:99;font-size:13px';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); }catch{}
  alert('已全选，按 Ctrl+C 复制，然后点确定关闭。');
  ta.remove();
}

function showView(which){
  if(which!=='write') wrLeave();
  document.getElementById('vPlay').classList.toggle('on', which==='play');
  document.getElementById('vColl').classList.toggle('on', which==='coll');
  document.getElementById('vRead').classList.toggle('on', which==='read');
  document.getElementById('vWrite').classList.toggle('on', which==='write');
  document.getElementById('vSync').classList.toggle('on', which==='sync');
  if(which==='sync') renderSync();
  if(which==='coll') renderCollection();
  if(which==='play') resumePlay();
  if(which!=='read'&&which!=='write') window.scrollTo(0,0);
}
document.getElementById('btnColl').onclick=()=>showView('coll');
document.getElementById('btnSync').onclick=()=>showView('sync');
document.getElementById('syBack').onclick=()=>showView('play');
document.getElementById('btnBack').onclick=()=>showView('play');

/* ═══════════════ 云同步面板 ═══════════════ */
let syTab = 'signin';

function syStat(){
  return { off:'未登录', pending:'待同步', syncing:'同步中…', ok:'已同步', err:'同步失败', offline:'离线（已排队）' }[syncStatus] || '—';
}

function renderSync(){
  const body = document.getElementById('syBody');
  const learned = Object.keys(S.words||{}).length;

  if(!SUPA_URL || !SUPA_KEY){
    body.innerHTML = `<div class="sy-box"><div class="sy-title">云同步未配置</div>
      <div class="sy-msg info on">这个版本没有注入 Supabase 配置，进度只存在本机浏览器里。</div></div>`;
    return;
  }

  if(!AUTH){
    body.innerHTML = `
      <div class="sy-box">
        <div class="sy-title">登录后，手机和电脑的进度会自动互通</div>
        <div class="sy-tabs">
          <button class="sy-tab ${syTab==='signin'?'on':''}" data-t="signin">登录</button>
          <button class="sy-tab ${syTab==='signup'?'on':''}" data-t="signup">首次注册</button>
        </div>
        <input class="sy-in" id="syEmail" type="email" autocomplete="email" placeholder="邮箱">
        <input class="sy-in" id="syPw" type="password" autocomplete="current-password" placeholder="密码（至少 6 位）">
        <button class="btn btn-p" id="syGo" style="margin-top:2px">${syTab==='signup'?'注册并同步 →':'登录 →'}</button>
        <div class="sy-msg" id="syMsg"></div>
      </div>
      <div class="sy-box">
        <div class="sy-title">本机当前进度</div>
        <div class="sy-row"><span>已学词条</span><span>${learned}</span></div>
        <div class="sy-row"><span>累计 XP</span><span>${S.xp||0}</span></div>
        <div class="sy-row"><span>连击</span><span>${S.streak||0} 天</span></div>
        <div class="sy-msg info on">登录时会把本机进度和云端<b>合并</b>，逐字段取更靠前的一方，不会互相覆盖。</div>
      </div>`;

    body.querySelectorAll('.sy-tab').forEach(b => b.onclick = () => { syTab = b.dataset.t; renderSync(); });
    body.querySelector('#syGo').onclick = async () => {
      const em = body.querySelector('#syEmail').value.trim();
      const pw = body.querySelector('#syPw').value;
      const msg = body.querySelector('#syMsg');
      if(!em || pw.length < 6){ msg.className='sy-msg err on'; msg.textContent='请填邮箱，密码至少 6 位'; return; }
      msg.className='sy-msg info on'; msg.textContent='处理中…';
      try{
        await authGo(syTab, em, pw);
        await syncNow();
        renderSync();
      }catch(e){
        msg.className='sy-msg err on'; msg.textContent = e.message;
      }
    };
    return;
  }

  body.innerHTML = `
    <div class="sy-box">
      <div class="sy-title">☁️ ${AUTH.email}</div>
      <div class="sy-row"><span>状态</span><span>${syStat()}</span></div>
      <div class="sy-row"><span>上次同步</span><span>${lastSyncAt ? new Date(lastSyncAt).toLocaleTimeString('zh-CN') : '—'}</span></div>
      <div class="sy-row"><span>已学词条</span><span>${learned}</span></div>
      <div class="sy-row"><span>累计 XP</span><span>${S.xp||0}</span></div>
      ${syncNote ? `<div class="sy-msg err on">${syncNote}</div>` : ''}
      <button class="btn btn-p" id="syNow" style="margin-top:10px">立即同步 ↻</button>
      <button class="btn btn-g" id="syOut">退出登录</button>
    </div>
    <div class="sy-box">
      <div class="sy-title">备份</div>
      <div class="sy-msg info on">免费版 Supabase 连续 7 天无活动会暂停项目。存一份本地副本更保险。</div>
      <button class="btn btn-g" id="syExp" style="margin-top:8px">导出进度 JSON</button>
    </div>`;

  body.querySelector('#syNow').onclick = async () => { await syncNow(); renderSync(); };
  body.querySelector('#syOut').onclick = () => {
    if(!confirm('退出后本机进度仍保留在浏览器里，只是不再同步。确定？')) return;
    setAuth(null); setSync('off'); renderSync();
  };
  body.querySelector('#syExp').onclick = () => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([JSON.stringify(S,null,2)], {type:'application/json'}));
    a.download = `wordrush-${today()}.json`; a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
  };
}

/* 启动时若已登录，先拉一次云端（把另一台设备的进度合进来） */
if(cloudReady()){ setSync('pending'); syncNow(); } else { paintSyncDot(); }

/* Service worker：离线可用 + 加到主屏。file:// 下注册会失败，忽略即可。 */
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(()=>{}));
}
document.getElementById('btnWrite').onclick=()=>openWriting();
document.getElementById('wrBack').onclick=()=>showView('play');
document.getElementById('btnMute').onclick=()=>{ S.muted=!S.muted; save(); document.getElementById('btnMute').textContent=S.muted?'🔇':'🔊'; if(S.muted) speechSynthesis.cancel(); };

/* ═══════════════ 空状态 ═══════════════ */
function renderEmpty(){
  locked=false;
  document.getElementById('card').className='card pop';
  document.getElementById('card').innerHTML=`
    <div class="learn-body" style="padding:20px 0">
      <div style="font-size:52px">✅</div>
      <div style="font-size:19px;font-weight:900;margin-top:10px">当前这批都复习完啦！</div>
      <div class="sub" style="font-style:normal;color:var(--t2);margin-top:8px">休息一下，晚点再来会有更多词。</div>
    </div>
    <button class="btn btn-p" id="againBtn">再来一轮 →</button>`;
  document.getElementById('againBtn').onclick=()=>{ rebuildDeck(); advance(); };
}

/* ═══════════════ 键盘 ═══════════════ */
document.addEventListener('keydown',e=>{
  if(/^(INPUT|TEXTAREA)$/.test((e.target&&e.target.tagName)||'')) return;   // 拼写产出输入框内不触发快捷键
  if(document.getElementById('overlay').classList.contains('show')){ if(e.key==='Enter'||e.key===' '){document.getElementById('rBtn').click();e.preventDefault();} return; }
  const k=e.key.toUpperCase();
  const pick = i => document.querySelector(`.view.on .opt[data-i="${i}"]`);   // 只作用于当前可见的页面
  if('ABCD'.includes(k)){ const b=pick('ABCD'.indexOf(k)); if(b && !b.disabled) b.click(); }
  else if(e.key==='1'||e.key==='2'||e.key==='3'||e.key==='4'){ const b=pick(+e.key-1); if(b && !b.disabled) b.click(); }
  else if(e.key==='Enter'||e.key===' '){
    // 只在当前可见页面里找按钮；vPlay 的全局 id 兜底仅在 vPlay 可见时才用，
    // 否则在阅读/写作页按回车会误触发隐藏的背词卡片
    const g=document.querySelector('.view.on #rdGo, .view.on #rdCont, .view.on #rdBackBtn, .view.on .wr-go')
         || (document.getElementById('vPlay').classList.contains('on')
             ? (document.getElementById('go')||document.getElementById('contBtn')||document.getElementById('againBtn')) : null);
    if(g){g.click();e.preventDefault();}
  }
  else if(k==='R' && !document.getElementById('vRead').classList.contains('on')){ openReading(); }
  else if(k==='W' && !document.getElementById('vWrite').classList.contains('on')){ openWriting(); }
});

/* 睡眠/唤醒、切走再切回后主动唤醒音频，避免下一次点击"吞音" */
document.addEventListener('visibilitychange',()=>{
  if(!document.hidden){
    const c=AC; if(c&&c.state!=='running') c.resume();
    // 切回来：写作台继续计时
    if(S.wrCur && !S.wrCur.submitted && document.getElementById('vWrite').classList.contains('on') && !S.wrCur.resumedAt){
      S.wrCur.resumedAt = Date.now(); save();
      if(!wrTick){ wrTick=setInterval(tickWr,1000); tickWr(); }
    }
  } else {
    // 切走：暂停计时并把草稿落盘，别把时间算在没在写的时候
    const ta=document.getElementById('wrTa');
    if(S.wrCur && !S.wrCur.submitted && ta) S.wrCur.draft = ta.value;
    wrLeave();
  }
});

/* ═══════════════ 启动 ═══════════════ */
document.getElementById('btnMute').textContent=S.muted?'🔇':'🔊';
todayReading();   // 确定今天读哪篇（旧存档也会在这里补上阅读字段）
updateHUD();
updateReadBtn();
nextCard();   // 打开即出卡片
</script>
